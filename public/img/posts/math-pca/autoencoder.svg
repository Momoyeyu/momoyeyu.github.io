		text { fill:var(--fg); } .lbl { font:14px "Helvetica Neue",Helvetica,Arial,sans-serif; } .math { font:italic 16px "Times New Roman",Times,serif; }
	</style>
	<defs><marker id="arw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--step-stroke)"/></marker></defs>
	<g stroke="var(--step-stroke)" stroke-width="1.3" stroke-dasharray="5 4" fill="none"><path d="M103 33 L197 63 M103 197 L197 167 M253 63 L347 102 M253 167 L347 128 M403 102 L497 63 M403 128 L497 167 M553 63 L647 33 M553 167 L647 197"/></g>
	<g fill="var(--expert-fill)" stroke="var(--expert-stroke)" stroke-width="1.8"><rect x="57" y="40" width="46" height="150" rx="5"/><rect x="207" y="67" width="46" height="96" rx="5"/><rect x="507" y="67" width="46" height="96" rx="5"/><rect x="657" y="40" width="46" height="150" rx="5"/></g>
	<rect x="357" y="102" width="46" height="26" rx="5" fill="var(--accent)" fill-opacity=".25" stroke="var(--router-stroke)" stroke-width="1.8"/>
	<g class="math" text-anchor="middle"><text x="80" y="122">x</text><text x="230" y="122">h</text><text x="380" y="122">z</text><text x="530" y="122">h′</text><text x="680" y="122">x̂</text></g>
	<g class="lbl" text-anchor="middle" style="font-size:12px"><text x="80" y="212">784</text><text x="230" y="212">128</text><text x="380" y="212">2</text><text x="530" y="212">128</text><text x="680" y="212">784</text></g>
	<g class="lbl" text-anchor="middle"><text x="155" y="22">编码器 E</text><text x="380" y="80">瓶颈</text><text x="605" y="22">解码器 D</text></g>
	<g stroke="var(--step-stroke)" stroke-width="1.4" fill="none" marker-end="url(#arw2)"><path d="M30 115 H49"/></g>
	<g stroke="var(--step-stroke)" stroke-width="1.4" fill="none" marker-end="url(#arw2)"><path d="M711 115 H718" opacity="0"/></g>
</svg>
