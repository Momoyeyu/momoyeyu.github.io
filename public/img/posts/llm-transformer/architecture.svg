<rect x="550" y="210" width="240" height="42" rx="7" class="box a"/>
<text x="670.0" y="238.0" class="" text-anchor="middle">FFN</text>
<rect x="550" y="145" width="240" height="42" rx="7" class="box b"/>
<text x="670.0" y="173.0" class="" text-anchor="middle">Add &amp; Norm</text>
<path d="M222 475 V447" class="arrow"/>
<path d="M222 405 V342" class="arrow"/>
<path d="M222 300 V272" class="arrow"/>
