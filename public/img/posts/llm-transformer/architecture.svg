<path d="M670 145 V90 H880 V55" class="arrow"/>
<text x="710" y="75" class="small" text-anchor="middle">Linear → Softmax</text>
<text x="450" y="755" class="small" text-anchor="middle">各子层：Dropout → 残差相加 → LayerNorm</text>
</svg>
