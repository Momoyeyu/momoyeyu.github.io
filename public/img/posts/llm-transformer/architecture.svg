<text x="222.5" y="433.0" class="" text-anchor="middle">Add &amp; Norm</text>
<rect x="110" y="300" width="225" height="42" rx="7" class="box a"/>
<text x="222.5" y="328.0" class="" text-anchor="middle">FFN</text>
<rect x="110" y="230" width="225" height="42" rx="7" class="box b"/>
<text x="222.5" y="258.0" class="" text-anchor="middle">Add &amp; Norm</text>
<rect x="550" y="490" width="240" height="42" rx="7" class="box a"/>
<text x="670.0" y="518.0" class="" text-anchor="middle">Masked Attention</text>
