<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MLA 数据流：输入经联合压缩得到隐向量 c^KV，再分别解压出 K 与 V；位置信息走独立的解耦 RoPE 通道；虚线框内是需要缓存的张量">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--expert-fill: #dce9f7;
			--expert-stroke: #7b9cc4;
			--router-fill: #f5e9c9;
			--router-stroke: #b8912f;
			--step-fill: #eef1f4;
			--step-stroke: #9aa5b1;
			--gate-fill: #ffffff;
			--accent: #e0a800;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--expert-fill: #26364d;
				--expert-stroke: #6c8ebf;
				--router-fill: #4a3d1e;
				--router-stroke: #c9a53f;
				--step-fill: #2a2f36;
				--step-stroke: #6b7684;
				--gate-fill: #1e1e1e;
				--accent: #e8c547;
			}
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
		.math { font-family: "Times New Roman", Times, serif; font-style: italic; }
		.tag { fill: var(--accent); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; }
		.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
		.box { stroke-width: 1.6; rx: 9; }
	</style>
	<defs>
		<marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
		</marker>
	</defs>

	<!-- input -->
	<rect x="330" y="26" width="90" height="38" class="box" fill="var(--expert-fill)" stroke="var(--expert-stroke)"/>
	<text x="375" y="51" class="math" font-size="17" text-anchor="middle">h<tspan baseline-shift="sub" font-size="11">t</tspan></text>

	<!-- down projections -->
	<rect x="90"  y="105" width="86" height="34" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="133" y="128" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">DQ</tspan></text>
	<rect x="335" y="105" width="86" height="34" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="378" y="128" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">DKV</tspan></text>
	<rect x="585" y="105" width="86" height="34" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="628" y="128" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">KR</tspan></text>

	<path d="M375,64 L133,103" class="edge" marker-end="url(#arw)"/>
	<path d="M375,64 L378,103" class="edge" marker-end="url(#arw)"/>
	<path d="M375,64 L628,103" class="edge" marker-end="url(#arw)"/>

	<!-- latents / decoupled key -->
	<rect x="90"  y="185" width="86" height="36" class="box" fill="var(--step-fill)" stroke="var(--step-stroke)"/>
	<text x="133" y="209" class="math" font-size="15" text-anchor="middle">c<tspan baseline-shift="super" font-size="10">Q</tspan></text>

	<!-- cache region -->
	<rect x="325" y="175" width="356" height="56" class="box" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="7 5" rx="12"/>
	<text x="503" y="209" class="tag" text-anchor="middle">KV Cache</text>

	<rect x="335" y="185" width="86" height="36" class="box" fill="var(--router-fill)" stroke="var(--router-stroke)"/>
	<text x="378" y="209" class="math" font-size="15" text-anchor="middle">c<tspan baseline-shift="super" font-size="10">KV</tspan></text>
	<rect x="585" y="185" width="86" height="36" class="box" fill="var(--router-fill)" stroke="var(--router-stroke)"/>
	<text x="628" y="209" class="math" font-size="15" text-anchor="middle">k<tspan baseline-shift="super" font-size="10">R</tspan></text>

	<path d="M133,139 L133,183" class="edge" marker-end="url(#arw)"/>
	<path d="M378,139 L378,183" class="edge" marker-end="url(#arw)"/>
	<path d="M628,139 L628,183" class="edge" marker-end="url(#arw)"/>
	<text x="648" y="166" class="math" font-size="14">RoPE</text>

	<!-- up projections -->
	<rect x="30"  y="265" width="86" height="34" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="73"  y="288" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">UQ</tspan></text>
	<rect x="170" y="265" width="86" height="34" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="213" y="288" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">QR</tspan></text>
	<rect x="270" y="265" width="86" height="34" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="313" y="288" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">UK</tspan></text>
	<rect x="490" y="265" width="86" height="34" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="533" y="288" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">UV</tspan></text>

	<path d="M133,221 L73,263" class="edge" marker-end="url(#arw)"/>
	<path d="M133,221 L213,263" class="edge" marker-end="url(#arw)"/>
	<path d="M378,221 L313,263" class="edge" marker-end="url(#arw)"/>
	<path d="M378,221 L533,263" class="edge" marker-end="url(#arw)"/>

	<!-- concat cells -->
	<rect x="60"  y="345" width="98" height="36" class="box" fill="var(--expert-fill)" stroke="var(--expert-stroke)"/>
	<text x="109" y="369" class="math" font-size="15" text-anchor="middle">q<tspan baseline-shift="super" font-size="10">C</tspan></text>
	<rect x="158" y="345" width="98" height="36" class="box" fill="var(--router-fill)" stroke="var(--router-stroke)"/>
	<text x="207" y="369" class="math" font-size="15" text-anchor="middle">q<tspan baseline-shift="super" font-size="10">R</tspan></text>
	<rect x="270" y="345" width="98" height="36" class="box" fill="var(--expert-fill)" stroke="var(--expert-stroke)"/>
	<text x="319" y="369" class="math" font-size="15" text-anchor="middle">k<tspan baseline-shift="super" font-size="10">C</tspan></text>
	<rect x="368" y="345" width="98" height="36" class="box" fill="var(--router-fill)" stroke="var(--router-stroke)"/>
	<text x="417" y="369" class="math" font-size="15" text-anchor="middle">k<tspan baseline-shift="super" font-size="10">R</tspan></text>
	<rect x="480" y="345" width="96" height="36" class="box" fill="var(--expert-fill)" stroke="var(--expert-stroke)"/>
	<text x="528" y="369" class="math" font-size="15" text-anchor="middle">v<tspan baseline-shift="super" font-size="10">C</tspan></text>

	<path d="M73,299 L109,343" class="edge" marker-end="url(#arw)"/>
	<path d="M213,299 L207,343" class="edge" marker-end="url(#arw)"/>
	<text x="230" y="330" class="math" font-size="14">RoPE</text>
	<path d="M313,299 L319,343" class="edge" marker-end="url(#arw)"/>
	<path d="M533,299 L528,343" class="edge" marker-end="url(#arw)"/>
	<!-- cached k^R routes into k concat -->
	<path d="M628,221 L628,318 L462,318 L462,343" class="edge" marker-end="url(#arw)"/>

	<!-- concat labels (bottom-right free zone, clear of softmax edges) -->
	<text x="578" y="397" class="math" font-size="14">q<tspan baseline-shift="sub" font-size="9">i</tspan> = [ q<tspan baseline-shift="super" font-size="9">C</tspan> ; q<tspan baseline-shift="super" font-size="9">R</tspan> ]</text>
	<text x="578" y="416" class="math" font-size="14">k<tspan baseline-shift="sub" font-size="9">i</tspan> = [ k<tspan baseline-shift="super" font-size="9">C</tspan> ; k<tspan baseline-shift="super" font-size="9">R</tspan> ]</text>

	<!-- attention -->
	<rect x="240" y="424" width="210" height="40" class="box" fill="var(--router-fill)" stroke="var(--router-stroke)"/>
	<text x="345" y="449" class="math" font-size="14" text-anchor="middle">softmax( q·k / √D ) · v</text>
	<path d="M158,381 L300,422" class="edge" marker-end="url(#arw)"/>
	<path d="M368,381 L345,422" class="edge" marker-end="url(#arw)"/>
	<path d="M528,381 C528,414 480,414 436,420" class="edge" marker-end="url(#arw)"/>

	<!-- output projection -->
	<rect x="500" y="428" width="70" height="32" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<text x="535" y="450" class="math" font-size="15" text-anchor="middle">W<tspan baseline-shift="super" font-size="10">O</tspan></text>
	<path d="M450,444 L498,444" class="edge" marker-end="url(#arw)"/>
	<rect x="596" y="428" width="64" height="32" class="box" fill="var(--expert-fill)" stroke="var(--expert-stroke)"/>
	<text x="628" y="450" class="math" font-size="16" text-anchor="middle">u<tspan baseline-shift="sub" font-size="10">t</tspan></text>
	<path d="M570,444 L594,444" class="edge" marker-end="url(#arw)"/>
</svg>
