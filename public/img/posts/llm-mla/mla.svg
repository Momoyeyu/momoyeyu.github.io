<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">MLA：共享隐向量，保留各头投影</title><desc id="desc">输入经下投影得到共享隐向量 cKV，缓存只保存该向量。不同上投影分块生成每个头自己的 K 和 V；吸收计算可以绕过显式还原步骤。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}
.title{font-size:26px;font-weight:600}.head{font-size:22px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.num{font-size:14px}.operator{font-size:22px;fill:var(--muted)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.panel{stroke-opacity:.5}.selected{stroke-width:2.3}.faint{opacity:.4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}
.route{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)}
.option{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4;opacity:.35;marker-end:url(#arrow)}
.divider{fill:none;stroke:var(--line);stroke-width:1;opacity:.45}.glyph{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linecap:round;opacity:.65}.score{fill:var(--accent)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<text x="450" y="40" class="title" text-anchor="middle">MLA：共享隐向量，保留各头投影</text>
<rect x="350" y="85" width="200" height="45" rx="7" class="box"/>
<text x="450.0" y="114.5" class="" text-anchor="middle">输入 hₜ</text>
<path d="M450 130 V165" class="arrow"/>
<rect x="350" y="165" width="200" height="45" rx="7" class="box b"/>
<text x="450.0" y="194.5" class="" text-anchor="middle">下投影 Wᴰᴷⱽ</text>
<path d="M450 210 V250" class="arrow"/>
<rect x="340" y="250" width="220" height="36" rx="7" class="box a"/>
<path d="M350.0 259 v18" class="glyph"/>
<path d="M378.57142857142856 259 v18" class="glyph"/>
<path d="M407.14285714285717 259 v18" class="glyph"/>
<path d="M435.7142857142857 259 v18" class="glyph"/>
<path d="M464.2857142857143 259 v18" class="glyph"/>
<path d="M492.8571428571429 259 v18" class="glyph"/>
<path d="M521.4285714285714 259 v18" class="glyph"/>
<text x="450" y="315" class="head" text-anchor="middle">缓存 cₜᴷⱽ · d_c 维</text>
<path d="M450 330 V355 H150 V390" class="arrow"/>
<rect x="50" y="390" width="200" height="45" rx="7" class="box b"/>
<text x="150.0" y="419.5" class="" text-anchor="middle">第 1 头的上投影</text>
<path d="M150 435 V460 H97 V485" class="arrow"/>
<path d="M150 460 H203 V485" class="arrow"/>
<rect x="50" y="485" width="94" height="42" rx="7" class="box a"/>
<text x="97.0" y="513.0" class="" text-anchor="middle">K1</text>
<rect x="156" y="485" width="94" height="42" rx="7" class="box c"/>
<text x="203.0" y="513.0" class="" text-anchor="middle">V1</text>
<path d="M450 330 V355 H450 V390" class="arrow"/>
<rect x="350" y="390" width="200" height="45" rx="7" class="box b"/>
<text x="450.0" y="419.5" class="" text-anchor="middle">第 2 头的上投影</text>
<path d="M450 435 V460 H397 V485" class="arrow"/>
<path d="M450 460 H503 V485" class="arrow"/>
<rect x="350" y="485" width="94" height="42" rx="7" class="box a"/>
<text x="397.0" y="513.0" class="" text-anchor="middle">K2</text>
<rect x="456" y="485" width="94" height="42" rx="7" class="box c"/>
<text x="503.0" y="513.0" class="" text-anchor="middle">V2</text>
<path d="M450 330 V355 H750 V390" class="arrow"/>
<rect x="650" y="390" width="200" height="45" rx="7" class="box b"/>
<text x="750.0" y="419.5" class="" text-anchor="middle">第 3 头的上投影</text>
<path d="M750 435 V460 H697 V485" class="arrow"/>
<path d="M750 460 H803 V485" class="arrow"/>
<rect x="650" y="485" width="94" height="42" rx="7" class="box a"/>
<text x="697.0" y="513.0" class="" text-anchor="middle">K3</text>
<rect x="756" y="485" width="94" height="42" rx="7" class="box c"/>
<text x="803.0" y="513.0" class="" text-anchor="middle">V3</text>
<text x="450" y="578" class="small" text-anchor="middle">图示显式还原路径；矩阵吸收让推理直接在隐空间计算</text>
</svg>
