<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="各注意力机制每 token 缓存元素数对比，对数刻度：MHA 约 197 万，GQA-8 约 12 万，MLA 约 3.5 万，MQA 约 1.5 万">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--expert-fill: #dce9f7;
			--expert-stroke: #7b9cc4;
			--router-fill: #f5e9c9;
			--router-stroke: #b8912f;
			--step-fill: #eef1f4;
			--step-stroke: #9aa5b1;
			--gate-fill: #ffffff;
			--accent: #e0a800;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--expert-fill: #26364d;
				--expert-stroke: #6c8ebf;
				--router-fill: #4a3d1e;
				--router-stroke: #c9a53f;
				--step-fill: #2a2f36;
				--step-stroke: #6b7684;
				--gate-fill: #1e1e1e;
				--accent: #e8c547;
			}
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
		.math { font-family: "Times New Roman", Times, serif; font-style: italic; }
		.guide { stroke: var(--step-stroke); stroke-width: 1; stroke-dasharray: 3 4; }
	</style>

	<text x="330" y="30" class="lbl" text-anchor="middle">DeepSeek-V2 配置下每 token 的缓存元素数（对数刻度）</text>

	<!-- log gridlines: 10^4, 10^5, 10^6 -->
	<line x1="170" y1="52" x2="170" y2="240" class="guide"/>
	<line x1="366" y1="52" x2="366" y2="240" class="guide"/>
	<line x1="561" y1="52" x2="561" y2="240" class="guide"/>
	<text x="170" y="256" class="math" font-size="13" text-anchor="middle">10<tspan baseline-shift="super" font-size="9">4</tspan></text>
	<text x="366" y="256" class="math" font-size="13" text-anchor="middle">10<tspan baseline-shift="super" font-size="9">5</tspan></text>
	<text x="561" y="256" class="math" font-size="13" text-anchor="middle">10<tspan baseline-shift="super" font-size="9">6</tspan></text>

	<!-- MHA -->
	<text x="160" y="84" class="lbl" text-anchor="end">MHA</text>
	<rect x="170" y="64" width="449" height="32" rx="5" fill="var(--expert-fill)" stroke="var(--expert-stroke)" stroke-width="1.6"/>
	<text x="627" y="86" class="math" font-size="14" text-anchor="end">1.97M</text>

	<!-- GQA-8 -->
	<text x="160" y="134" class="lbl" text-anchor="end">GQA-8</text>
	<rect x="170" y="114" width="213" height="32" rx="5" fill="var(--expert-fill)" stroke="var(--expert-stroke)" stroke-width="1.6"/>
	<text x="392" y="136" class="math" font-size="14">122.9K</text>

	<!-- MLA -->
	<text x="160" y="184" class="lbl" text-anchor="end">MLA</text>
	<rect x="170" y="164" width="105" height="32" rx="5" fill="var(--router-fill)" stroke="var(--accent)" stroke-width="2"/>
	<text x="283" y="186" class="math" font-size="14">34.6K</text>

	<!-- MQA -->
	<text x="160" y="234" class="lbl" text-anchor="end">MQA</text>
	<rect x="170" y="214" width="37" height="32" rx="5" fill="var(--expert-fill)" stroke="var(--expert-stroke)" stroke-width="1.6"/>
	<text x="215" y="236" class="math" font-size="14">15.4K</text>
</svg>
