<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">相同头数与维度下的缓存比较</title><desc id="desc">DeepSeek-V2 配置口径下，每 token 每层缓存：MHA 32768、GQA-8 2048、MLA 576、MQA 256 个元素。条长使用线性比例；底部单独展开 MLA，其缓存由 512 维内容缓存与 64 维位置缓存组成。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}
.title{font-size:26px;font-weight:600}.head{font-size:22px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.num{font-size:14px}.operator{font-size:22px;fill:var(--muted)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.panel{stroke-opacity:.5}.selected{stroke-width:2.3}.faint{opacity:.4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}
.route{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)}
.option{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4;opacity:.35;marker-end:url(#arrow)}
.divider{fill:none;stroke:var(--line);stroke-width:1;opacity:.45}.glyph{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linecap:round;opacity:.65}.score{fill:var(--accent)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<text x="450" y="40" class="title" text-anchor="middle">相同头数与维度下的缓存比较</text>
<text x="450" y="83" class="small" text-anchor="middle">每 token · 每层 · 元素数</text>
<text x="135" y="154" class="" text-anchor="end">MHA</text>
<rect x="165" y="130" width="590.0" height="32" rx="7" class="box a"/>
<text x="780" y="154" class="" text-anchor="start">32,768</text>
<text x="135" y="229" class="" text-anchor="end">GQA-8</text>
<rect x="165" y="205" width="36.875" height="32" rx="7" class="box a"/>
<text x="780" y="229" class="" text-anchor="start">2,048</text>
<text x="135" y="304" class="" text-anchor="end">MLA</text>
<rect x="165" y="280" width="10.37109375" height="32" rx="7" class="box a"/>
<text x="780" y="304" class="" text-anchor="start">576</text>
<text x="135" y="379" class="" text-anchor="end">MQA</text>
<rect x="165" y="355" width="4.609375" height="32" rx="7" class="box a"/>
<text x="780" y="379" class="" text-anchor="start">256</text>
<text x="450" y="425" class="head" text-anchor="middle">MLA 的 576 个元素</text>
<rect x="165" y="447" width="480" height="32" rx="7" class="box a"/>
<text x="405.0" y="470.0" class="" text-anchor="middle">内容 cᴷⱽ：512</text>
<rect x="645" y="447" width="90" height="32" rx="7" class="box c"/>
<text x="690.0" y="470.0" class="" text-anchor="middle">64</text>
<text x="780" y="470" class="small" text-anchor="middle">kᴿ</text>
</svg>
