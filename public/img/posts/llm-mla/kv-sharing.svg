<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">共享的是 K/V，query 仍各自独立</title><desc id="desc">以四个 query 头示意 MHA 的四份 KV、GQA 的两组 KV 和 MQA 的一份 KV。连线表示每个 query 头使用哪一份 KV。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}
.title{font-size:26px;font-weight:600}.head{font-size:22px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.num{font-size:14px}.operator{font-size:22px;fill:var(--muted)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.panel{stroke-opacity:.5}.selected{stroke-width:2.3}.faint{opacity:.4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}
.route{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)}
.option{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4;opacity:.35;marker-end:url(#arrow)}
.divider{fill:none;stroke:var(--line);stroke-width:1;opacity:.45}.glyph{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linecap:round;opacity:.65}.score{fill:var(--accent)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<text x="450" y="40" class="title" text-anchor="middle">共享的是 K/V，query 仍各自独立</text>
<text x="150" y="100" class="head" text-anchor="middle">MHA</text>
<text x="150" y="135" class="small" text-anchor="middle">4 份 KV</text>
<rect x="40.0" y="180" width="46" height="52" rx="7" class="box a"/>
<text x="63.0" y="213.0" class="" text-anchor="middle">KV</text>
<rect x="98.0" y="180" width="46" height="52" rx="7" class="box a"/>
<text x="121.0" y="213.0" class="" text-anchor="middle">KV</text>
<rect x="156.0" y="180" width="46" height="52" rx="7" class="box a"/>
<text x="179.0" y="213.0" class="" text-anchor="middle">KV</text>
<rect x="214.0" y="180" width="46" height="52" rx="7" class="box a"/>
<text x="237.0" y="213.0" class="" text-anchor="middle">KV</text>
<path d="M63.0 232 V260 H60 V305" class="arrow"/>
<rect x="37" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="60.0" y="333.0" class="" text-anchor="middle">Q1</text>
<path d="M121.0 232 V260 H120 V305" class="arrow"/>
<rect x="97" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="120.0" y="333.0" class="" text-anchor="middle">Q2</text>
<path d="M179.0 232 V260 H180 V305" class="arrow"/>
<rect x="157" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="180.0" y="333.0" class="" text-anchor="middle">Q3</text>
<path d="M237.0 232 V260 H240 V305" class="arrow"/>
<rect x="217" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="240.0" y="333.0" class="" text-anchor="middle">Q4</text>
<text x="450" y="100" class="head" text-anchor="middle">GQA</text>
<text x="450" y="135" class="small" text-anchor="middle">2 份 KV</text>
<rect x="398.0" y="180" width="46" height="52" rx="7" class="box a"/>
<text x="421.0" y="213.0" class="" text-anchor="middle">KV</text>
<rect x="456.0" y="180" width="46" height="52" rx="7" class="box a"/>
<text x="479.0" y="213.0" class="" text-anchor="middle">KV</text>
<path d="M421.0 232 V260 H360 V305" class="arrow"/>
<rect x="337" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="360.0" y="333.0" class="" text-anchor="middle">Q1</text>
<path d="M421.0 232 V260 H420 V305" class="arrow"/>
<rect x="397" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="420.0" y="333.0" class="" text-anchor="middle">Q2</text>
<path d="M479.0 232 V260 H480 V305" class="arrow"/>
<rect x="457" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="480.0" y="333.0" class="" text-anchor="middle">Q3</text>
<path d="M479.0 232 V260 H540 V305" class="arrow"/>
<rect x="517" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="540.0" y="333.0" class="" text-anchor="middle">Q4</text>
<text x="750" y="100" class="head" text-anchor="middle">MQA</text>
<text x="750" y="135" class="small" text-anchor="middle">1 份 KV</text>
<rect x="727.0" y="180" width="46" height="52" rx="7" class="box a"/>
<text x="750.0" y="213.0" class="" text-anchor="middle">KV</text>
<path d="M750.0 232 V260 H660 V305" class="arrow"/>
<rect x="637" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="660.0" y="333.0" class="" text-anchor="middle">Q1</text>
<path d="M750.0 232 V260 H720 V305" class="arrow"/>
<rect x="697" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="720.0" y="333.0" class="" text-anchor="middle">Q2</text>
<path d="M750.0 232 V260 H780 V305" class="arrow"/>
<rect x="757" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="780.0" y="333.0" class="" text-anchor="middle">Q3</text>
<path d="M750.0 232 V260 H840 V305" class="arrow"/>
<rect x="817" y="305" width="46" height="42" rx="7" class="box c"/>
<text x="840.0" y="333.0" class="" text-anchor="middle">Q4</text>
<text x="450" y="410" class="small" text-anchor="middle">每 token 每层缓存：2 × KV 头数 × 每头维度</text>
</svg>
