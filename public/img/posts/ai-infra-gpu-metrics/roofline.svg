<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roofline 模型示意：横轴算术强度，纵轴可达性能，斜线为带宽天花板，横线为算力天花板，decode 落在带宽受限区，prefill 与训练落在算力受限区">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--roof: #4a7fbf;
			--mem-fill: #dce9f7;
			--pt-mem: #b06a6a;
			--pt-com: #4e9a51;
			--grid: #d0d5da;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--roof: #7fa9d9;
				--mem-fill: #1d2a3d;
				--pt-mem: #cf8f8f;
				--pt-com: #7fc47f;
				--grid: #3a4148;
			}
		}
		text { fill: var(--fg); }
		.axis { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; }
		.tick { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; opacity: 0.7; }
		.pt { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; }
		.ant { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; opacity: 0.85; }
		.grid { stroke: var(--grid); stroke-width: 1; }
		.frame { stroke: var(--line); stroke-width: 1.4; fill: none; }
		.roof { stroke: var(--roof); stroke-width: 2.2; fill: none; }
		.fill { fill: var(--mem-fill); opacity: 0.55; }
	</style>

	<!-- shaded achievable region under roof -->
	<polygon points="90,300 138.7,300 443.9,72.9 600,72.9 600,300" class="fill"/>

	<!-- frame + gridlines -->
	<rect x="90" y="50" width="510" height="250" class="frame"/>
	<line x1="192" y1="50" x2="192" y2="300" class="grid"/>
	<line x1="294" y1="50" x2="294" y2="300" class="grid"/>
	<line x1="396" y1="50" x2="396" y2="300" class="grid"/>
	<line x1="498" y1="50" x2="498" y2="300" class="grid"/>
	<line x1="90" y1="224.2" x2="600" y2="224.2" class="grid"/>
	<line x1="90" y1="148.4" x2="600" y2="148.4" class="grid"/>
	<line x1="90" y1="72.6" x2="600" y2="72.6" class="grid"/>

	<!-- roofline: bandwidth slope + compute ceiling -->
	<path d="M138.7,300 L443.9,72.9 L600,72.9" class="roof"/>

	<!-- annotations -->
	<text x="345" y="60" class="ant">峰值算力 ≈ 990 TFLOPS（H100 · FP16 dense）</text>
	<text x="240" y="180" class="ant" transform="rotate(-36.7 240 180)">带宽天花板：3.35 TB/s</text>
	<text x="443.9" y="315" class="tick" text-anchor="middle">AI* ≈ 295</text>
	<line x1="443.9" y1="72.9" x2="443.9" y2="300" class="grid" stroke-dasharray="4 4"/>

	<!-- workload points -->
	<circle cx="222.7" cy="237.4" r="6" fill="var(--pt-mem)"/>
	<text x="222.7" y="262" class="pt" text-anchor="middle">decode（AI≈2）</text>
	<text x="222.7" y="278" class="pt" text-anchor="middle" opacity="0.7">带宽受限</text>

	<circle cx="520" cy="72.9" r="6" fill="var(--pt-com)"/>
	<text x="520" y="96" class="pt" text-anchor="middle">prefill / 训练（AI≈数百）</text>
	<text x="520" y="112" class="pt" text-anchor="middle" opacity="0.7">算力受限</text>

	<!-- axis labels -->
	<text x="345" y="346" class="axis" text-anchor="middle">算术强度 AI（FLOP / byte，对数轴）</text>
	<text x="30" y="175" class="axis" text-anchor="middle" transform="rotate(-90 30 175)">可达性能（TFLOPS）</text>
	<text x="90" y="316" class="tick" text-anchor="middle">0.1</text>
	<text x="192" y="316" class="tick" text-anchor="middle">1</text>
	<text x="294" y="316" class="tick" text-anchor="middle">10</text>
	<text x="396" y="316" class="tick" text-anchor="middle">100</text>
	<text x="498" y="316" class="tick" text-anchor="middle">1000</text>
	<text x="600" y="316" class="tick" text-anchor="middle">10⁴</text>
	<text x="82" y="304" class="tick" text-anchor="end">1</text>
	<text x="82" y="228" class="tick" text-anchor="end">10</text>
	<text x="82" y="152" class="tick" text-anchor="end">100</text>
	<text x="82" y="76" class="tick" text-anchor="end">1000</text>
</svg>
