<svg viewBox="0 0 660 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="70B FP8 模型在不同 GPU 上的单流 decode 速度理论上限对比，仅由显存带宽决定">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--bar-fill: #d8ecd8;
			--bar-stroke: #6aa86a;
			--bar2-fill: #e6dcf2;
			--bar2-stroke: #8a6fc0;
			--thresh: #b06a6a;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--bar-fill: #24392b;
				--bar-stroke: #7fb37f;
				--bar2-fill: #35294d;
				--bar2-stroke: #9a7fd0;
				--thresh: #cf8f8f;
			}
		}
		text { fill: var(--fg); }
		.name { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; }
		.val { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; opacity: 0.85; }
		.tick { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; opacity: 0.7; }
		.note { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12.5px; font-style: italic; }
		.thr { fill: var(--thresh); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; }
		.bar { fill: var(--bar-fill); stroke: var(--bar-stroke); stroke-width: 1.4; }
		.bar2 { fill: var(--bar2-fill); stroke: var(--bar2-stroke); stroke-width: 1.4; }
		.threshold { stroke: var(--thresh); stroke-width: 1.4; stroke-dasharray: 5 4; }
	</style>

	<!-- formula note -->
	<text x="330" y="24" class="note" text-anchor="middle">70B FP8 · 每 token 读取 ≈ 70 GB：tokens/s ≈ 带宽 × 0.7 ÷ 70（理论上限）</text>

	<!-- human reading threshold at 20 t/s -> x = 150 + 20*6 = 270 -->
	<line x1="270" y1="40" x2="270" y2="276" class="threshold"/>
	<text x="278" y="52" class="thr">≈20 t/s 单人流畅阈值</text>

	<!-- bars: x = 150 + tps*6 -->
	<rect x="150" y="60" width="16.2" height="26" class="bar2"/>
	<rect x="150" y="98" width="107.4" height="26" class="bar"/>
	<rect x="150" y="136" width="120" height="26" class="bar"/>
	<rect x="150" y="174" width="201" height="26" class="bar"/>
	<rect x="150" y="212" width="288" height="26" class="bar"/>
	<rect x="150" y="250" width="462" height="26" class="bar"/>

	<!-- labels -->
	<text x="140" y="78" class="name" text-anchor="end">DGX Spark</text>
	<text x="140" y="116" class="name" text-anchor="end">RTX PRO 6000</text>
	<text x="140" y="154" class="name" text-anchor="end">A100 80G</text>
	<text x="140" y="192" class="name" text-anchor="end">H100</text>
	<text x="140" y="230" class="name" text-anchor="end">H200</text>
	<text x="140" y="268" class="name" text-anchor="end">B200</text>

	<text x="172" y="78" class="val">273 GB/s → 2.7 t/s</text>
	<text x="263" y="116" class="val">1792 GB/s → 18 t/s</text>
	<text x="276" y="154" class="val">2.0 TB/s → 20 t/s</text>
	<text x="357" y="192" class="val">3.35 TB/s → 33 t/s</text>
	<text x="444" y="230" class="val">4.8 TB/s → 48 t/s</text>
	<text x="596" y="268" class="val" text-anchor="end" fill="var(--fg)">7.7 TB/s → 77 t/s</text>

	<!-- axis -->
	<text x="150" y="298" class="tick">0</text>
	<text x="270" y="298" class="tick" text-anchor="middle">20</text>
	<text x="390" y="298" class="tick" text-anchor="middle">40</text>
	<text x="510" y="298" class="tick" text-anchor="middle">60</text>
	<text x="630" y="298" class="tick" text-anchor="end">80 tok/s</text>
</svg>
