<svg xmlns="http://www.w3.org/2000/svg" width="820" height="670" viewBox="0 0 820 670" role="img" aria-label="query 匹配各位置 key，通过 softmax 分配权重，再汇总 value"><title>query 匹配各位置 key，通过 softmax 分配权重，再汇总 value</title><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.head{font-size:19px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic;font-size:21px}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5;rx:10}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.rule{stroke:var(--line);stroke-width:1;opacity:.35}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="410" y="35" class="title" text-anchor="middle">注意力先判断去哪里找，再读取内容</text><rect x="230" y="70" width="360" height="70" class="box c"/><text x="410.0" y="98.5" class="" text-anchor="middle">鸟头位置的 query</text><text x="410.0" y="123.5" class="small" text-anchor="middle">当前需要补充的特征</text><path d="M410 140 V175 H150 V210" class="arrow "/><path d="M410 140 V210" class="arrow "/><path d="M410 175 H670 V210" class="arrow "/><rect x="40" y="210" width="220" height="70" class="box "/><text x="150.0" y="238.5" class="" text-anchor="middle">翅膀位置的 key</text><text x="150.0" y="263.5" class="small" text-anchor="middle">用于与 query 匹配</text><path d="M150 280 V315" class="arrow "/><rect x="300" y="210" width="220" height="70" class="box "/><text x="410.0" y="238.5" class="" text-anchor="middle">树叶位置的 key</text><text x="410.0" y="263.5" class="small" text-anchor="middle">用于与 query 匹配</text><path d="M410 280 V315" class="arrow "/><rect x="560" y="210" width="220" height="70" class="box "/><text x="670.0" y="238.5" class="" text-anchor="middle">天空位置的 key</text><text x="670.0" y="263.5" class="small" text-anchor="middle">用于与 query 匹配</text><path d="M670 280 V315" class="arrow "/><rect x="40" y="315" width="740" height="60" class="box b"/><text x="410.0" y="351.0" class="" text-anchor="middle">匹配分数 → softmax → 各位置的读取权重</text><path d="M150 375 V410" class="arrow "/><rect x="40" y="410" width="220" height="70" class="box a"/><text x="150.0" y="438.5" class="" text-anchor="middle">翅膀位置的 value</text><text x="150.0" y="463.5" class="small" text-anchor="middle">被权重加权的实际内容</text><path d="M410 375 V410" class="arrow "/><rect x="300" y="410" width="220" height="70" class="box a"/><text x="410.0" y="438.5" class="" text-anchor="middle">树叶位置的 value</text><text x="410.0" y="463.5" class="small" text-anchor="middle">被权重加权的实际内容</text><path d="M670 375 V410" class="arrow "/><rect x="560" y="410" width="220" height="70" class="box a"/><text x="670.0" y="438.5" class="" text-anchor="middle">天空位置的 value</text><text x="670.0" y="463.5" class="small" text-anchor="middle">被权重加权的实际内容</text><path d="M150 480 V510 H310 V545" class="arrow "/><path d="M410 480 V545" class="arrow "/><path d="M670 480 V510 H510 V545" class="arrow "/><rect x="190" y="545" width="440" height="65" class="box c"/><text x="410.0" y="583.5" class="" text-anchor="middle">加权汇总 → 更新鸟头位置的表示</text><text x="410" y="643" class="small" text-anchor="middle">语义标签用于说明；模型实际比较和汇总的都是数值向量</text></svg>