<svg xmlns="http://www.w3.org/2000/svg" width="820" height="705" viewBox="0 0 820 705" role="img" aria-label="100 个位置由4个地标共享搜索，每个query读取8个原始条目和4个摘要"><title>100 个位置由4个地标共享搜索，每个query读取8个原始条目和4个摘要</title><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.head{font-size:19px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic;font-size:21px}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5;rx:10}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.rule{stroke:var(--line);stroke-width:1;opacity:.35}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="410" y="35" class="title" text-anchor="middle">MiTA 把搜索结果共享给许多 query</text><rect x="150" y="70" width="520" height="65" class="box "/><text x="410.0" y="108.5" class="" text-anchor="middle">100 个图片位置，生成 query、key、value</text><path d="M410 135 V170" class="arrow "/><rect x="210" y="170" width="400" height="65" class="box b"/><text x="410.0" y="208.5" class="" text-anchor="middle">局部平均 query → 4 个地标</text><path d="M410 235 V270" class="arrow "/><rect x="110" y="270" width="600" height="70" class="box "/><text x="410.0" y="298.5" class="" text-anchor="middle">4 个地标各扫描全部 100 个 key</text><text x="410.0" y="323.5" class="small" text-anchor="middle">同一份分数，用于选候选和汇总摘要</text><path d="M250 340 V380" class="arrow "/><path d="M570 340 V380" class="arrow "/><rect x="30" y="380" width="380" height="85" class="box b"/><text x="220.0" y="416.0" class="" text-anchor="middle">4 组候选，每组 8 个原始 KV</text><text x="220.0" y="441.0" class="small" text-anchor="middle">供 query 选择其中一组</text><rect x="460" y="380" width="330" height="85" class="box a"/><text x="625.0" y="416.0" class="" text-anchor="middle">4 个全局摘要</text><text x="625.0" y="441.0" class="small" text-anchor="middle">所有 query 都可以读取</text><path d="M220 465 V500 H180 V555" class="arrow "/><path d="M625 465 V500 H640 V555" class="arrow "/><text x="410" y="540" class="small" text-anchor="middle">一个 query 与地标匹配，选定一组候选</text><rect x="140" y="555" width="540" height="85" class="box c"/><text x="410.0" y="591.0" class="" text-anchor="middle">8 个原始条目 + 4 个摘要</text><text x="410.0" y="616.0" class="small" text-anchor="middle">共同分配注意力 → 得到这个 query 的输出</text><text x="410" y="678" class="small" text-anchor="middle">多个 query 可选择同一组候选，各自计算读取权重</text></svg>