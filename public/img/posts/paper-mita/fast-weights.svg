<svg xmlns="http://www.w3.org/2000/svg" width="820" height="555" viewBox="0 0 820 555" role="img" aria-label="FFN 使用训练权重，Attention 用当前输入的 key value 构造网络"><title>FFN 使用训练权重，Attention 用当前输入的 key value 构造网络</title><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.head{font-size:19px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic;font-size:21px}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5;rx:10}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.rule{stroke:var(--line);stroke-width:1;opacity:.35}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="410" y="35" class="title" text-anchor="middle">把注意力看作一个临时网络</text><text x="30" y="85" class="head" text-anchor="start">FFN</text><text x="790" y="85" class="small" text-anchor="end">网络宽度由模型配置决定</text><rect x="30" y="110" width="120" height="76" class="box "/><text x="90.0" y="154.0" class="" text-anchor="middle">输入</text><path d="M150 148 H190" class="arrow "/><rect x="190" y="110" width="120" height="76" class="box b"/><text x="250.0" y="154.0" class="" text-anchor="middle">第一层权重</text><path d="M310 148 H350" class="arrow "/><rect x="350" y="110" width="120" height="76" class="box "/><text x="410.0" y="154.0" class="" text-anchor="middle">激活响应</text><path d="M470 148 H510" class="arrow "/><rect x="510" y="110" width="120" height="76" class="box b"/><text x="570.0" y="154.0" class="" text-anchor="middle">第二层权重</text><path d="M630 148 H670" class="arrow "/><rect x="670" y="110" width="120" height="76" class="box "/><text x="730.0" y="154.0" class="" text-anchor="middle">输出</text><rect x="30" y="300" width="120" height="76" class="box "/><text x="90.0" y="344.0" class="" text-anchor="middle">query</text><path d="M150 338 H190" class="arrow "/><rect x="190" y="300" width="120" height="76" class="box a"/><text x="250.0" y="344.0" class="" text-anchor="middle">匹配 key</text><path d="M310 338 H350" class="arrow "/><rect x="350" y="300" width="120" height="76" class="box "/><text x="410.0" y="344.0" class="" text-anchor="middle">softmax</text><path d="M470 338 H510" class="arrow "/><rect x="510" y="300" width="120" height="76" class="box a"/><text x="570.0" y="344.0" class="" text-anchor="middle">汇总 value</text><path d="M630 338 H670" class="arrow "/><rect x="670" y="300" width="120" height="76" class="box "/><text x="730.0" y="344.0" class="" text-anchor="middle">输出</text><text x="410" y="220" class="small" text-anchor="middle">使用训练得到的权重</text><path d="M30 245 H790" class="rule"/><text x="30" y="278" class="head" text-anchor="start">Attention</text><text x="790" y="278" class="small" text-anchor="end">上下文越长，中间节点越多</text><text x="410" y="414" class="small" text-anchor="middle">key、value 由当前输入生成，充当快权重</text><rect x="110" y="455" width="600" height="70" class="box c"/><text x="410.0" y="483.5" class="" text-anchor="middle">每个 KV 对，对应一个中间节点</text><text x="410.0" y="508.5" class="small" text-anchor="middle">可以选择少量原始节点，也可以压缩成少量新节点</text></svg>