<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
<title id="title">Attention 的快权重视角</title>
<desc id="desc">左侧 FFN 的两层连线由训练参数 W1 和 W2 决定，中间层宽度固定，使用逐元素激活。右侧 Attention 的两层连线分别由当前上下文生成的 K 和 V 决定，中间层有 N 个节点，每个节点对应一对 KV，并在这些节点之间使用 softmax。两边的图都以少量节点示意网络结构。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}
.title{font-size:26px;font-weight:600}.head{font-size:22px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.num{font-size:14px}.operator{font-size:22px;fill:var(--muted)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.panel{stroke-opacity:.5}.selected{stroke-width:2.3}.faint{opacity:.4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}
.route{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)}
.option{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4;opacity:.35;marker-end:url(#arrow)}
.divider{fill:none;stroke:var(--line);stroke-width:1;opacity:.45}.glyph{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linecap:round;opacity:.65}.score{fill:var(--accent)}

.math{font-family:'Times New Roman',serif;font-style:italic;font-size:22px}
.edge{fill:none;stroke:var(--line);stroke-width:1.15;opacity:.23}
.edge-strong{fill:none;stroke:var(--line);stroke-width:2;opacity:.85}
.annotation{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 4;marker-end:url(#arrow)}
.weight{fill:var(--accent)}.wire-a{stroke:var(--accent)}.rule{fill:none;stroke:var(--line);stroke-width:1;opacity:.3}
</style>
