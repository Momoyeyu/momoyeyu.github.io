<svg xmlns="http://www.w3.org/2000/svg" width="820" height="550" viewBox="0 0 820 550" role="img" aria-label="路由保留原始 KV，压缩生成摘要，MiTA 结合两条路径"><title>路由保留原始 KV，压缩生成摘要，MiTA 结合两条路径</title><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.head{font-size:19px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic;font-size:21px}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5;rx:10}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.rule{stroke:var(--line);stroke-width:1;opacity:.35}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="410" y="35" class="title" text-anchor="middle">缩减快权重网络的两条路径</text><text x="410" y="73" class="small" text-anchor="middle">原始 KV：每个色块代表一个中间节点</text><rect x="30" y="87" width="760" height="78" class="box "/><rect x="50" y="98" width="70" height="52" class="box b"/><text x="85.0" y="130.0" class="" text-anchor="middle">1</text><rect x="140" y="98" width="70" height="52" class="box "/><text x="175.0" y="130.0" class="" text-anchor="middle">2</text><rect x="230" y="98" width="70" height="52" class="box b"/><text x="265.0" y="130.0" class="" text-anchor="middle">3</text><rect x="320" y="98" width="70" height="52" class="box "/><text x="355.0" y="130.0" class="" text-anchor="middle">4</text><rect x="410" y="98" width="70" height="52" class="box "/><text x="445.0" y="130.0" class="" text-anchor="middle">5</text><rect x="500" y="98" width="70" height="52" class="box "/><text x="535.0" y="130.0" class="" text-anchor="middle">6</text><rect x="590" y="98" width="70" height="52" class="box "/><text x="625.0" y="130.0" class="" text-anchor="middle">7</text><rect x="680" y="98" width="70" height="52" class="box "/><text x="715.0" y="130.0" class="" text-anchor="middle">8</text><path d="M220 165 V175 H360 V225" class="arrow "/><path d="M600 165 V175 H760 V225" class="arrow "/><text x="215" y="210" class="small" text-anchor="middle">选择原始条目</text><text x="600" y="210" class="small" text-anchor="middle">汇总全部条目</text><rect x="45" y="225" width="340" height="155" class="box b"/><text x="215" y="260" class="head" text-anchor="middle">路由</text><rect x="95" y="282" width="90" height="55" class="box "/><text x="140.0" y="315.5" class="" text-anchor="middle">KV 1</text><rect x="245" y="282" width="90" height="55" class="box "/><text x="290.0" y="315.5" class="" text-anchor="middle">KV 3</text><text x="215" y="363" class="small" text-anchor="middle">细节仍在，未选条目不直接读取</text><rect x="435" y="225" width="340" height="155" class="box a"/><text x="605" y="260" class="head" text-anchor="middle">压缩</text><rect x="470" y="282" width="115" height="55" class="box "/><text x="527.5" y="315.5" class="" text-anchor="middle">摘要 1</text><rect x="625" y="282" width="115" height="55" class="box "/><text x="682.5" y="315.5" class="" text-anchor="middle">摘要 2</text><text x="605" y="363" class="small" text-anchor="middle">覆盖全局，细节汇入少量向量</text><path d="M215 380 V420 H330 V450" class="arrow "/><path d="M605 380 V420 H490 V450" class="arrow "/><rect x="190" y="450" width="440" height="75" class="box c"/><text x="410.0" y="481.0" class="" text-anchor="middle">MiTA 同时访问两组条目</text><text x="410.0" y="506.0" class="small" text-anchor="middle">用一次共同的 softmax 分配权重</text></svg>