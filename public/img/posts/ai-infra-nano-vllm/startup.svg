<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 267" role="img" aria-labelledby="title desc">
<title id="title">启动前要准备什么</title>
<desc id="desc">权重装载后通过预热确定能分给缓存的显存，按配置选择是否捕获 CUDA Graph。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="267" rx="12" class="bg"/>
<rect x="30" y="26" width="200" height="66" rx="8" class="neutral"/><text x="130.0" y="56.0" class="label" text-anchor="middle">读取配置</text><text x="130.0" y="80.0" class="sub" text-anchor="middle">模型形状与 dtype</text><path d="M230 59.0 H262" class="flow"/><rect x="262" y="26" width="200" height="66" rx="8" class="violet"/><text x="362.0" y="56.0" class="label" text-anchor="middle">装载权重</text><text x="362.0" y="80.0" class="sub" text-anchor="middle">构建本 rank 的模型</text><path d="M462 59.0 H494" class="flow"/><rect x="494" y="26" width="200" height="66" rx="8" class="blue"/><text x="594.0" y="56.0" class="label" text-anchor="middle">执行预热</text><text x="594.0" y="80.0" class="sub" text-anchor="middle">测前向峰值</text><path d="M694 59.0 H726" class="flow"/><rect x="726" y="26" width="200" height="66" rx="8" class="teal"/><text x="826.0" y="56.0" class="label" text-anchor="middle">分配 KV 池</text><text x="826.0" y="80.0" class="sub" text-anchor="middle">按预算划分物理块</text><path d="M826 92 V139 H759" class="flow"/><path d="M541.0 139 L650 108.5 L759.0 139 L650 169.5 Z" class="amber"/><text x="650" y="145" class="label" text-anchor="middle">enforce_eager？</text><path d="M541 139 H378" class="flow"/><text x="456" y="130" class="small" text-anchor="middle">否</text><rect x="131" y="108" width="247" height="61" rx="8" class="blue"/><text x="254.5" y="135.5" class="label" text-anchor="middle">捕获解码图</text><text x="254.5" y="159.5" class="sub" text-anchor="middle">固定输入缓冲区</text><path d="M650 171 V212 H570" class="flow"/><text x="683" y="196" class="small" text-anchor="middle">是</text><path d="M254 169 V212 H390" class="flow"/><rect x="390" y="181" width="180" height="61" rx="8" class="teal"/><text x="480.0" y="208.5" class="label" text-anchor="middle">引擎就绪</text><text x="480.0" y="232.5" class="sub" text-anchor="middle">创建调度器</text>
</svg>
