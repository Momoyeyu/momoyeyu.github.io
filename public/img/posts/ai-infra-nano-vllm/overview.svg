<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">nano-vLLM 模块总览</title>
<desc id="desc">四层房子图，从 Python 入口向下列出编排、调度、执行及运行时的九个模块。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="510" rx="12" class="bg"/>
<path d="M42 133 L480 15 L918 133 Z" class="base"/><text x="480" y="64" class="roof-title" text-anchor="middle">Python 接口</text><text x="480" y="94" class="roof-title" text-anchor="middle">LLM.generate(prompts, sampling_params)</text><text x="480" y="117" class="roof-sub" text-anchor="middle">提示词与采样参数 → 生成文本</text><rect x="76" y="133" width="808" height="356" rx="0" class="neutral"/><rect x="90" y="147" width="103" height="68" rx="8" class="panel"/><text x="141" y="176" class="label" text-anchor="middle">入口</text><text x="141" y="198" class="small" text-anchor="middle">启动与编排</text><rect x="208.0" y="147" width="325.0" height="68" rx="8" class="violet"/><text x="370.5" y="178.0" class="label" text-anchor="middle">请求与主循环</text><text x="370.5" y="202.0" class="sub" text-anchor="middle">LLMEngine</text><rect x="545.0" y="147" width="325.0" height="68" rx="8" class="violet"/><text x="707.5" y="178.0" class="label" text-anchor="middle">启动与装载</text><text x="707.5" y="202.0" class="sub" text-anchor="middle">Config · Loader</text><rect x="90" y="229" width="103" height="68" rx="8" class="panel"/><text x="141" y="258" class="label" text-anchor="middle">CPU</text><text x="141" y="280" class="small" text-anchor="middle">调度与寻址</text><rect x="208.0" y="229" width="325.0" height="68" rx="8" class="violet"/><text x="370.5" y="260.0" class="label" text-anchor="middle">批次调度</text><text x="370.5" y="284.0" class="sub" text-anchor="middle">Scheduler</text><rect x="545.0" y="229" width="325.0" height="68" rx="8" class="teal"/><text x="707.5" y="260.0" class="label" text-anchor="middle">KV 块管理</text><text x="707.5" y="284.0" class="sub" text-anchor="middle">BlockManager</text><rect x="90" y="311" width="103" height="68" rx="8" class="panel"/><text x="141" y="340" class="label" text-anchor="middle">GPU</text><text x="141" y="362" class="small" text-anchor="middle">张量与模型</text><rect x="208.0" y="311" width="212.66666666666666" height="68" rx="8" class="blue"/><text x="314.3333333333333" y="342.0" class="label" text-anchor="middle">张量准备</text><text x="314.3333333333333" y="366.0" class="sub" text-anchor="middle">ModelRunner</text><rect x="432.66666666666663" y="311" width="212.66666666666666" height="68" rx="8" class="blue"/><text x="539.0" y="342.0" class="label" text-anchor="middle">模型与注意力</text><text x="539.0" y="366.0" class="sub" text-anchor="middle">Qwen3 · Attention</text><rect x="657.3333333333333" y="311" width="212.66666666666666" height="68" rx="8" class="blue"/><text x="763.6666666666666" y="342.0" class="label" text-anchor="middle">词表打分与采样</text><text x="763.6666666666666" y="366.0" class="sub" text-anchor="middle">LM Head · Sampler</text><rect x="90" y="393" width="103" height="68" rx="8" class="panel"/><text x="141" y="422" class="label" text-anchor="middle">运行时</text><text x="141" y="444" class="small" text-anchor="middle">加速与并行</text><rect x="208.0" y="393" width="325.0" height="68" rx="8" class="blue"/><text x="370.5" y="424.0" class="label" text-anchor="middle">图重放</text><text x="370.5" y="448.0" class="sub" text-anchor="middle">CUDA Graph</text><rect x="545.0" y="393" width="325.0" height="68" rx="8" class="blue"/><text x="707.5" y="424.0" class="label" text-anchor="middle">张量并行</text><text x="707.5" y="448.0" class="sub" text-anchor="middle">Tensor Parallel</text><path d="M51 489 H909" class="roofline"/>
</svg>
