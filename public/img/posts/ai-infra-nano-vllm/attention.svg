<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" role="img" aria-labelledby="title desc">
<title id="title">一层注意力怎样使用缓存</title>
<desc id="desc">先写入本轮 K/V，再由 prefill 或 decode 路径读取输入与历史。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="316" rx="12" class="bg"/>
<rect x="30" y="25" width="200" height="66" rx="8" class="neutral"/><text x="130.0" y="55.0" class="label" text-anchor="middle">当前位置</text><text x="130.0" y="79.0" class="sub" text-anchor="middle">模型层的输入</text><path d="M230 58.0 H262" class="flow"/><rect x="262" y="25" width="200" height="66" rx="8" class="violet"/><text x="362.0" y="55.0" class="label" text-anchor="middle">投影得到 Q、K、V</text><text x="362.0" y="79.0" class="sub" text-anchor="middle">为 Q 和 K 加位置</text><path d="M462 58.0 H494" class="flow"/><rect x="494" y="25" width="200" height="66" rx="8" class="teal"/><text x="594.0" y="55.0" class="label" text-anchor="middle">写入本轮 K/V</text><text x="594.0" y="79.0" class="sub" text-anchor="middle">Triton 按槽位写入</text><path d="M694 58.0 H726" class="flow"/><rect x="726" y="25" width="200" height="66" rx="8" class="blue"/><text x="826.0" y="55.0" class="label" text-anchor="middle">读取历史</text><text x="826.0" y="79.0" class="sub" text-anchor="middle">按阶段选实现</text><path d="M826 91 V125 H250 V151" class="flow"/><path d="M826 125 H710 V151" class="flow"/><rect x="40" y="151" width="420" height="87" rx="8" class="violet"/><text x="250" y="177" class="label" text-anchor="middle">Prefill</text><text x="250" y="200" class="sub" text-anchor="middle">varlen：无旧前缀直接读本轮 K/V</text><text x="250" y="222" class="sub" text-anchor="middle">已有旧位置时按块表读取</text><rect x="500" y="151" width="420" height="87" rx="8" class="blue"/><text x="710" y="177" class="label" text-anchor="middle">Decode</text><text x="710" y="200" class="sub" text-anchor="middle">kvcache：按块表读取各自历史</text><text x="710" y="222" class="sub" text-anchor="middle">每个 query 只对应一个新位置</text><path d="M250 238 V268 H346" class="flow"/><path d="M710 238 V268 H614" class="flow"/><rect x="346" y="247" width="268" height="47" rx="8" class="neutral"/><text x="480.0" y="277.5" class="label" text-anchor="middle">输出投影 → MLP → 下一层</text>
</svg>
