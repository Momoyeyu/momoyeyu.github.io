<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 389" role="img" aria-labelledby="title desc">
<title id="title">Prefill 优先的四轮调度</title>
<desc id="desc">长请求分两轮处理输入，短请求随后 prefill，两条进入运行队列后一起 decode。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="389" rx="12" class="bg"/>
<rect x="22" y="21" width="916" height="73" rx="8" class="panel"/><rect x="40" y="34" width="283" height="48" rx="8" class="violet"/><text x="181.5" y="65.0" class="label" text-anchor="middle">先看 waiting 队首</text><path d="M323 58 H378" class="flow"/><text x="454" y="63" class="label" text-anchor="middle">能排就 prefill</text><path d="M564 39 V77" class="line"/><text x="743" y="63" class="label" text-anchor="middle">无 prefill 则从 running 取 decode</text><text x="44" y="129" class="band" text-anchor="start">轮次</text><text x="140" y="129" class="band" text-anchor="start">本轮输入</text><text x="405" y="129" class="band" text-anchor="start">执行路径</text><text x="618" y="129" class="band" text-anchor="start">队列进度</text><rect x="22" y="143" width="916" height="44" rx="5" class="neutral"/><text x="54" y="172" class="band" text-anchor="middle">1</text><rect x="140" y="148" width="45" height="34" rx="4" class="violet"/><text x="162.5" y="171" class="mono" text-anchor="middle">A₀</text><rect x="190" y="148" width="45" height="34" rx="4" class="violet"/><text x="212.5" y="171" class="mono" text-anchor="middle">A₁</text><rect x="240" y="148" width="45" height="34" rx="4" class="violet"/><text x="262.5" y="171" class="mono" text-anchor="middle">A₂</text><text x="405" y="172" class="label" text-anchor="start">Prefill</text><text x="618" y="171" class="sub" text-anchor="start">A 留在 waiting</text><rect x="22" y="191" width="916" height="44" rx="5" class="neutral"/><text x="54" y="220" class="band" text-anchor="middle">2</text><rect x="140" y="196" width="45" height="34" rx="4" class="violet"/><text x="162.5" y="219" class="mono" text-anchor="middle">A₃</text><rect x="190" y="196" width="45" height="34" rx="4" class="violet"/><text x="212.5" y="219" class="mono" text-anchor="middle">A₄</text><text x="405" y="220" class="label" text-anchor="start">Prefill</text><text x="618" y="219" class="sub" text-anchor="start">A 进入 running</text><rect x="22" y="239" width="916" height="44" rx="5" class="neutral"/><text x="54" y="268" class="band" text-anchor="middle">3</text><rect x="140" y="244" width="45" height="34" rx="4" class="violet"/><text x="162.5" y="267" class="mono" text-anchor="middle">B₀</text><rect x="190" y="244" width="45" height="34" rx="4" class="violet"/><text x="212.5" y="267" class="mono" text-anchor="middle">B₁</text><text x="405" y="268" class="label" text-anchor="start">Prefill</text><text x="618" y="267" class="sub" text-anchor="start">B 进入 running</text><rect x="22" y="287" width="916" height="44" rx="5" class="neutral"/><text x="54" y="316" class="band" text-anchor="middle">4</text><rect x="140" y="292" width="45" height="34" rx="4" class="blue"/><text x="162.5" y="315" class="mono" text-anchor="middle">a₁</text><rect x="190" y="292" width="45" height="34" rx="4" class="blue"/><text x="212.5" y="315" class="mono" text-anchor="middle">b₁</text><text x="405" y="316" class="label" text-anchor="start">Decode</text><text x="618" y="315" class="sub" text-anchor="start">A、B 各再生成一枚</text><text x="44" y="364" class="small" text-anchor="start">A 有 5 个输入 token，B 有 2 个。Prefill 每轮预算 3 个。</text>
</svg>
