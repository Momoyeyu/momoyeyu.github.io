<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
<title id="title">PPO 的 RLHF 数据流</title><desc id="desc">Actor生成回答并记录旧策略log概率；冻结Reference提供参考log概率，冻结奖励模型提供末步分数，两者构造逐token奖励。奖励与Critic价值进入GAE，PPO更新Actor与Critic。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:26px;font-weight:600}.head{font-size:22px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',Times,serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.guide{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;opacity:.6}.line{fill:none;stroke:var(--line);stroke-width:1.5}.curve{fill:none;stroke:var(--accent);stroke-width:3}.update{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;marker-end:url(#update)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="update" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker></defs>
<text x="450" y="36" class="title" text-anchor="middle">一次 RLHF 迭代：采样、评价、更新</text>
<text x="95" y="96" class="" text-anchor="middle">prompt x</text>
<path d="M95 110 V145" class="arrow"/>
<rect x="35" y="145" width="120" height="80" rx="9" class="box a"/>
<text x="95" y="178" class="head" text-anchor="middle">Actor</text>
<text x="95" y="207" class="math" text-anchor="middle">πθ</text>
<path d="M155 185 H200 V90 H295" class="arrow"/>
<path d="M200 185 H295" class="arrow"/>
<path d="M200 185 V280 H295" class="arrow"/>
<text x="237" y="171" class="math" text-anchor="middle">x, y</text>
<rect x="295" y="55" width="180" height="70" rx="9" class="box b"/>
<text x="385" y="84" class="" text-anchor="middle">Reference</text>
<text x="385" y="109" class="small" text-anchor="middle">冻结</text>
<rect x="295" y="150" width="180" height="70" rx="9" class="box b"/>
<text x="385" y="179" class="" text-anchor="middle">Reward Model</text>
<text x="385" y="204" class="small" text-anchor="middle">冻结</text>
<rect x="295" y="245" width="180" height="70" rx="9" class="box a"/>
<text x="385" y="274" class="" text-anchor="middle">Critic</text>
<text x="385" y="299" class="small" text-anchor="middle">训练</text>
<rect x="625" y="118" width="235" height="85" rx="9" class="box c"/>
<text x="742" y="148" class="head" text-anchor="middle">逐 token 奖励</text>
<text x="742" y="181" class="small" text-anchor="middle">−β log(πold / πref) + 末步分数</text>
<path d="M475 90 H575 V138 H625" class="arrow"/>
<text x="536" y="78" class="small math" text-anchor="middle">log πref</text>
<path d="M475 185 H625" class="arrow"/>
<text x="548" y="173" class="small" text-anchor="middle">序列分数</text>
<path d="M155 165 H175 V50 H895 V160 H860" class="arrow"/>
<text x="715" y="71" class="small" text-anchor="middle">采样时记录 log πold</text>
<rect x="625" y="255" width="235" height="65" rx="9" class="box c"/>
<text x="742" y="283" class="head" text-anchor="middle">GAE</text>
<text x="742" y="307" class="small" text-anchor="middle">优势 Âₜ · 回报 R̂ₜ</text>
<path d="M742 203 V255" class="arrow"/>
<path d="M475 280 H625" class="arrow"/>
<text x="549" y="268" class="small" text-anchor="middle">价值 Vₜ</text>
<rect x="625" y="372" width="235" height="60" rx="9" class="box a"/>
<text x="742" y="409" class="head" text-anchor="middle">PPO 更新</text>
<path d="M742 320 V372" class="arrow"/>
<path d="M625 402 H95 V225" class="update"/>
<path d="M385 402 V315" class="update"/>
<text x="360" y="438" class="small" text-anchor="middle">虚线：只更新 Actor 与 Critic</text>
</svg>
