<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img" aria-labelledby="title desc">
<title id="title">CartPole 环境</title><desc id="desc">小车位于轨道上，杆子相对竖直方向倾斜。向左或向右施力保持平衡；倾角超过12度或小车位置超出正负2.4时失败。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:26px;font-weight:600}.head{font-size:22px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',Times,serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.guide{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;opacity:.6}.line{fill:none;stroke:var(--line);stroke-width:1.5}.curve{fill:none;stroke:var(--accent);stroke-width:3}.update{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;marker-end:url(#update)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="update" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker></defs>
<text x="400" y="38" class="title" text-anchor="middle">CartPole：推小车，让杆保持直立</text>
<path d="M80 280 H720" class="line"/>
<path d="M115 240 V290 M685 240 V290" class="guide"/>
<text x="115" y="315" class="math" text-anchor="middle">−2.4</text>
<text x="685" y="315" class="math" text-anchor="middle">+2.4</text>
<path d="M400 224 V75" class="guide"/>
<path d="M400 224 L433.5 66" class="line"/>
<path d="M400 224 L433.5 66" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
<path d="M400 145 A79 79 0 0 1 416.4 146.7" class="line"/>
<text x="452" y="137" class="math" text-anchor="middle">θ</text>
<text x="490" y="97" class="small" text-anchor="start">|θ| &gt; 12°：失败</text>
<rect x="345" y="224" width="110" height="39" rx="9" class="box b"/>
<circle cx="365" cy="272" r="8" class="box"/><circle cx="435" cy="272" r="8" class="box"/><circle cx="400" cy="224" r="5" fill="var(--line)"/><path d="M335 244 H218" class="arrow"/>
<path d="M465 244 H582" class="arrow"/>
<text x="270" y="230" class="" text-anchor="middle">0：向左推</text>
<text x="530" y="230" class="" text-anchor="middle">1：向右推</text>
<text x="400" y="343" class="small" text-anchor="middle">每步奖励 +1 · 最多 500 步</text>
</svg>
