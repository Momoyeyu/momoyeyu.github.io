<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CartPole 学习曲线（3 个随机种子平均，横轴为环境交互步数）：PPO 约 4 万步回报接近 500；带基线的 REINFORCE 约需 30 万步；不带基线的 REINFORCE 1000 个回合后仍在 100 到 200 之间波动">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--expert-fill: #dce9f7;
			--expert-stroke: #7b9cc4;
			--router-fill: #f5e9c9;
			--router-stroke: #b8912f;
			--step-fill: #eef1f4;
			--step-stroke: #9aa5b1;
			--gate-fill: #ffffff;
			--accent: #e0a800;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--expert-fill: #26364d;
				--expert-stroke: #6c8ebf;
				--router-fill: #4a3d1e;
				--router-stroke: #c9a53f;
				--step-fill: #2a2f36;
				--step-stroke: #6b7684;
				--gate-fill: #1e1e1e;
				--accent: #e8c547;
			}
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
		.math { font-family: "Times New Roman", Times, serif; font-style: italic; }
		.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
		.box { stroke-width: 1.6; rx: 9; }
	</style>
	<defs>
		<marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
		</marker>
	</defs>

	<!-- axes -->
	<path d="M76,252 L532,252" class="edge" marker-end="url(#arw)"/>
	<path d="M76,252 L76,36" class="edge" marker-end="url(#arw)"/>
	<path d="M76.0,247 L76.0,252 M202.9,247 L202.9,252 M329.7,247 L329.7,252 M456.6,247 L456.6,252 M71,252.0 L76,252.0 M71,152.0 L76,152.0 M71,52.0 L76,52.0 " stroke="var(--line)" stroke-width="1.2" fill="none"/>
	<text x="76.0" y="271" class="math" font-size="14" text-anchor="middle">0</text>
	<text x="202.9" y="271" class="math" font-size="14" text-anchor="middle">100k</text>
	<text x="329.7" y="271" class="math" font-size="14" text-anchor="middle">200k</text>
	<text x="456.6" y="271" class="math" font-size="14" text-anchor="middle">300k</text>
	<text x="66" y="257.0" class="math" font-size="14" text-anchor="end">0</text>
	<text x="66" y="157.0" class="math" font-size="14" text-anchor="end">250</text>
	<text x="66" y="57.0" class="math" font-size="14" text-anchor="end">500</text>

	<!-- max return -->
	<path d="M76,52.0 L520,52.0" stroke="var(--step-stroke)" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>

	<!-- axis titles -->
	<text x="298" y="306" class="lbl" text-anchor="middle">环境交互步数</text>
	<text x="26" y="152" class="lbl" text-anchor="middle" transform="rotate(-90 26 152)">回合回报</text>

