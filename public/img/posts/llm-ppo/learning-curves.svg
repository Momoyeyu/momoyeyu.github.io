	<!-- legend -->
	<rect x="310" y="150" width="204" height="84" class="box" fill="var(--gate-fill)" stroke="var(--line)"/>
	<path d="M324,168 L352,168" stroke="var(--accent)" stroke-width="2.2" fill="none"/>
	<text x="364" y="173" class="lbl">PPO</text>
	<path d="M324,192 L352,192" stroke="var(--expert-stroke)" stroke-width="2" fill="none"/>
	<text x="364" y="197" class="lbl">REINFORCE + 基线</text>
