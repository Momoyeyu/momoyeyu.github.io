<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">PPO 裁剪目标的分段函数</title><desc id="desc">正优势时目标为min(ρ,1.2)，在ρ大于1.2后变平；负优势时目标为负max(ρ,0.8)，在ρ小于0.8时变平。ρ=1为旧策略。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:26px;font-weight:600}.head{font-size:22px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',Times,serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.guide{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5;opacity:.6}.line{fill:none;stroke:var(--line);stroke-width:1.5}.curve{fill:none;stroke:var(--accent);stroke-width:3}.update{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;marker-end:url(#update)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="update" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker></defs>
<text x="450" y="36" class="title" text-anchor="middle">裁剪只消除“继续改善”的激励</text>
<text x="450" y="70" class="small" text-anchor="middle">实线：min[ρÂ, clip(ρ, 1−ε, 1+ε)Â]    虚线：ρÂ</text>
<text x="220" y="112" class="head math" text-anchor="middle">Â = +1</text>
<rect x="250" y="135" width="105" height="155" class="a"/><path d="M70 290 H365" class="arrow"/>
<path d="M70 290 V130" class="arrow"/>
<path d="M70 290 L340 110" class="guide"/>
<path d="M70 290 L250 170 H340" class="curve"/>
<path d="M220 290 V190" class="guide"/>
<circle cx="220" cy="190" r="4" fill="var(--accent)"/><text x="299" y="266" class="small" text-anchor="middle">梯度为 0</text>
<path d="M70 290 v5" class="line"/>
<text x="70" y="350" class="small math" text-anchor="middle">0</text>
<path d="M190.0 290 v5" class="line"/>
<text x="190.0" y="350" class="small math" text-anchor="middle">1−ε</text>
<path d="M220 290 v5" class="line"/>
<text x="220" y="350" class="small math" text-anchor="middle">1</text>
<path d="M250.0 290 v5" class="line"/>
<text x="250.0" y="350" class="small math" text-anchor="middle">1+ε</text>
<text x="370" y="350" class="math" text-anchor="middle">ρ</text>
<text x="660" y="112" class="head math" text-anchor="middle">Â = −1</text>
<rect x="510" y="145" width="120" height="155" class="a"/><path d="M510 145 H805" class="arrow"/>
<path d="M510 145 V310" class="arrow"/>
<path d="M510 145 L780 325" class="guide"/>
<path d="M510 225 H630 L780 325" class="curve"/>
<path d="M660 145 V245" class="guide"/>
<circle cx="660" cy="245" r="4" fill="var(--accent)"/><text x="568" y="284" class="small" text-anchor="middle">梯度为 0</text>
<path d="M510 145 v5" class="line"/>
<text x="510" y="350" class="small math" text-anchor="middle">0</text>
<path d="M630.0 145 v5" class="line"/>
<text x="630.0" y="350" class="small math" text-anchor="middle">1−ε</text>
<path d="M660 145 v5" class="line"/>
<text x="660" y="350" class="small math" text-anchor="middle">1</text>
<path d="M690.0 145 v5" class="line"/>
<text x="690.0" y="350" class="small math" text-anchor="middle">1+ε</text>
<text x="810" y="350" class="math" text-anchor="middle">ρ</text>
<text x="450" y="392" class="small" text-anchor="middle">ε = 0.2；未被裁剪的一侧仍保留惩罚梯度</text>
</svg>
