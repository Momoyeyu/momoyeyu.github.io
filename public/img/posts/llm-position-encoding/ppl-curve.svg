<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perplexity versus context length: the untreated model's ppl stays low within the trained length L and rises sharply beyond it, while PI or NTK scaling keeps the curve nearly flat">
	<style>
		 :root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--expert-fill:var(--a);--expert-stroke:var(--accent);--router-fill:var(--b);--router-stroke:#82749c;--step-fill:var(--bg);--step-stroke:var(--line);--gate-fill:var(--bg)}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--router-stroke:#b6a4d0}}

		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, 'PingFang SC', sans-serif; font-size: 15px; }
		.math { font-family: "Times New Roman", Times, serif; font-style: italic; }
		.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
	</style>
	<defs>
		<marker id="arw" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
		</marker>
	</defs>

	<!-- trained position range shading -->
	<rect x="90" y="40" width="210" height="200" fill="var(--step-fill)"/>
	<path d="M300,40 L300,240" stroke="var(--step-stroke)" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
	<text x="195" y="62" class="lbl" style="font-size:13px" text-anchor="middle">训练范围</text>

	<!-- axes -->
	<path d="M90,240 L517.8,240" class="edge" marker-end="url(#arw)"/>
	<path d="M90,240 L90,42.2" class="edge" marker-end="url(#arw)"/>
	<path d="M160,235 L160,240 M230,235 L230,240 M370,235 L370,240 M440,235 L440,240" stroke="var(--line)" stroke-width="1.2" fill="none"/>
	<text x="88" y="258" class="math" font-size="14" text-anchor="middle">0</text>
	<text x="300" y="258" class="math" font-size="16" text-anchor="middle">L</text>
	<text x="536" y="258" class="lbl" text-anchor="end">上下文长度</text>
	<text x="64" y="40" class="math" font-size="17" text-anchor="middle">ppl</text>

	<!-- untreated: flat inside range, rises sharply beyond L -->
	<path d="M90,212 C180,209 250,206 295,196 C330,152 375,90 452,54" stroke="var(--expert-stroke)" stroke-width="2.2" fill="none"/>
	<text x="452" y="40" class="lbl" style="font-size:13.5px" text-anchor="middle">不处理</text>

	<!-- PI / NTK: stays nearly flat -->
	<path d="M90,206 C200,203 330,199 500,192" stroke="var(--router-stroke)" stroke-width="2.2" fill="none"/>
	<text x="430" y="178" class="lbl" style="font-size:13.5px" text-anchor="middle">PI / NTK 缩放</text>
<text x="300" y="285" class="lbl" style="font-size:12px" text-anchor="middle">趋势示意，非实测数据；效果取决于模型与适配</text>
</svg>
