<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="title desc"><title id="title">RoPE 的相对位置不变性</title><desc id="desc">两个平面使用相同的内容向量，右图将两个位置同时平移 c。共同旋转保持夹角和内积不变。一般内容向量原本就有夹角，因此夹角并不单独等于位置差。</desc><style> :root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--expert-fill:var(--a);--expert-stroke:var(--accent);--router-fill:var(--b);--router-stroke:#82749c;--step-fill:var(--bg);--step-stroke:var(--line);--gate-fill:var(--bg)}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--router-stroke:#b6a4d0}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.edge{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}.guide{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;opacity:.55}.green{stroke:var(--accent)}.purple{stroke:var(--router-stroke)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="350" y="32" class="title" text-anchor="middle">共同平移位置，夹角保持不变</text><circle cx="180" cy="205" r="102" class="box"/><path d="M65 205 H295" class="guide"/><path d="M180 205 L261.57 166.96" class="edge green"/><text x="271.5677008332985" y="154.96435644333707" class="math" text-anchor="middle">Rₘq</text><path d="M180 205 L210.78 120.43" class="edge purple"/><text x="220.78181289931018" y="108.42766412926825" class="math" text-anchor="middle">Rₙk</text><path d="M218.97 186.83 A43 43 0 0 0 194.71 164.59" class="edge"/><text x="180" y="344" class="" text-anchor="middle">位置 m、n</text><circle cx="520" cy="205" r="102" class="box"/><path d="M405 205 H635" class="guide"/><path d="M520 205 L565.00 127.06" class="edge green"/><text x="575.0" y="115.05771365940052" class="math" text-anchor="middle">Rₘ₊cq</text><path d="M520 205 L496.71 118.07" class="edge purple"/><text x="506.7062859407731" y="106.06667563398385" class="math" text-anchor="middle">Rₙ₊ck</text><path d="M541.50 167.76 A43 43 0 0 0 508.87 163.47" class="edge"/><text x="520" y="344" class="" text-anchor="middle">位置 m+c、n+c</text><text x="350" y="197" class="math" text-anchor="middle">+c</text><path d="M305 217 H395" class="edge"/><text x="350" y="399" class="math" text-anchor="middle">(Rₘq)ᵀ(Rₙk) = qᵀ Rₙ₋ₘ k</text><text x="350" y="429" class="small" text-anchor="middle">同一对内容向量的分数只随相对位置改变</text></svg>
