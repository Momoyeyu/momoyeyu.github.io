<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RoPE extrapolation failure: the rotation angle pos times theta_i grows linearly with position and crosses the ceiling of angles seen in training beyond length L">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--expert-fill: #dce9f7;
			--expert-stroke: #7b9cc4;
			--router-fill: #f5e9c9;
			--router-stroke: #b8912f;
			--step-fill: #eef1f4;
			--step-stroke: #9aa5b1;
			--gate-fill: #ffffff;
			--accent: #e0a800;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--expert-fill: #26364d;
				--expert-stroke: #6c8ebf;
				--router-fill: #4a3d1e;
				--router-stroke: #c9a53f;
				--step-fill: #2a2f36;
				--step-stroke: #6b7684;
				--gate-fill: #1e1e1e;
				--accent: #e8c547;
			}
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
		.math { font-family: "Times New Roman", Times, serif; font-style: italic; }
		.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
	</style>
	<defs>
		<marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
		</marker>
		<marker id="arwE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="var(--expert-stroke)"/>
		</marker>
	</defs>

	<!-- trained position range shading -->
	<rect x="90" y="28" width="210" height="122" fill="var(--step-fill)"/>
	<path d="M300,28 L300,150" stroke="var(--step-stroke)" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
	<text x="195" y="52" class="lbl" style="font-size:13px" text-anchor="middle">训练范围</text>

	<!-- trained angle ceiling -->
	<path d="M90,90 L520,90" stroke="var(--router-stroke)" stroke-width="1.4" stroke-dasharray="6 5" fill="none"/>
	<text x="516" y="82" class="lbl" style="font-size:12.5px" text-anchor="end">训练见过的角度上限</text>

	<!-- axes -->
	<path d="M90,150 L517.8,150" class="edge" marker-end="url(#arw)"/>
	<path d="M90,150 L90,30.2" class="edge" marker-end="url(#arw)"/>
	<text x="72" y="34" class="lbl" style="font-size:13px" text-anchor="middle">角度</text>
	<path d="M160,145 L160,150 M230,145 L230,150 M370,145 L370,150 M440,145 L440,150" stroke="var(--line)" stroke-width="1.2" fill="none"/>
	<text x="88" y="168" class="math" font-size="14" text-anchor="middle">0</text>
	<text x="300" y="168" class="math" font-size="16" text-anchor="middle">L</text>
	<text x="528" y="155" class="math" font-size="16">pos</text>

	<!-- angle curve: pos·θ_i, linear in pos, crosses the ceiling just beyond L -->
	<path d="M90,150 L500,52" stroke="var(--expert-stroke)" stroke-width="2.2" fill="none" marker-end="url(#arwE)"/>
	<text x="368" y="60" class="math" font-size="17" text-anchor="middle" transform="rotate(-13.4 368 60)">pos · θ<tspan baseline-shift="sub" font-size="11">i</tspan></text>

	<!-- out-of-distribution annotation -->
	<text x="452" y="26" class="lbl" style="font-size:13px" text-anchor="middle">超出训练分布</text>
	<path d="M452,32 L428,62" class="edge" marker-end="url(#arw)"/>
</svg>
