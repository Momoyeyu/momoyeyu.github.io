<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc"><title id="title">RoPE 位置插值</title><desc id="desc">角度与位置线性对应，原始曲线恰在 L 处穿过训练最大相位 Lθᵢ。示意不表示所有频率都有未见相位。</desc><style> :root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--expert-fill:var(--a);--expert-stroke:var(--accent);--router-fill:var(--b);--router-stroke:#82749c;--step-fill:var(--bg);--step-stroke:var(--line);--gate-fill:var(--bg)}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--router-stroke:#b6a4d0}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.edge{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}.guide{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;opacity:.55}.green{stroke:var(--accent)}.purple{stroke:var(--router-stroke)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="350" y="30" class="title" text-anchor="middle">位置插值：4L 映射回 L</text><rect x="85" y="66" width="135" height="204" class="a"/><path d="M220 65 V270" class="guide"/><path d="M85 270 H635" class="edge"/><path d="M85 270 V62" class="edge"/><text x="73" y="54" class="small" text-anchor="middle">相位</text><text x="660" y="322" class="math" text-anchor="middle">pos</text><text x="152" y="92" class="small" text-anchor="middle">训练范围</text><path d="M85 226 H625" class="guide"/><text x="627" y="218" class="math" text-anchor="end">Lθᵢ</text><text x="85" y="295" class="math" text-anchor="middle">0</text><text x="220" y="295" class="math" text-anchor="middle">L</text><text x="625" y="295" class="math" text-anchor="middle">4L</text><path d="M85 270 L625 94" class="edge green"/><text x="481" y="113" class="math" text-anchor="middle">pos · θᵢ</text><path d="M85 270 L625 226" class="edge purple"/><text x="470" y="258" class="math" text-anchor="middle">(pos / 4) · θᵢ</text><text x="350" y="330" class="small" text-anchor="middle">位置间隔与相位增量同时缩小为 1/4</text></svg>
