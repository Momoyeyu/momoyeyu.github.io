<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="title desc"><title id="title">YaRN 的分段频率缩放</title><desc id="desc">高频维保持原频率，低频维除以缩放因子 s，中间区域在维度对下标上使用线性斜坡混合两种频率。温度校正是额外步骤。</desc><style> :root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--expert-fill:var(--a);--expert-stroke:var(--accent);--router-fill:var(--b);--router-stroke:#82749c;--step-fill:var(--bg);--step-stroke:var(--line);--gate-fill:var(--bg)}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--router-stroke:#b6a4d0}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.edge{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}.guide{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;opacity:.55}.green{stroke:var(--accent)}.purple{stroke:var(--router-stroke)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="350" y="32" class="title" text-anchor="middle">YaRN：按频段调整旋转速度</text><rect x="100" y="70" width="175" height="205" class="a"/><rect x="275" y="70" width="150" height="205" class="c"/><rect x="425" y="70" width="200" height="205" class="b"/><path d="M100 275 H640" class="edge"/><path d="M100 275 V62" class="edge"/><text x="95" y="51" class="math" text-anchor="middle">θ′ᵢ / θᵢ</text><text x="82" y="105" class="math" text-anchor="middle">1</text><text x="77" y="248" class="math" text-anchor="middle">1/s</text><path d="M100 100 H275 L425 240 H625" class="edge green"/><path d="M275 70 V275" class="guide"/><path d="M425 70 V275" class="guide"/><text x="185" y="159" class="" text-anchor="middle">高频维</text><text x="185" y="186" class="small" text-anchor="middle">保留频率</text><text x="350" y="211" class="small" text-anchor="middle">线性混合</text><text x="525" y="151" class="" text-anchor="middle">低频维</text><text x="525" y="178" class="small" text-anchor="middle">频率 ÷ s</text><text x="100" y="300" class="small" text-anchor="start">小 i · 高频</text><text x="625" y="300" class="small" text-anchor="end">大 i · 低频</text><text x="350" y="328" class="math" text-anchor="middle">维度对下标 i</text><text x="350" y="359" class="small" text-anchor="middle">另对 attention logits 做温度校正</text></svg>
