<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 455" role="img" aria-labelledby="title desc"><title id="title">位置编码的注入路径</title><desc id="desc">绝对位置编码先与 token 相加。RoPE 在投影后旋转 Q 和 K，相对偏置和 ALiBi 则加在注意力 logits 上。图中省略打分缩放。</desc><style> :root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--expert-fill:var(--a);--expert-stroke:var(--accent);--router-fill:var(--b);--router-stroke:#82749c;--step-fill:var(--bg);--step-stroke:var(--line);--gate-fill:var(--bg)}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--router-stroke:#b6a4d0}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:18px}.small{font-size:15px;fill:var(--muted)}.title{font-size:23px;font-weight:600}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.edge{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}.guide{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;opacity:.55}.green{stroke:var(--accent)}.purple{stroke:var(--router-stroke)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="350" y="32" class="title" text-anchor="middle">位置信息进入计算的两条路径</text><text x="175" y="76" class="" text-anchor="middle">绝对位置相加</text><text x="525" y="76" class="" text-anchor="middle">在注意力打分中生效</text><path d="M350 65 V390" class="guide"/><rect x="30" y="110" width="120" height="46" rx="7" class="box a"/><text x="90.0" y="139.0" class="" text-anchor="middle">token x</text><rect x="195" y="110" width="120" height="46" rx="7" class="box c"/><text x="255.0" y="139.0" class="" text-anchor="middle">PE(pos)</text><path d="M90 156 V185 H175 V202" class="edge"/><path d="M255 156 V185 H175 V202" class="edge"/><circle cx="175" cy="220" r="18" class="box"/><text x="175" y="226" class="" text-anchor="middle">+</text><path d="M175 238 V270" class="edge"/><rect x="75" y="270" width="200" height="52" rx="7" class="box a"/><text x="175.0" y="302.0" class="" text-anchor="middle">Q / K / V 投影</text><path d="M175 322 V354" class="edge"/><rect x="75" y="354" width="200" height="46" rx="7" class="box "/><text x="175.0" y="383.0" class="" text-anchor="middle">Attention</text><rect x="455" y="110" width="140" height="46" rx="7" class="box a"/><text x="525.0" y="139.0" class="" text-anchor="middle">token x</text><path d="M525 156 V186" class="edge"/><rect x="425" y="186" width="200" height="46" rx="7" class="box a"/><text x="525.0" y="215.0" class="" text-anchor="middle">Q / K / V 投影</text><path d="M525 232 V264" class="edge"/><rect x="425" y="264" width="200" height="52" rx="7" class="box b"/><text x="525.0" y="296.0" class="" text-anchor="middle">Q / K 旋转</text><text x="649" y="296" class="small" text-anchor="middle">RoPE</text><path d="M525 316 V354" class="edge"/><rect x="425" y="354" width="200" height="46" rx="7" class="box c"/><text x="525.0" y="383.0" class="" text-anchor="middle">QKᵀ + bias</text><text x="525" y="431" class="small" text-anchor="middle">相对偏置 / ALiBi 加在 logits</text><text x="175" y="431" class="small" text-anchor="middle">位置随表示进入后续层</text></svg>
