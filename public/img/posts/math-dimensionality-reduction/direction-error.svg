<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一组六个中心化样本分别投影到沿点云延伸的斜线与只保留第一个特征的水平线上；两种方法都降到一维，斜线方向上的残差更短">
	<style>
		:root { --fg: #2b2b2b; --line: #3d3d3d; --expert-stroke: #7b9cc4; --router-stroke: #b8912f; --step-stroke: #9aa5b1; --accent: #e0a800; }
		@media (prefers-color-scheme: dark) {
			:root { --fg: #d8d8d8; --line: #b8b8b8; --expert-stroke: #83aad6; --router-stroke: #dab651; --step-stroke: #6b7684; --accent: #e8c547; }
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
		.math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 16px; }
		.axis { stroke: var(--step-stroke); stroke-width: 1.3; fill: none; }
	</style>
	<defs>
		<marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--step-stroke)"/></marker>
		<marker id="direction-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--router-stroke)"/></marker>
	</defs>
	<path d="M360 22 V265" stroke="var(--step-stroke)" stroke-width="1" stroke-dasharray="3 6" opacity="0.6"/>
	<text x="190" y="30" class="lbl" text-anchor="middle">沿点云延伸的方向</text>
	<text x="525" y="30" class="lbl" text-anchor="middle">只保留第一个特征</text>
	<g class="axis" marker-end="url(#axis-arrow)">
		<path d="M78 155 H306 M190 247 V52"/>
		<path d="M413 155 H641 M525 247 V52"/>
	</g>
	<g class="math">
		<text x="304" y="175">x₁</text><text x="198" y="59">x₂</text>
		<text x="639" y="175">x₁</text><text x="533" y="59">x₂</text>
	</g>
	<path d="M100 227 L280 83" stroke="var(--router-stroke)" stroke-width="1.8" fill="none"/>
	<path d="M190 155 L266 94" stroke="var(--router-stroke)" stroke-width="2.2" fill="none" marker-end="url(#direction-arrow)"/>
	<path d="M525 155 H625" stroke="var(--router-stroke)" stroke-width="2.2" fill="none" marker-end="url(#direction-arrow)"/>
	<path d="M145 180 L150.37 186.71 M235 130 L229.63 123.29 M480 180 V155 M570 130 V155" stroke="var(--accent)" stroke-width="2.1" stroke-dasharray="4 3" fill="none"/>
	<g fill="var(--expert-stroke)">
		<circle cx="120" cy="212" r="3.8"/><circle cx="260" cy="98" r="3.8"/>
		<circle cx="165" cy="180" r="3.8"/><circle cx="215" cy="130" r="3.8"/>
		<circle cx="455" cy="212" r="3.8"/><circle cx="595" cy="98" r="3.8"/>
		<circle cx="500" cy="180" r="3.8"/><circle cx="550" cy="130" r="3.8"/>
	</g>
	<g fill="var(--accent)">
		<circle cx="145" cy="180" r="4.4"/><circle cx="235" cy="130" r="4.4"/>
		<circle cx="480" cy="180" r="4.4"/><circle cx="570" cy="130" r="4.4"/>
	</g>
	<g fill="var(--router-stroke)">
		<circle cx="150.37" cy="186.71" r="2.6"/><circle cx="229.63" cy="123.29" r="2.6"/>
		<circle cx="480" cy="155" r="2.6"/><circle cx="570" cy="155" r="2.6"/>
	</g>
	<text x="241" y="88" class="math">w</text>
	<text x="600" y="143" class="math">w</text>
	<text x="190" y="269" class="lbl" text-anchor="middle">残差较短</text>
	<text x="525" y="269" class="lbl" text-anchor="middle">残差较长</text>
</svg>
