<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="二维向量 x 在一维子空间 span(w) 上的正交投影：投影点 x 帽是最近点；残差 x 减 x 帽垂直于 w，而子空间里另一个点 p 到 x 的距离更长">
	<style>
		:root { --fg: #2b2b2b; --line: #3d3d3d; --expert-stroke: #7b9cc4; --router-stroke: #b8912f; --step-stroke: #9aa5b1; --accent: #e0a800; }
		@media (prefers-color-scheme: dark) {
			:root { --fg: #d8d8d8; --line: #b8b8b8; --expert-stroke: #83aad6; --router-stroke: #dab651; --step-stroke: #6b7684; --accent: #e8c547; }
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
		.math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 18px; }
		.axis { stroke: var(--step-stroke); stroke-width: 1.3; fill: none; }
	</style>
	<defs>
		<marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--step-stroke)"/></marker>
		<marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--expert-stroke)"/></marker>
		<marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--router-stroke)"/></marker>
		<marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--line)"/></marker>
	</defs>
	<path d="M515 36 V288" stroke="var(--step-stroke)" stroke-width="1" stroke-dasharray="3 6" opacity="0.65"/>
	<g class="axis" marker-end="url(#axis-arrow)">
		<path d="M40 265 H490 M120 310 V32"/>
	</g>
	<text x="488" y="285" class="math">x₁</text>
	<text x="130" y="40" class="math">x₂</text>
	<path d="M55 297.5 L490 80" stroke="var(--router-stroke)" stroke-width="1.6" fill="none"/>
	<path d="M245 65 L420 115" stroke="var(--step-stroke)" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
	<path d="M120 265 L245 65" stroke="var(--line)" stroke-width="2" fill="none" marker-end="url(#fg)"/>
	<path d="M120 265 L300 175" stroke="var(--expert-stroke)" stroke-width="2.6" fill="none" marker-end="url(#blue)"/>
	<path d="M120 265 L200 225" stroke="var(--router-stroke)" stroke-width="2.5" fill="none" marker-end="url(#gold)"/>
	<path d="M300 175 L245 65" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
	<path d="M300 175 L316 167 L308 151" stroke="var(--accent)" stroke-width="1.6" fill="none"/>
	<circle cx="120" cy="265" r="2.8" fill="var(--line)"/>
	<circle cx="245" cy="65" r="4" fill="var(--line)"/>
	<circle cx="300" cy="175" r="4" fill="var(--expert-stroke)"/>
	<circle cx="420" cy="115" r="3.8" fill="var(--step-stroke)"/>
	<text x="228" y="51" class="math">x</text>
	<text x="286" y="201" class="math">x̂</text>
	<text x="430" y="111" class="math">p</text>
	<text x="205" y="250" class="math">w</text>
	<text x="300" y="109" class="math" style="font-size:16px">x − x̂</text>
	<text x="69" y="288" class="lbl" style="font-size:13px">原点</text>
	<text x="532" y="65" class="lbl">投影坐标</text>
	<text x="532" y="98" class="math">z = wᵀx</text>
	<text x="532" y="149" class="lbl">最近点</text>
	<text x="532" y="182" class="math">x̂ = wz</text>
	<text x="532" y="233" class="lbl">垂直残差</text>
	<text x="532" y="266" class="math">x − x̂ ⟂ w</text>
	<text x="351" y="330" class="math" style="font-size:17px" text-anchor="middle">‖x − x̂‖₂ ≤ ‖x − p‖₂，p ∈ span(w)</text>
</svg>
