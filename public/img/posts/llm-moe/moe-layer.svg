<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">MoE 稀疏激活</title>
<desc id="desc">示例 K=2，Router 选择 Expert 1 和 3。原始输入 x 分别送入两位专家；输出乘路由权重后相加。未选专家不计算。Router 的概率和选择另用于辅助负载均衡损失。</desc>
<style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:25px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.weight{stroke:var(--accent);stroke-dasharray:5 5}.faint{opacity:.3}.wire{fill:none;stroke:var(--line);stroke-width:1.4}</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/>
</marker>
</defs>
<text x="400" y="36" text-anchor="middle" class="title">一个 token，只激活选中的 Expert</text>
<rect x="35" y="245" width="100" height="46" rx="6" class="box "/>
<text x="85.0" y="275.0" text-anchor="middle" class="">x</text>
<rect x="195" y="94" width="160" height="46" rx="6" class="box c"/>
<text x="275.0" y="124.0" text-anchor="middle" class="">Router</text>
<path d="M85 245 V117 H195" class="arrow "/>
<rect x="202" y="245" width="96" height="48" rx="6" class="box a"/>
<text x="250.0" y="276.0" text-anchor="middle" class="">E1</text>
<path d="M135 268 H160 V205 H250 V245" class="arrow "/>
<circle cx="250" cy="362" r="17" class="box"/>
<text x="250" y="369" text-anchor="middle" class="">×</text>
<path d="M250 293 V345" class="arrow "/>
<path d="M355 117 H365 V170 H305 V362 H267" class="arrow weight"/>
<path d="M250 379 V425 H400 V443" class="arrow "/>
<rect x="352" y="245" width="96" height="48" rx="6" class="box faint"/>
<text x="400.0" y="276.0" text-anchor="middle" class="">E2</text>
<text x="400" y="324" text-anchor="middle" class="small">休眠</text>
<rect x="502" y="245" width="96" height="48" rx="6" class="box a"/>
<text x="550.0" y="276.0" text-anchor="middle" class="">E3</text>
<path d="M135 268 H160 V205 H550 V245" class="arrow "/>
<circle cx="550" cy="362" r="17" class="box"/>
<text x="550" y="369" text-anchor="middle" class="">×</text>
<path d="M550 293 V345" class="arrow "/>
<path d="M355 117 H365 V170 H605 V362 H567" class="arrow weight"/>
<path d="M550 379 V425 H400 V443" class="arrow "/>
<rect x="652" y="245" width="96" height="48" rx="6" class="box faint"/>
<text x="700.0" y="276.0" text-anchor="middle" class="">E4</text>
<text x="700" y="324" text-anchor="middle" class="small">休眠</text>
<circle cx="400" cy="460" r="17" class="box"/>
<text x="400" y="467" text-anchor="middle" class="">+</text>
<path d="M400 477 V511" class="arrow "/>
<rect x="345" y="511" width="110" height="42" rx="6" class="box b"/>
<text x="400.0" y="539.0" text-anchor="middle" class="">y</text>
<rect x="475" y="94" width="260" height="46" rx="6" class="box c"/>
<text x="605.0" y="124.0" text-anchor="middle" class="">Load balancing loss</text>
<path d="M355 117 H475" class="arrow "/>
<text x="400" y="594" text-anchor="middle" class="small">实线：token / Expert 输出　　虚线：路由权重</text>
</svg>
