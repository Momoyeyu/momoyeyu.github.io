<svg xmlns="http://www.w3.org/2000/svg" width="840" height="642" viewBox="0 0 840 642" role="img" aria-labelledby="title desc">
<title id="title">MoE token 分发与重组</title>
<desc id="desc">四个 token 按选中的两个 Expert 复制分组。Expert 1 接收 x1 x3，Expert 2 接收 x2 x3 x4，Expert 3 接收 x1 x2 x4。每个 token 的两路结果按权重合并并恢复原顺序。</desc>
<style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:25px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.weight{stroke:var(--accent);stroke-dasharray:5 5}.faint{opacity:.3}.wire{fill:none;stroke:var(--line);stroke-width:1.4}</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/>
</marker>
</defs>
<text x="420" y="36" text-anchor="middle" class="title">Dispatch 改变分组，Combine 恢复 token 顺序</text>
<text x="420" y="73" text-anchor="middle" class="small">示例：4 个 token，3 个 Expert，Top-2</text>
<rect x="35" y="140" width="85" height="40" rx="6" class="box b"/>
<text x="77.5" y="167.0" text-anchor="middle" class="">x1</text>
<rect x="165" y="140" width="125" height="40" rx="6" class="box c"/>
<text x="227.5" y="167.0" text-anchor="middle" class="">E1 · E3</text>
<path d="M120 160 H165" class="arrow "/>
<rect x="725" y="140" width="85" height="40" rx="6" class="box b"/>
<text x="767.5" y="167.0" text-anchor="middle" class="">y1</text>
<rect x="35" y="235" width="85" height="40" rx="6" class="box b"/>
<text x="77.5" y="262.0" text-anchor="middle" class="">x2</text>
<rect x="165" y="235" width="125" height="40" rx="6" class="box c"/>
<text x="227.5" y="262.0" text-anchor="middle" class="">E2 · E3</text>
<path d="M120 255 H165" class="arrow "/>
<rect x="725" y="235" width="85" height="40" rx="6" class="box b"/>
<text x="767.5" y="262.0" text-anchor="middle" class="">y2</text>
<rect x="35" y="330" width="85" height="40" rx="6" class="box b"/>
<text x="77.5" y="357.0" text-anchor="middle" class="">x3</text>
<rect x="165" y="330" width="125" height="40" rx="6" class="box c"/>
<text x="227.5" y="357.0" text-anchor="middle" class="">E1 · E2</text>
<path d="M120 350 H165" class="arrow "/>
<rect x="725" y="330" width="85" height="40" rx="6" class="box b"/>
<text x="767.5" y="357.0" text-anchor="middle" class="">y3</text>
<rect x="35" y="425" width="85" height="40" rx="6" class="box b"/>
<text x="77.5" y="452.0" text-anchor="middle" class="">x4</text>
<rect x="165" y="425" width="125" height="40" rx="6" class="box c"/>
<text x="227.5" y="452.0" text-anchor="middle" class="">E2 · E3</text>
<path d="M120 445 H165" class="arrow "/>
<rect x="725" y="425" width="85" height="40" rx="6" class="box b"/>
<text x="767.5" y="452.0" text-anchor="middle" class="">y4</text>
<rect x="380" y="145" width="255" height="65" rx="6" class="box a"/>
<text x="507" y="132" text-anchor="middle" class="">Expert 1</text>
<rect x="394" y="161" width="66" height="34" rx="6" class="box "/>
<text x="427.0" y="185.0" text-anchor="middle" class="">x1</text>
<path d="M290 160 L380 177" class="arrow faint"/>
<path d="M635 177 L725 160" class="arrow faint"/>
<rect x="470" y="161" width="66" height="34" rx="6" class="box "/>
<text x="503.0" y="185.0" text-anchor="middle" class="">x3</text>
<path d="M290 350 L380 177" class="arrow faint"/>
<path d="M635 177 L725 350" class="arrow faint"/>
<rect x="380" y="270" width="255" height="65" rx="6" class="box a"/>
<text x="507" y="257" text-anchor="middle" class="">Expert 2</text>
<rect x="394" y="286" width="66" height="34" rx="6" class="box "/>
<text x="427.0" y="310.0" text-anchor="middle" class="">x2</text>
<path d="M290 255 L380 302" class="arrow faint"/>
<path d="M635 302 L725 255" class="arrow faint"/>
<rect x="470" y="286" width="66" height="34" rx="6" class="box "/>
<text x="503.0" y="310.0" text-anchor="middle" class="">x3</text>
<path d="M290 350 L380 302" class="arrow faint"/>
<path d="M635 302 L725 350" class="arrow faint"/>
<rect x="546" y="286" width="66" height="34" rx="6" class="box "/>
<text x="579.0" y="310.0" text-anchor="middle" class="">x4</text>
<path d="M290 445 L380 302" class="arrow faint"/>
<path d="M635 302 L725 445" class="arrow faint"/>
<rect x="380" y="395" width="255" height="65" rx="6" class="box a"/>
<text x="507" y="382" text-anchor="middle" class="">Expert 3</text>
<rect x="394" y="411" width="66" height="34" rx="6" class="box "/>
<text x="427.0" y="435.0" text-anchor="middle" class="">x1</text>
<path d="M290 160 L380 427" class="arrow faint"/>
<path d="M635 427 L725 160" class="arrow faint"/>
<rect x="470" y="411" width="66" height="34" rx="6" class="box "/>
<text x="503.0" y="435.0" text-anchor="middle" class="">x2</text>
<path d="M290 255 L380 427" class="arrow faint"/>
<path d="M635 427 L725 255" class="arrow faint"/>
<rect x="546" y="411" width="66" height="34" rx="6" class="box "/>
<text x="579.0" y="435.0" text-anchor="middle" class="">x4</text>
<path d="M290 445 L380 427" class="arrow faint"/>
<path d="M635 427 L725 445" class="arrow faint"/>
<text x="225" y="116" text-anchor="middle" class="small">Router + Top-2</text>
<text x="420" y="572" text-anchor="middle" class="math">yₜ = Σᵢ wₜ,ᵢ Eᵢ(xₜ)</text>
<text x="420" y="610" text-anchor="middle" class="small">同一 token 的两个输出加权相加；Expert 内批量执行 FFN</text>
</svg>
