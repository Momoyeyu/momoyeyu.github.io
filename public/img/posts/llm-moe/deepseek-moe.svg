<svg xmlns="http://www.w3.org/2000/svg" width="840" height="710" viewBox="0 0 840 710" role="img" aria-labelledby="title desc">
<title id="title">DeepSeekMoE 专家结构</title>
<desc id="desc">同一输入进入恒激活的 Shared Expert 和选择性激活的细粒度 Routed Experts。示例路由选择 E1 E3 E6，其加权结果与共享专家输出直接相加。</desc>
<style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:25px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.weight{stroke:var(--accent);stroke-dasharray:5 5}.faint{opacity:.3}.wire{fill:none;stroke:var(--line);stroke-width:1.4}</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/>
</marker>
</defs>
<text x="420" y="36" text-anchor="middle" class="title">细粒度专家 + 恒激活的共享专家</text>
<rect x="365" y="90" width="110" height="42" rx="6" class="box "/>
<text x="420.0" y="118.0" text-anchor="middle" class="">x</text>
<rect x="40" y="250" width="170" height="74" rx="6" class="box a"/>
<text x="125.0" y="294.0" text-anchor="middle" class="">Shared Expert</text>
<path d="M365 111 H125 V250" class="arrow "/>
<text x="125" y="355" text-anchor="middle" class="small">每个 token 都计算</text>
<rect x="390" y="172" width="160" height="42" rx="6" class="box c"/>
<text x="470.0" y="200.0" text-anchor="middle" class="">Router</text>
<path d="M420 132 V172" class="arrow "/>
<rect x="275" y="282" width="60" height="65" rx="6" class="box b"/>
<text x="305.0" y="321.5" text-anchor="middle" class="">E1</text>
<path d="M470 214 V248 H305 V282" class="arrow "/>
<path d="M305 347 V402 H515 V428" class="arrow "/>
<rect x="365" y="282" width="60" height="65" rx="6" class="box faint"/>
<text x="395.0" y="321.5" text-anchor="middle" class="">E2</text>
<rect x="455" y="282" width="60" height="65" rx="6" class="box b"/>
<text x="485.0" y="321.5" text-anchor="middle" class="">E3</text>
<path d="M470 214 V248 H485 V282" class="arrow "/>
<path d="M485 347 V402 H515 V428" class="arrow "/>
<rect x="545" y="282" width="60" height="65" rx="6" class="box faint"/>
<text x="575.0" y="321.5" text-anchor="middle" class="">E4</text>
<rect x="635" y="282" width="60" height="65" rx="6" class="box faint"/>
<text x="665.0" y="321.5" text-anchor="middle" class="">E5</text>
<rect x="725" y="282" width="60" height="65" rx="6" class="box b"/>
<text x="755.0" y="321.5" text-anchor="middle" class="">E6</text>
<path d="M470 214 V248 H755 V282" class="arrow "/>
<path d="M755 347 V402 H515 V428" class="arrow "/>
<rect x="400" y="428" width="230" height="44" rx="6" class="box c"/>
<text x="515.0" y="457.0" text-anchor="middle" class="">加权求和</text>
<circle cx="420" cy="530" r="17" class="box"/>
<text x="420" y="537" text-anchor="middle" class="">+</text>
<path d="M515 472 V530 H437" class="arrow "/>
<path d="M125 324 V530 H403" class="arrow "/>
<path d="M420 547 V583" class="arrow "/>
<rect x="365" y="583" width="110" height="42" rx="6" class="box a"/>
<text x="420.0" y="611.0" text-anchor="middle" class="">y</text>
<text x="420" y="677" text-anchor="middle" class="small">共享分支直接相加；路由分支先乘权重，再相加</text>
</svg>
