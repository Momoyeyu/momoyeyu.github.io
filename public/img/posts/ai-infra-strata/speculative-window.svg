<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Greedy 投机验证：首个草稿接受，第二个分歧后改用目标预测，后续草稿与状态丢弃"><style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--reject:#b56c65}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--reject:#dd9389}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}.small{font-size:13px;fill:var(--muted)}.title{font-size:20px;font-weight:600}.box{stroke:var(--line);stroke-width:1.5;fill:var(--bg);rx:10}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.bad{fill:none;stroke:var(--reject);stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="400" y="30" class="title" text-anchor="middle">投机验证：接受匹配前缀，修正首次分歧</text><text x="25" y="95" class="" text-anchor="start">输入窗口</text><rect x="145" y="65" width="135" height="52" class="box a"/><text x="212" y="97" class="" text-anchor="middle">已确认 token</text><rect x="300" y="65" width="135" height="52" class="box b"/><text x="367" y="97" class="" text-anchor="middle">草稿 1</text><rect x="455" y="65" width="135" height="52" class="box b"/><text x="522" y="97" class="" text-anchor="middle">草稿 2</text><rect x="610" y="65" width="135" height="52" class="box b"/><text x="677" y="97" class="" text-anchor="middle">草稿 3</text><rect x="145" y="153" width="600" height="52" class="box "/><text x="445" y="185" class="" text-anchor="middle">主模型一次因果前向，得到每行预测</text><path d="M445 117 L445 153" class="arrow "/><text x="25" y="270" class="" text-anchor="start">逐项比较</text><rect x="145" y="235" width="180" height="72" class="box a"/><text x="235" y="262" class="" text-anchor="middle">草稿 1 匹配</text><text x="235" y="286" class="small" text-anchor="middle">接受</text><rect x="345" y="235" width="180" height="72" class="box c"/><text x="435" y="262" class="" text-anchor="middle">草稿 2 分歧</text><text x="435" y="286" class="small" text-anchor="middle">改用目标 token</text><rect x="545" y="235" width="180" height="72" class="box b"/><text x="635" y="262" class="" text-anchor="middle">草稿 3</text><text x="635" y="286" class="small" text-anchor="middle">丢弃</text><path d="M445 205 L445 235" class="arrow "/><rect x="145" y="350" width="600" height="67" class="box a"/><text x="445" y="378" class="" text-anchor="middle">提交：草稿 1 + 主模型修正 token</text><text x="445" y="400" class="small" text-anchor="middle">KV 与递归状态也只保留到这个前缀</text><path d="M235 307 L235 350" class="arrow "/><path d="M435 307 L435 350" class="arrow "/><text x="400" y="456" class="small" text-anchor="middle">若所有草稿都匹配，再提交最后一行给出的额外 token</text></svg>