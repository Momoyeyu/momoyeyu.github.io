<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="Router 发布路由，CPU 计算与 GPU 常驻计算和 PCIe 复制重叠，最终汇总"><style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--reject:#b56c65}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--reject:#dd9389}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}.small{font-size:13px;fill:var(--muted)}.title{font-size:20px;font-weight:600}.box{stroke:var(--line);stroke-width:1.5;fill:var(--bg);rx:10}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.bad{fill:none;stroke:var(--reject);stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="400" y="30" class="title" text-anchor="middle">一层的专家阶段：并行服务，汇合后进入下一层</text><text x="25" y="92" class="" text-anchor="start">GPU</text><text x="25" y="200" class="" text-anchor="start">复制引擎</text><text x="25" y="308" class="" text-anchor="start">CPU 池</text><rect x="120" y="65" width="125" height="58" class="box a"/><text x="182" y="90" class="" text-anchor="middle">Router</text><text x="182" y="110" class="small" text-anchor="middle">发布任务</text><rect x="270" y="65" width="185" height="58" class="box a"/><text x="362" y="90" class="" text-anchor="middle">共享与常驻专家</text><text x="362" y="110" class="small" text-anchor="middle">GPU 计算</text><rect x="505" y="65" width="140" height="58" class="box a"/><text x="575" y="90" class="" text-anchor="middle">搬入的专家</text><text x="575" y="110" class="small" text-anchor="middle">GPU 计算</text><rect x="670" y="65" width="105" height="58" class="box "/><text x="722" y="90" class="" text-anchor="middle">加权汇总</text><text x="722" y="110" class="small" text-anchor="middle">下一层</text><rect x="270" y="173" width="185" height="58" class="box c"/><text x="362" y="198" class="" text-anchor="middle">RAM → VRAM</text><text x="362" y="218" class="small" text-anchor="middle">未命中专家的一部分</text><rect x="270" y="281" width="375" height="58" class="box b"/><text x="457" y="306" class="" text-anchor="middle">其余未命中专家在 RAM 原地计算</text><text x="457" y="326" class="small" text-anchor="middle">只交回计算结果</text><path d="M245 94 L270 94" class="arrow "/><path d="M455 94 L505 94" class="arrow "/><path d="M645 94 L670 94" class="arrow "/><path d="M245 110 L255 110 L255 202 L270 202" class="arrow "/><path d="M255 202 L255 310 L270 310" class="arrow "/><path d="M455 202 L480 202 L480 123 L505 123" class="arrow "/><path d="M645 310 L722 310 L722 123" class="arrow "/><text x="400" y="387" class="small" text-anchor="middle">时间向右；块宽仅表达依赖，不代表实测耗时</text></svg>