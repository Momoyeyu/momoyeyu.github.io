<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" role="img" aria-label="PC 权重分层：显存热点、RAM 专家原地计算与 PCIe 搬运、SSD n-gram 查表"><style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--reject:#b56c65}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--reject:#dd9389}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}.small{font-size:13px;fill:var(--muted)}.title{font-size:20px;font-weight:600}.box{stroke:var(--line);stroke-width:1.5;fill:var(--bg);rx:10}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}.bad{fill:none;stroke:var(--reject);stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs><text x="400" y="30" class="title" text-anchor="middle">独立显卡 PC：按访问方式分层</text><rect x="25" y="55" width="750" height="140" class="box a"/><text x="50" y="83" class="" text-anchor="start">GPU / VRAM</text><rect x="45" y="103" width="330" height="70" class="box "/><text x="210" y="132" class="" text-anchor="middle">始终使用的权重与运行状态</text><text x="210" y="155" class="small" text-anchor="middle">注意力 · Router · 共享专家 · MTP · KV</text><rect x="435" y="103" width="315" height="70" class="box "/><text x="592" y="132" class="" text-anchor="middle">路由专家缓存</text><text x="592" y="155" class="small" text-anchor="middle">热点常驻，GPU 计算</text><rect x="25" y="275" width="750" height="95" class="box b"/><text x="50" y="303" class="" text-anchor="start">系统 RAM</text><text x="265" y="331" class="" text-anchor="middle">专家权重库</text><text x="580" y="331" class="" text-anchor="middle">CPU 原地计算未命中专家</text><path d="M 590 275 L 590 195" class="arrow "/><text x="605" y="232" class="small" text-anchor="start">部分专家经 PCIe 搬运</text><path d="M 270 275 L 270 195" class="arrow "/><path d="M 292 195 L 292 275" class="arrow "/><text x="248" y="252" class="small" text-anchor="end">输入与结果向量</text><rect x="25" y="440" width="750" height="65" class="box c"/><text x="170" y="478" class="" text-anchor="middle">SSD 上的 n-gram 表</text><text x="530" y="478" class="small" text-anchor="middle">每 token 只查询少量行</text><path d="M 120 440 L 120 370" class="arrow "/><text x="140" y="412" class="small" text-anchor="start">按行读取与预读</text><text x="400" y="535" class="small" text-anchor="middle">图示为 RAM 驻留模式；低内存模式另有文件映射与交换策略</text></svg>