<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title desc">
<title id="title">QK-Norm 的位置</title>
<desc id="desc">Q 和 K 投影后按 head 做 RMSNorm，再做 RoPE，计算 QK 转置除以根号 d，然后 softmax。图止于注意力权重，V 不经过 QK-Norm。</desc>
<style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:25px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.weight{stroke:var(--accent);stroke-dasharray:5 5}.faint{opacity:.3}.wire{fill:none;stroke:var(--line);stroke-width:1.4}</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/>
</marker>
</defs>
<text x="400" y="36" text-anchor="middle" class="title">QK-Norm：先校正尺度，再注入位置</text>
<rect x="135" y="390" width="110" height="42" rx="6" class="box b"/>
<text x="190.0" y="418.0" text-anchor="middle" class="">Wq</text>
<rect x="115" y="304" width="150" height="44" rx="6" class="box c"/>
<text x="190.0" y="333.0" text-anchor="middle" class="">RMSNorm</text>
<rect x="135" y="218" width="110" height="42" rx="6" class="box "/>
<text x="190.0" y="246.0" text-anchor="middle" class="">RoPE</text>
<path d="M190 390 V348" class="arrow "/>
<path d="M190 304 V260" class="arrow "/>
<rect x="555" y="390" width="110" height="42" rx="6" class="box b"/>
<text x="610.0" y="418.0" text-anchor="middle" class="">Wk</text>
<rect x="535" y="304" width="150" height="44" rx="6" class="box c"/>
<text x="610.0" y="333.0" text-anchor="middle" class="">RMSNorm</text>
<rect x="555" y="218" width="110" height="42" rx="6" class="box "/>
<text x="610.0" y="246.0" text-anchor="middle" class="">RoPE</text>
<path d="M610 390 V348" class="arrow "/>
<path d="M610 304 V260" class="arrow "/>
<rect x="345" y="476" width="110" height="42" rx="6" class="box "/>
<text x="400.0" y="504.0" text-anchor="middle" class="">x</text>
<path d="M400 476 V455 H190 V432" class="arrow "/>
<path d="M400 455 H610 V432" class="arrow "/>
<rect x="305" y="122" width="190" height="44" rx="6" class="box b"/>
<text x="400.0" y="151.0" text-anchor="middle" class="">QKᵀ / √d</text>
<path d="M190 218 V144 H305" class="arrow "/>
<path d="M610 218 V144 H495" class="arrow "/>
<rect x="305" y="52" width="190" height="42" rx="6" class="box "/>
<text x="400.0" y="80.0" text-anchor="middle" class="">softmax</text>
<path d="M400 122 V94" class="arrow "/>
<text x="190" y="199" text-anchor="middle" class="math">Q</text>
<text x="610" y="199" text-anchor="middle" class="math">K</text>
<text x="400" y="552" text-anchor="middle" class="small">对每个 head 的特征维做归一化；V 仍由独立分支计算</text>
</svg>
