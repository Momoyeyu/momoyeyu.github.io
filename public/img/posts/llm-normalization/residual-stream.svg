<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="残差流 std 随层数变化曲线：无归一化时 std 按 sqrt 规律从 1 增长到约 1.28，Pre-Norm 下稳定在 1 附近；灰色虚线为 sqrt(1+0.01n) 理论参照">
