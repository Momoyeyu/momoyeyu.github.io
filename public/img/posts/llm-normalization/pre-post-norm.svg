<svg xmlns="http://www.w3.org/2000/svg" width="800" height="565" viewBox="0 0 800 565" role="img" aria-labelledby="title desc">
<title id="title">Pre-Norm 与 Post-Norm</title>
<desc id="desc">两种子层的输入自下向上流动。Post-Norm 在相加之后归一化，Pre-Norm 仅归一化分支输入，跳连绕过 Norm 和 F。</desc>
<style>:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}.title{font-size:25px;font-weight:600}.small{font-size:17px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-style:italic}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.weight{stroke:var(--accent);stroke-dasharray:5 5}.faint{opacity:.3}.wire{fill:none;stroke:var(--line);stroke-width:1.4}</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/>
</marker>
</defs>
<text x="400" y="35" text-anchor="middle" class="title">Norm 放在哪里？</text>
<text x="195" y="79" text-anchor="middle" class="">Post-Norm</text>
<rect x="140" y="450" width="110" height="42" rx="6" class="box "/>
<text x="195.0" y="478.0" text-anchor="middle" class="">x</text>
<rect x="140" y="110" width="110" height="42" rx="6" class="box "/>
<text x="195.0" y="138.0" text-anchor="middle" class="">x′</text>
<rect x="140" y="290" width="110" height="48" rx="6" class="box b"/>
<text x="195.0" y="321.0" text-anchor="middle" class="">F</text>
<circle cx="195" cy="224" r="17" class="box"/>
<text x="195" y="231" text-anchor="middle" class="">+</text>
<path d="M195 290 V241" class="arrow "/>
<rect x="140" y="163" width="110" height="32" rx="6" class="box c"/>
<text x="195.0" y="186.0" text-anchor="middle" class="">Norm</text>
<path d="M195 207 V195" class="arrow "/>
<path d="M195 163 V152" class="arrow "/>
<path d="M195 450 V338" class="arrow "/>
<path d="M195 434 H335 V224 H212" class="arrow "/>
<text x="339" y="361" text-anchor="middle" class="math">x</text>
<text x="195" y="536" text-anchor="middle" class="math">Norm(x + F(x))</text>
<text x="595" y="79" text-anchor="middle" class="">Pre-Norm</text>
<rect x="540" y="450" width="110" height="42" rx="6" class="box "/>
<text x="595.0" y="478.0" text-anchor="middle" class="">x</text>
<rect x="540" y="110" width="110" height="42" rx="6" class="box "/>
<text x="595.0" y="138.0" text-anchor="middle" class="">x′</text>
<rect x="540" y="290" width="110" height="48" rx="6" class="box b"/>
<text x="595.0" y="321.0" text-anchor="middle" class="">F</text>
<circle cx="595" cy="224" r="17" class="box"/>
<text x="595" y="231" text-anchor="middle" class="">+</text>
<path d="M595 290 V241" class="arrow "/>
<rect x="540" y="382" width="110" height="38" rx="6" class="box c"/>
<text x="595.0" y="408.0" text-anchor="middle" class="">Norm</text>
<path d="M595 450 V420" class="arrow "/>
<path d="M595 382 V338" class="arrow "/>
<path d="M595 207 V152" class="arrow "/>
<path d="M595 434 H735 V224 H612" class="arrow "/>
<text x="739" y="361" text-anchor="middle" class="math">x</text>
<text x="595" y="536" text-anchor="middle" class="math">x + F(Norm(x))</text>
</svg>
