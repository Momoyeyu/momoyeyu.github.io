<text x="771" y="853" class="chip" text-anchor="middle">tool</text>
<text x="30" y="916" class="ts" text-anchor="start">压缩后</text>
<rect x="90" y="892" width="66" height="32" rx="6" class="bx f-gray"/>
<text x="123" y="913" class="chip" text-anchor="middle">hdr</text>
<rect x="162" y="892" width="66" height="32" rx="6" class="bx f-orange" opacity=".45"/>
<text x="195" y="913" class="chip" text-anchor="middle">usr</text>
<rect x="234" y="892" width="66" height="32" rx="6" class="bx f-orange" opacity=".45"/>
<text x="267" y="913" class="chip" text-anchor="middle">ass</text>
<rect x="306" y="892" width="66" height="32" rx="6" class="bx f-orange" opacity=".45"/>
<text x="339" y="913" class="chip" text-anchor="middle">tool</text>
<rect x="378" y="892" width="66" height="32" rx="6" class="bx f-green"/>
<text x="411" y="913" class="chip" text-anchor="middle">usr</text>
<rect x="450" y="892" width="66" height="32" rx="6" class="bx f-green"/>
