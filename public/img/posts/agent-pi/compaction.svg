<rect x="738" y="892" width="66" height="32" rx="6" class="bx f-green"/>
<text x="771" y="913" class="chip" text-anchor="middle">tool</text>
<rect x="810" y="892" width="66" height="32" rx="6" class="bx f-purple"/>
<text x="843" y="913" class="chip" text-anchor="middle">cmp</text>
<text x="30" y="976" class="ts" text-anchor="start">LLM 视角</text>
<rect x="90" y="952" width="66" height="32" rx="6" class="bx f-gray"/>
<text x="123" y="973" class="chip" text-anchor="middle">system</text>
<rect x="162" y="952" width="66" height="32" rx="6" class="bx f-purple"/>
