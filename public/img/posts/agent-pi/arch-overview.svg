<rect x="600" y="676" width="280" height="100" rx="8" class="bx f-gray"/><text x="740" y="700" class="tt" text-anchor="middle">本机执行环境（OS 权限）</text><text x="740" y="720" class="ts" text-anchor="middle">文件系统 · 子进程 · 网络</text><text x="740" y="739" class="ts" text-anchor="middle">扩展与工具均在此进程内执行</text>
