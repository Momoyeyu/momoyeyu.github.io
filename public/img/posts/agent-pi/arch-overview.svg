<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1262" viewBox="0 0 900 1262" role="img" aria-labelledby="title desc">
<title id="title">Pi 整体架构</title>
<desc id="desc">五种入口共享 AgentSession；核心层装配会话、压缩、提示词与工具；下层是 agent loop 与 pi-ai 模型层；底部是本地持久化。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--muted:#667386;--accent:#508369;--error:#aa5653;--blue:#d7e4f2;--purple:#e3ddf0;--teal:#d5e8e6;--orange:#f3e2cd;--yellow:#f0e6c8;--green:#dcead9;--pink:#f2dbe4;--gray:#e8eaee}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--muted:#b2bdcb;--accent:#86b49b;--error:#d99087;--blue:#26374c;--purple:#352f47;--teal:#27403d;--orange:#453723;--yellow:#453e24;--green:#2c3d2f;--pink:#432c39;--gray:#33383f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}
.title{font-size:25px;font-weight:600}.lead{font-size:15px;fill:var(--muted)}.cl{font-size:15px;font-weight:600;fill:var(--muted)}.tt{font-size:16px;font-weight:600}.ts{font-size:14px;fill:var(--muted)}.chip{font-size:13px}
.bx{stroke:var(--line);stroke-width:1.4}.ct{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.55}
.f-blue{fill:var(--blue)}.f-purple{fill:var(--purple)}.f-teal{fill:var(--teal)}.f-orange{fill:var(--orange)}.f-yellow{fill:var(--yellow)}.f-green{fill:var(--green)}.f-pink{fill:var(--pink)}.f-gray{fill:var(--gray)}
.ar{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#ah)}.al{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round}.ard{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;marker-end:url(#ah)}
.dim{opacity:.42}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<rect width="900" height="1262" rx="14" fill="var(--bg)"/>
<text x="450" y="42" class="title" text-anchor="middle">Pi 整体架构</text>
<text x="450" y="72" class="lead" text-anchor="middle">五种入口共享 AgentSession，模型调用统一经过 pi-ai</text>
<rect x="20" y="92" width="860" height="132" rx="12" class="ct"/>
<text x="40" y="118" class="cl" text-anchor="start">接口层 · modes，5 种入口共享同一 AgentSession</text>
<rect x="36" y="130" width="156" height="62" rx="8" class="bx f-blue"/><text x="114" y="154" class="tt" text-anchor="middle">Interactive TUI</text><text x="114" y="174" class="ts" text-anchor="middle">modes/interactive</text>
<rect x="208" y="130" width="156" height="62" rx="8" class="bx f-blue"/><text x="286" y="154" class="tt" text-anchor="middle">Print 模式</text><text x="286" y="174" class="ts" text-anchor="middle">单次执行输出结果</text>
<rect x="380" y="130" width="156" height="62" rx="8" class="bx f-blue"/><text x="458" y="154" class="tt" text-anchor="middle">JSON 模式</text><text x="458" y="174" class="ts" text-anchor="middle">agent 事件 JSONL</text>
<rect x="552" y="130" width="156" height="62" rx="8" class="bx f-blue"/><text x="630" y="154" class="tt" text-anchor="middle">RPC 模式</text><text x="630" y="174" class="ts" text-anchor="middle">stdin/stdout JSONL</text>
<rect x="724" y="130" width="156" height="62" rx="8" class="bx f-blue"/><text x="802" y="154" class="tt" text-anchor="middle">TypeScript SDK</text><text x="802" y="174" class="ts" text-anchor="middle">createAgentSession</text>
<path d="M114,192 V210 M286,192 V210 M458,192 V210 M630,192 V210 M802,192 V210 M114,210 H802" class="al"/>
<path d="M450,210 V240" class="ar"/>
<text x="466" y="232" class="ts" text-anchor="start">main.ts 解析参数 → createAgentSession</text>
<rect x="20" y="240" width="860" height="400" rx="12" class="ct"/>
<text x="40" y="266" class="cl" text-anchor="start">coding-agent 核心 · packages/coding-agent/src/core</text>
<rect x="330" y="282" width="240" height="78" rx="8" class="bx f-purple"/><text x="450" y="306" class="tt" text-anchor="middle">AgentSession</text><text x="450" y="326" class="ts" text-anchor="middle">会话编排 · 事件订阅与持久化</text><text x="450" y="345" class="ts" text-anchor="middle">模型/thinking 切换 · bash 执行</text>
<rect x="40" y="282" width="220" height="60" rx="8" class="bx f-green"/><text x="150" y="306" class="tt" text-anchor="middle">SessionManager</text><text x="150" y="326" class="ts" text-anchor="middle">JSONL 会话树 · 分支 · 投影</text>
<rect x="40" y="358" width="220" height="60" rx="8" class="bx f-orange"/><text x="150" y="382" class="tt" text-anchor="middle">Compaction</text><text x="150" y="402" class="ts" text-anchor="middle">阈值 / 手动 / 溢出恢复</text>
<rect x="40" y="434" width="220" height="60" rx="8" class="bx f-yellow"/><text x="150" y="458" class="tt" text-anchor="middle">System Prompt</text><text x="150" y="478" class="ts" text-anchor="middle">base + AGENTS.md + skills</text>
<rect x="640" y="282" width="220" height="60" rx="8" class="bx f-teal"/><text x="750" y="306" class="tt" text-anchor="middle">ModelRuntime</text><text x="750" y="326" class="ts" text-anchor="middle">认证解析 · 模型目录 · 重试</text>
<rect x="640" y="358" width="220" height="60" rx="8" class="bx f-gray"/><text x="750" y="382" class="tt" text-anchor="middle">Settings · Trust</text><text x="750" y="402" class="ts" text-anchor="middle">settings.json · 项目信任</text>
<rect x="640" y="434" width="220" height="60" rx="8" class="bx f-gray"/><text x="750" y="458" class="tt" text-anchor="middle">ResourceLoader</text><text x="750" y="478" class="ts" text-anchor="middle">扩展/技能/模板/包管理</text>
