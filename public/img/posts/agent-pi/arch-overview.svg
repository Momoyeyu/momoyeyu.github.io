<rect x="480" y="512" width="380" height="64" rx="8" class="bx f-pink"/><text x="670" y="536" class="tt" text-anchor="middle">扩展系统 ExtensionRunner</text><text x="670" y="556" class="ts" text-anchor="middle">内置扩展 MCP · codemode · tool-search + 用户扩展</text>
<path d="M420,360 V512" class="ar"/>
<path d="M520,360 V512" class="ar"/>
<rect x="100" y="676" width="460" height="124" rx="12" class="ct"/>
<text x="120" y="702" class="cl" text-anchor="start">pi-agent-core · packages/agent</text>
<rect x="120" y="716" width="210" height="64" rx="8" class="bx f-teal"/><text x="225" y="740" class="tt" text-anchor="middle">agentLoop / runLoop</text><text x="225" y="760" class="ts" text-anchor="middle">turn 循环 · 事件流 · Agent 状态</text>
<rect x="350" y="716" width="190" height="64" rx="8" class="bx f-teal"/><text x="445" y="740" class="tt" text-anchor="middle">工具执行管线</text><text x="445" y="760" class="ts" text-anchor="middle">校验→钩子→执行→结果</text>
<path d="M350,640 V672" class="ar"/>
