<rect x="510" y="140" width="340" height="44" rx="8" class="bx f-green"/>
<text x="680" y="167" class="ts" text-anchor="middle">活动分支 entries（leaf → root 路径）</text>
<path d="M680,184 V200" class="ar"/>
