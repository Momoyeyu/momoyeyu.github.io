<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 403" role="img" aria-labelledby="title desc">
<title id="title">两张卡怎么一起跑同一个 batch</title>
<desc id="desc">控制消息从主进程发出，各 GPU 执行各自的权重分片，由 NCCL 聚合，rank 0 采样。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="403" rx="12" class="bg"/>
<rect x="20" y="19" width="920" height="127" rx="8" class="panel"/><text x="41" y="49" class="band" text-anchor="start">控制路径 · 同一批请求</text><rect x="43" y="66" width="232" height="62" rx="8" class="violet"/><text x="159.0" y="94.0" class="label" text-anchor="middle">rank 0</text><text x="159.0" y="118.0" class="sub" text-anchor="middle">管理队列、安排 batch</text><rect x="360" y="66" width="240" height="62" rx="8" class="neutral"/><text x="480.0" y="94.0" class="label" text-anchor="middle">共享内存 + 事件</text><text x="480.0" y="118.0" class="sub" text-anchor="middle">传调用和序列信息</text><rect x="685" y="66" width="232" height="62" rx="8" class="violet"/><text x="801.0" y="94.0" class="label" text-anchor="middle">rank 1</text><text x="801.0" y="118.0" class="sub" text-anchor="middle">收到同一个 batch</text><path d="M275 97 H360" class="flow dotted"/><path d="M600 97 H685" class="flow dotted"/><rect x="20" y="173" width="920" height="207" rx="8" class="panel"/><text x="301" y="205" class="band" text-anchor="start">计算路径 · 各卡算各自权重分片</text><path d="M159 128 V234" class="flow"/><path d="M801 128 V234" class="flow"/><rect x="43" y="234" width="232" height="66" rx="8" class="blue"/><text x="159.0" y="264.0" class="label" text-anchor="middle">GPU 0</text><text x="159.0" y="288.0" class="sub" text-anchor="middle">本地权重与 KV 分片</text><rect x="685" y="234" width="232" height="66" rx="8" class="blue"/><text x="801.0" y="264.0" class="label" text-anchor="middle">GPU 1</text><text x="801.0" y="288.0" class="sub" text-anchor="middle">本地权重与 KV 分片</text><path d="M275 266 H360" class="flow"/><path d="M685 266 H600" class="flow"/><rect x="360" y="230" width="240" height="72" rx="8" class="teal"/><text x="480.0" y="263.0" class="label" text-anchor="middle">NCCL</text><text x="480.0" y="287.0" class="sub" text-anchor="middle">按层聚合张量</text><path d="M480 302 V326" class="flow"/><rect x="308" y="326" width="344" height="42" rx="8" class="violet"/><text x="480.0" y="354.0" class="label" text-anchor="middle">rank 0 汇总词表分数并采样</text>
</svg>
