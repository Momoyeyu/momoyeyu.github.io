<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" role="img" aria-labelledby="title desc">
<title id="title">两条序列共享同一个前缀块</title>
<desc id="desc">块表将序列中的逻辑块映射到 GPU 物理块，共享前缀与私有后缀存到不同块。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="414" rx="12" class="bg"/>
<rect x="20" y="22" width="920" height="146" rx="8" class="panel"/><text x="42" y="54" class="band" text-anchor="start">CPU：每条序列自己的块表</text><text x="232" y="86" class="mono" text-anchor="middle">A  [7, 2]</text><text x="730" y="86" class="mono" text-anchor="middle">B  [7, 5]</text><rect x="67" y="107" width="164" height="42" rx="8" class="blue"/><text x="149.0" y="135.0" class="label" text-anchor="middle">A 的尾块</text><rect x="283" y="107" width="164" height="42" rx="8" class="teal"/><text x="365.0" y="135.0" class="label" text-anchor="middle">A 的前缀</text><rect x="513" y="107" width="164" height="42" rx="8" class="teal"/><text x="595.0" y="135.0" class="label" text-anchor="middle">B 的前缀</text><rect x="730" y="107" width="164" height="42" rx="8" class="violet"/><text x="812.0" y="135.0" class="label" text-anchor="middle">B 的尾块</text><rect x="20" y="198" width="920" height="132" rx="8" class="panel"/><text x="42" y="230" class="band" text-anchor="start">GPU</text><rect x="44" y="249" width="210" height="59" rx="8" class="blue"/><text x="149.0" y="275.5" class="label" text-anchor="middle">块 2</text><text x="149.0" y="299.5" class="sub" text-anchor="middle">A 的尾块</text><rect x="375" y="249" width="210" height="59" rx="8" class="teal"/><text x="480.0" y="275.5" class="label" text-anchor="middle">块 7</text><text x="480.0" y="299.5" class="sub" text-anchor="middle">引用数 2</text><rect x="708" y="249" width="210" height="59" rx="8" class="violet"/><text x="813.0" y="275.5" class="label" text-anchor="middle">块 5</text><text x="813.0" y="299.5" class="sub" text-anchor="middle">B 的尾块</text><path d="M149 149 V249" class="flow dotted"/><path d="M365 149 V182 H452 V249" class="flow dotted"/><path d="M595 149 V182 H508 V249" class="flow dotted"/><path d="M812 149 V249" class="flow dotted"/><rect x="20" y="346" width="920" height="49" rx="8" class="panel"/><text x="480" y="378" class="mono" text-anchor="middle">块 5 的第 2 个位置：slot = 5 × 4 + 1 = 21</text>
</svg>
