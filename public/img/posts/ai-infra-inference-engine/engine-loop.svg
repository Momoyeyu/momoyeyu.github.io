<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" role="img" aria-labelledby="title desc">
<title id="title">一轮轮推进请求</title>
<desc id="desc">每轮调度、执行和回写，等两个请求队列清空后返回生成结果。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="362" rx="12" class="bg"/>
<rect x="30" y="26" width="200" height="66" rx="8" class="violet"/><text x="130.0" y="56.0" class="label" text-anchor="middle">提示词列表</text><text x="130.0" y="80.0" class="sub" text-anchor="middle">文本 → token IDs</text><path d="M230 59.0 H262" class="flow"/><rect x="262" y="26" width="200" height="66" rx="8" class="neutral"/><text x="362.0" y="56.0" class="label" text-anchor="middle">Sequence</text><text x="362.0" y="80.0" class="sub" text-anchor="middle">记录请求状态</text><path d="M462 59.0 H494" class="flow"/><rect x="494" y="26" width="200" height="66" rx="8" class="violet"/><text x="594.0" y="56.0" class="label" text-anchor="middle">等待队列</text><text x="594.0" y="80.0" class="sub" text-anchor="middle">等待安排前向</text><path d="M694 59.0 H726" class="flow"/><rect x="726" y="26" width="200" height="66" rx="8" class="blue"/><text x="826.0" y="56.0" class="label" text-anchor="middle">step()</text><text x="826.0" y="80.0" class="sub" text-anchor="middle">重复推进</text><rect x="83" y="148" width="794" height="85" rx="8" class="panel"/><rect x="105" y="162" width="201" height="55" rx="8" class="violet"/><text x="205.5" y="186.5" class="label" text-anchor="middle">选一批</text><text x="205.5" y="210.5" class="sub" text-anchor="middle">schedule</text><rect x="380" y="162" width="201" height="55" rx="8" class="blue"/><text x="480.5" y="186.5" class="label" text-anchor="middle">执行这一批</text><text x="480.5" y="210.5" class="sub" text-anchor="middle">ModelRunner.run</text><rect x="655" y="162" width="201" height="55" rx="8" class="teal"/><text x="755.5" y="186.5" class="label" text-anchor="middle">更新序列</text><text x="755.5" y="210.5" class="sub" text-anchor="middle">postprocess</text><path d="M826 92 V116 H206 V162" class="flow"/><path d="M306 190 H380" class="flow"/><path d="M581 190 H655" class="flow"/><path d="M757 217 V260 H202 V217" class="flow dotted"/><text x="476" y="252" class="small" text-anchor="middle">队列还有任务，继续下一轮</text><path d="M757 260 V279" class="flow"/><rect x="629" y="279" width="256" height="60" rx="8" class="neutral"/><text x="757.0" y="306.0" class="label" text-anchor="middle">按输入顺序返回</text><text x="757.0" y="330.0" class="sub" text-anchor="middle">两条队列都为空</text>
</svg>
