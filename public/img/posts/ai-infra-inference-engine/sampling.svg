<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" role="img" aria-labelledby="title desc">
<title id="title">候选和已提交 token 的区别</title>
<desc id="desc">中间 prefill 片段只推进缓存进度，其他轮次可以追加候选并检查停止条件。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="335" rx="12" class="bg"/>
<rect x="30" y="25" width="200" height="66" rx="8" class="neutral"/><text x="130.0" y="55.0" class="label" text-anchor="middle">最后一行表示</text><text x="130.0" y="79.0" class="sub" text-anchor="middle">prefill 每片段取一行</text><path d="M230 58.0 H262" class="flow"/><rect x="262" y="25" width="200" height="66" rx="8" class="blue"/><text x="362.0" y="55.0" class="label" text-anchor="middle">词表投影</text><text x="362.0" y="79.0" class="sub" text-anchor="middle">得到 logits</text><path d="M462 58.0 H494" class="flow"/><rect x="494" y="25" width="200" height="66" rx="8" class="blue"/><text x="594.0" y="55.0" class="label" text-anchor="middle">按温度采样</text><text x="594.0" y="79.0" class="sub" text-anchor="middle">每条得到候选 token</text><path d="M694 58.0 H726" class="flow"/><rect x="726" y="25" width="200" height="66" rx="8" class="violet"/><text x="826.0" y="55.0" class="label" text-anchor="middle">回到调度器</text><text x="826.0" y="79.0" class="sub" text-anchor="middle">先推进缓存进度</text><path d="M825 91 V147 H590" class="flow"/><path d="M350.0 147 L470 111.0 L590.0 147 L470 183.0 Z" class="amber"/><text x="470" y="153" class="label" text-anchor="middle">还在中间片段？</text><path d="M350 147 H312" class="flow"/><text x="329" y="136" class="small" text-anchor="middle">是</text><rect x="43" y="113" width="269" height="68" rx="8" class="amber"/><text x="177.5" y="144.0" class="label" text-anchor="middle">不提交候选</text><text x="177.5" y="168.0" class="sub" text-anchor="middle">继续 prefill</text><path d="M470 183 V211" class="flow"/><text x="486" y="201" class="small" text-anchor="start">否</text><rect x="347" y="211" width="246" height="62" rx="8" class="teal"/><text x="470.0" y="239.0" class="label" text-anchor="middle">追加 token</text><text x="470.0" y="263.0" class="sub" text-anchor="middle">继续或按条件结束</text><path d="M593 242 H704" class="flow"/><text x="648" y="228" class="small" text-anchor="middle">已结束</text><rect x="704" y="211" width="186" height="62" rx="8" class="neutral"/><text x="797.0" y="239.0" class="label" text-anchor="middle">回收缓存块</text><text x="797.0" y="263.0" class="sub" text-anchor="middle">移出运行队列</text><path d="M470 273 V307 H686" class="flow dotted"/><text x="697" y="312" class="small" text-anchor="start">未结束 → 下一轮</text>
</svg>
