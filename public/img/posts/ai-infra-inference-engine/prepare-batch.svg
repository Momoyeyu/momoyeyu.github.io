<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="title desc">
<title id="title">同一批如何变成 GPU 输入</title>
<desc id="desc">prefill 合并输入片段并记录其边界，decode 每条只接收最后一个 token 并附历史地址。</desc>
<style>
:root{--fg:#23314c;--sub:#455877;--line:#637594;--edge:#bbc9df;--paper:#f7f9fd;--panel:#eef3fa;--base:#23365f;--on-base:#f0f5ff;--neutral:#fff;--violet:#edeaff;--blue:#e3efff;--teal:#deefe9;--amber:#faeed8}
@media(prefers-color-scheme:dark){:root{--fg:#e7edf9;--sub:#bac9de;--line:#a6b7d3;--edge:#53647f;--paper:#181f2d;--panel:#212c40;--base:#263e67;--on-base:#f0f5ff;--neutral:#252d40;--violet:#383356;--blue:#273e61;--teal:#284941;--amber:#4f3e29}}
text{font-family:Helvetica,Arial,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:var(--fg);font-size:18px}
.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:var(--sub)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}.band{font-weight:650;font-size:16px}.small{font-size:14px;fill:var(--sub)}.roof-title{fill:var(--on-base);font-size:23px;font-weight:700}.roof-sub{fill:var(--on-base);font-size:15px}
.bg{fill:var(--paper)}.neutral,.violet,.blue,.teal,.amber,.panel{stroke:var(--edge);stroke-width:1.1}.neutral{fill:var(--neutral)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.panel{fill:var(--panel)}.base{fill:var(--base)}.roofline{stroke:var(--base);stroke-width:4;fill:none;stroke-linecap:round}
.line,.flow{stroke:var(--line);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.flow{marker-end:url(#arrow)}.dotted{stroke-dasharray:5 5}.arrow{fill:var(--line)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10Z" class="arrow"/></marker></defs>
<rect x="0" y="0" width="960" height="368" rx="12" class="bg"/>
<rect x="20" y="22" width="451" height="219" rx="8" class="panel"/><rect x="489" y="22" width="451" height="219" rx="8" class="panel"/><text x="40" y="55" class="band" text-anchor="start">Prefill · 把两个片段拼起来</text><text x="511" y="55" class="band" text-anchor="start">Decode · 每条序列带一个 token</text><rect x="42" y="77" width="48" height="34" rx="4" class="violet"/><text x="66.0" y="100" class="mono" text-anchor="middle">A₄</text><rect x="95" y="77" width="48" height="34" rx="4" class="violet"/><text x="119.0" y="100" class="mono" text-anchor="middle">A₅</text><rect x="148" y="77" width="48" height="34" rx="4" class="violet"/><text x="172.0" y="100" class="mono" text-anchor="middle">A₆</text><rect x="207" y="77" width="48" height="34" rx="4" class="blue"/><text x="231.0" y="100" class="mono" text-anchor="middle">B₀</text><rect x="260" y="77" width="48" height="34" rx="4" class="blue"/><text x="284.0" y="100" class="mono" text-anchor="middle">B₁</text><text x="42" y="146" class="mono" text-anchor="start">cu_seqlens_q = [0, 3, 5]</text><text x="42" y="175" class="mono" text-anchor="start">cu_seqlens_k = [0, 7, 9]</text><text x="42" y="208" class="sub" text-anchor="start">K 的长度计入 A 已缓存的 4 个位置</text><rect x="511" y="77" width="48" height="34" rx="4" class="violet"/><text x="535.0" y="100" class="mono" text-anchor="middle">a₁</text><rect x="568" y="77" width="48" height="34" rx="4" class="blue"/><text x="592.0" y="100" class="mono" text-anchor="middle">b₁</text><text x="511" y="146" class="mono" text-anchor="start">context_lens + block_tables</text><text x="511" y="176" class="sub" text-anchor="start">历史长度与块表告知模型从哪里读</text><path d="M242 241 V268 H350 V280" class="flow"/><path d="M711 241 V268 H611 V280" class="flow"/><rect x="260" y="280" width="441" height="64" rx="8" class="teal"/><text x="480.5" y="309.0" class="label" text-anchor="middle">input_ids + positions + Context</text><text x="480.5" y="333.0" class="sub" text-anchor="middle">两条路径都用 slot_mapping 指定写址</text>
</svg>
