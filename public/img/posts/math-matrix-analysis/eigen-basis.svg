<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="对 A 为矩阵二一一二、x 为一零：原坐标下 x 水平，特征坐标下 z 为根号二分之一与根号二分之一，逐轴缩放后为三倍根号二分之一与根号二分之一，再换回原坐标得到二一；各箭头按相同单位长度绘制，但坐标轴属于不同坐标系">
	<style>
		:root { --fg:#2b2b2b; --line:#3d3d3d; --expert-stroke:#7b9cc4; --router-stroke:#b8912f; --step-stroke:#9aa5b1; }
		@media (prefers-color-scheme:dark) { :root { --fg:#d8d8d8; --line:#b8b8b8; --expert-stroke:#83aad6; --router-stroke:#dab651; --step-stroke:#6b7684; } }
		text { fill:var(--fg); } .lbl { font:14px "Helvetica Neue",Helvetica,Arial,sans-serif; } .math { font:italic 16px "Times New Roman",Times,serif; } .axis { stroke:var(--step-stroke);stroke-width:1.2;fill:none; }
	</style>
	<defs><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--step-stroke)"/></marker><marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--expert-stroke)"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--router-stroke)"/></marker></defs>
	<g class="axis" marker-end="url(#axis)"><path d="M28 176 H116 M48 194 V64 M197 176 H285 M217 194 V64 M365 176 H473 M385 194 V64 M540 176 H648 M560 194 V64"/></g>
	<path d="M25 199 L105 119 M25 153 L105 233" stroke="var(--router-stroke)" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity=".72"/>
	<g class="math" style="font-size:12px"><text x="108" y="192">x₁</text><text x="55" y="69">x₂</text><text x="95" y="122">q₁</text><text x="93" y="233">q₂</text><text x="278" y="192">z₁</text><text x="224" y="69">z₂</text><text x="466" y="192">z₁</text><text x="392" y="69">z₂</text><text x="641" y="192">x₁</text><text x="567" y="69">x₂</text></g>
	<g class="math" text-anchor="middle" style="font-size:14px"><text x="80" y="33">x = (1, 0)</text><text x="249" y="33">z = (1/√2, 1/√2)</text><text x="417" y="33">Λz = (3/√2, 1/√2)</text><text x="593" y="33">Ax = (2, 1)</text></g>
	<path d="M48 176 L88 176" stroke="var(--line)" stroke-width="2.2" marker-end="url(#fg)"/>
	<path d="M217 176 L245.3 147.7" stroke="var(--expert-stroke)" stroke-width="2.2" marker-end="url(#blue)"/>
	<path d="M385 176 L469.9 147.7" stroke="var(--router-stroke)" stroke-width="2.2" marker-end="url(#gold)"/>
	<path d="M560 176 L640 136" stroke="var(--line)" stroke-width="2.2" marker-end="url(#fg)"/>
	<g stroke="var(--step-stroke)" stroke-width="1.5" fill="none" marker-end="url(#axis)"><path d="M127 112 H181 M294 112 H350 M481 112 H527"/></g>
	<g class="math" text-anchor="middle"><text x="154" y="99">Qᵀ</text><text x="322" y="99">Λ</text><text x="504" y="99">Q</text></g>
	<g class="math"><text x="91" y="163">x</text><text x="244" y="137">z</text><text x="439" y="137">Λz</text><text x="632" y="126">Ax</text></g>
	<g class="lbl" text-anchor="middle"><text x="80" y="258">原坐标与特征轴</text><text x="249" y="258">沿特征轴记坐标</text><text x="417" y="258">在特征坐标中缩放</text><text x="593" y="258">换回原坐标</text></g>
</svg>
