<svg viewBox="0 0 700 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="截至2026年10月国产算力的软件迁移路线：MUSA和MXMACA代码适配、海光DTK与HIP生态、自有运行时；兼容不代表二进制直接运行">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--cuda-fill: #f5e9c9;
			--cuda-stroke: #b8912f;
			--rocm-fill: #dce9f7;
			--rocm-stroke: #7b9cc4;
			--own-fill: #d8ecd8;
			--own-stroke: #6aa86a;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--cuda-fill: #4a3d1e;
				--cuda-stroke: #c9a53f;
				--rocm-fill: #26364d;
				--rocm-stroke: #6c8ebf;
				--own-fill: #24392b;
				--own-stroke: #7fb37f;
			}
		}
		text { fill: var(--fg); }
		.hd { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
		.name { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; }
		.sub { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; opacity: 0.75; }
		.col-hd { stroke-width: 1.6; rx: 9; }
		.card { stroke-width: 1.3; rx: 7; }
	</style>

	<!-- column headers -->
	<rect x="15" y="18" width="218" height="36" class="col-hd" fill="var(--cuda-fill)" stroke="var(--cuda-stroke)"/>
	<text x="124" y="42" class="hd" text-anchor="middle">CUDA 代码迁移</text>

	<rect x="247" y="18" width="206" height="36" class="col-hd" fill="var(--rocm-fill)" stroke="var(--rocm-stroke)"/>
	<text x="350" y="42" class="hd" text-anchor="middle">HIP 生态适配</text>

	<rect x="467" y="18" width="218" height="36" class="col-hd" fill="var(--own-fill)" stroke="var(--own-stroke)"/>
	<text x="576" y="42" class="hd" text-anchor="middle">自有运行时</text>

	<!-- CUDA column -->
	<rect x="15" y="66" width="218" height="74" class="card" fill="var(--cuda-fill)" stroke="var(--cuda-stroke)" opacity="0.55"/>
	<text x="29" y="90" class="name">摩尔线程</text>
	<text x="29" y="110" class="sub">MUSA 架构 · 提供迁移工具</text>
	<text x="29" y="128" class="sub">S80 桌面卡 / S5000 集群交付</text>

	<rect x="15" y="152" width="218" height="74" class="card" fill="var(--cuda-fill)" stroke="var(--cuda-stroke)" opacity="0.55"/>
	<text x="29" y="176" class="name">沐曦</text>
	<text x="29" y="196" class="sub">MXMACA 栈 · 曦云 C600 已量产</text>
	<text x="29" y="214" class="sub">C700 仍在设计验证</text>

	<!-- ROCm column -->
	<rect x="247" y="66" width="206" height="74" class="card" fill="var(--rocm-fill)" stroke="var(--rocm-stroke)" opacity="0.55"/>
	<text x="261" y="90" class="name">海光 DCU</text>
	<text x="261" y="110" class="sub">GPGPU · 自有 DTK/DAS/DAP</text>
	<text x="261" y="128" class="sub">HIP 迁移需核对算子支持</text>

	<!-- own-stack column -->
	<rect x="467" y="66" width="218" height="74" class="card" fill="var(--own-fill)" stroke="var(--own-stroke)" opacity="0.55"/>
	<text x="481" y="90" class="name">昇腾（华为）</text>
	<text x="481" y="110" class="sub">CANN + MindSpore 全栈闭环</text>
	<text x="481" y="128" class="sub">950PR 少量上市 · 950DT 测试</text>

	<rect x="467" y="152" width="218" height="74" class="card" fill="var(--own-fill)" stroke="var(--own-stroke)" opacity="0.55"/>
	<text x="481" y="176" class="name">寒武纪</text>
	<text x="481" y="196" class="sub">Neuware 栈 · ASIC 路线</text>
	<text x="481" y="214" class="sub">云端产品 2026 上半年放量</text>

	<rect x="467" y="238" width="218" height="66" class="card" fill="var(--own-fill)" stroke="var(--own-stroke)" opacity="0.55"/>
	<text x="481" y="260" class="name">壁仞 · 燧原 · 天数智芯</text>
	<text x="481" y="280" class="sub">R100 / TopsRider / 天垓</text>
	<text x="481" y="296" class="sub">各自推进中</text>

	<!-- footnote -->
	<text x="350" y="336" class="sub" text-anchor="middle">迁移工作：模型、精度、算子、通信库与软件版本</text>
</svg>
