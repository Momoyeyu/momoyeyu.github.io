<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="截至2026年10月的昇腾进度：910C已商用，950PR少量上市，950DT测试中；960DT和960PR分别规划2027年一季度与三季度，970和980仍是路线图">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--done-fill: #dce9f7;
			--done-stroke: #7b9cc4;
			--plan-fill: #eef1f4;
			--plan-stroke: #9aa5b1;
			--hl-fill: #f2dcdc;
			--hl-stroke: #b06a6a;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--done-fill: #26364d;
				--done-stroke: #6c8ebf;
				--plan-fill: #2a2f36;
				--plan-stroke: #6b7684;
				--hl-fill: #472c2c;
				--hl-stroke: #c07f7f;
			}
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
		.sub { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; opacity: 0.75; }
		.date { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; opacity: 0.85; }
		.grp { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; font-style: italic; opacity: 0.7; }
		.spine { stroke: var(--line); stroke-width: 1.8; fill: none; marker-end: url(#ah); }
		.box { stroke-width: 1.5; rx: 8; }
		.plan { stroke-dasharray: 5 3; }
	</style>
	<defs>
		<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--line)"/></marker>
	</defs>

	<!-- spine -->
	<path d="M30,105 L672,105" class="spine"/>

	<!-- shipped: solid -->
	<rect x="14" y="72" width="84" height="66" class="box" fill="var(--done-fill)" stroke="var(--done-stroke)"/>
	<text x="56" y="95" class="lbl" text-anchor="middle">910C</text>
	<text x="56" y="114" class="sub" text-anchor="middle">A3 已商用</text>
	<text x="56" y="128" class="sub" text-anchor="middle">128G HBM</text>
	<text x="56" y="160" class="date" text-anchor="middle">2025</text>

	<rect x="112" y="72" width="84" height="66" class="box" fill="var(--done-fill)" stroke="var(--done-stroke)"/>
	<text x="154" y="95" class="lbl" text-anchor="middle">950PR</text>
	<text x="154" y="114" class="sub" text-anchor="middle">少量上市</text>
	<text x="154" y="128" class="sub" text-anchor="middle">推理 / 推荐</text>
	<text x="154" y="160" class="date" text-anchor="middle">2026 Q1</text>

	<rect x="210" y="72" width="84" height="66" class="box plan" fill="var(--plan-fill)" stroke="var(--plan-stroke)"/>
	<text x="252" y="95" class="lbl" text-anchor="middle">950DT</text>
	<text x="252" y="114" class="sub" text-anchor="middle">训练测试中</text>
	<text x="252" y="128" class="sub" text-anchor="middle">待规模供货</text>
	<text x="252" y="160" class="date" text-anchor="middle">2026 末起</text>

	<!-- roadmap: dashed -->
	<rect x="308" y="72" width="84" height="66" class="box plan" fill="var(--plan-fill)" stroke="var(--plan-stroke)"/>
	<text x="350" y="95" class="lbl" text-anchor="middle">960DT</text>
	<text x="350" y="114" class="sub" text-anchor="middle">规划提前</text>
	<text x="350" y="128" class="sub" text-anchor="middle">训练方向</text>
	<text x="350" y="160" class="date" text-anchor="middle">2027 Q1</text>

	<rect x="406" y="72" width="84" height="66" class="box plan" fill="var(--plan-fill)" stroke="var(--plan-stroke)"/>
	<text x="448" y="95" class="lbl" text-anchor="middle">960PR</text>
	<text x="448" y="114" class="sub" text-anchor="middle">规划提前</text>
	<text x="448" y="128" class="sub" text-anchor="middle">推理方向</text>
	<text x="448" y="160" class="date" text-anchor="middle">2027 Q3</text>

	<rect x="504" y="72" width="84" height="66" class="box plan" fill="var(--plan-fill)" stroke="var(--plan-stroke)"/>
	<text x="546" y="95" class="lbl" text-anchor="middle">970</text>
	<text x="546" y="114" class="sub" text-anchor="middle">后续芯片</text>
	<text x="546" y="128" class="sub" text-anchor="middle">路线图</text>
	<text x="546" y="160" class="date" text-anchor="middle">2028</text>

	<rect x="602" y="72" width="84" height="66" class="box plan" fill="var(--plan-fill)" stroke="var(--plan-stroke)"/>
	<text x="644" y="95" class="lbl" text-anchor="middle">980</text>
	<text x="644" y="114" class="sub" text-anchor="middle">后续芯片</text>
	<text x="644" y="128" class="sub" text-anchor="middle">路线图</text>
	<text x="644" y="160" class="date" text-anchor="middle">2029</text>

	<!-- group labels -->
	<text x="105" y="200" class="grp" text-anchor="middle">已商用 / 少量上市</text>
	<text x="252" y="200" class="grp" text-anchor="middle">测试中</text>
	<text x="497" y="200" class="grp" text-anchor="middle">规划中（2026.9 更新）</text>

	<!-- pace note -->
	<text x="350" y="240" class="sub" text-anchor="middle">按已上市、测试和规划进度排列</text>
</svg>
