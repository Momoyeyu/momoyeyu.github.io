<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CloudMatrix 384 与 GB200 NVL72 的六项指标对照：算力、显存、互联占优，功耗与价格更高">
	<style>
		:root {
			--fg: #2b2b2b;
			--line: #3d3d3d;
			--cm: #b06a6a;
			--nv: #4e9a51;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #d8d8d8;
				--line: #b8b8b8;
				--cm: #cf8f8f;
				--nv: #7fc47f;
			}
		}
		text { fill: var(--fg); }
		.lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; }
		.val { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; opacity: 0.85; }
		.grp { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; }
		.leg { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; }
		.cm { fill: var(--cm); }
		.nv { fill: var(--nv); }
	</style>

	<!-- legend -->
	<rect x="205" y="16" width="14" height="14" rx="3" class="cm"/><text x="224" y="28" class="leg">CloudMatrix 384</text>
	<rect x="350" y="16" width="14" height="14" rx="3" class="nv"/><text x="369" y="28" class="leg">GB200 NVL72</text>

	<!-- group 1 -->
	<text x="60" y="60" class="grp">能力指标（越高越好）</text>

	<!-- row: 芯片数 -->
	<text x="60" y="82" class="lbl">芯片数（颗）</text>
	<rect x="200" y="88" width="370" height="14" class="cm"/><text x="576" y="100" class="val">384</text>
	<rect x="200" y="106" width="69" height="14" class="nv"/><text x="275" y="118" class="val">72</text>

	<!-- row: 算力 -->
	<text x="60" y="134" class="lbl">BF16 算力</text>
	<rect x="200" y="140" width="370" height="14" class="cm"/><text x="576" y="152" class="val">~300 PFLOPS</text>
	<rect x="200" y="158" width="222" height="14" class="nv"/><text x="428" y="170" class="val">~180 PFLOPS</text>

	<!-- row: HBM -->
	<text x="60" y="186" class="lbl">HBM 总量</text>
	<rect x="200" y="192" width="370" height="14" class="cm"/><text x="576" y="204" class="val">~48 TB</text>
	<rect x="200" y="210" width="104" height="14" class="nv"/><text x="310" y="222" class="val">~13.5 TB</text>

	<!-- row: ScaleUp -->
	<text x="60" y="238" class="lbl">ScaleUp 带宽</text>
	<rect x="200" y="244" width="370" height="14" class="cm"/><text x="576" y="256" class="val">~269 TB/s</text>
	<rect x="200" y="262" width="178" height="14" class="nv"/><text x="384" y="274" class="val">~130 TB/s</text>

	<!-- group 2 -->
	<text x="60" y="306" class="grp">代价指标（越低越好）</text>

	<!-- row: 功耗 -->
	<text x="60" y="328" class="lbl">系统功耗</text>
	<rect x="200" y="334" width="370" height="14" class="cm"/><text x="576" y="346" class="val">~560 kW</text>
	<rect x="200" y="352" width="96" height="14" class="nv"/><text x="302" y="364" class="val">~145 kW</text>

	<!-- row: 价格 -->
	<text x="60" y="380" class="lbl">整机价格</text>
	<rect x="200" y="386" width="370" height="14" class="cm"/><text x="576" y="398" class="val">~800 万美元</text>
	<rect x="200" y="404" width="141" height="14" class="nv"/><text x="347" y="416" class="val">~300 万美元</text>
</svg>
