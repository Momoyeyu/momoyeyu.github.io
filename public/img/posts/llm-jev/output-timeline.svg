<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">省掉串行文本输出的路径</title><desc id="desc">两种调用均存在服务开销和输入处理。自回归 LLM 顺序生成输出 token，Jev 并行评价独立问题并返回类型化结果。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="510" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">省掉串行文本输出的路径</text><text x="217" y="106" class="small" text-anchor="middle">服务开销</text><text x="354" y="106" class="small" text-anchor="middle">输入处理</text><text x="649" y="106" class="small" text-anchor="middle">输出阶段</text><text x="35" y="168" class="head" text-anchor="start">LLM</text><rect x="164" y="133" width="108" height="54" rx="9" class="box c"/><text x="218" y="168" class="small" text-anchor="middle">网络等</text><path d="M272 160 H294" class="arrow"/><rect x="294" y="133" width="120" height="54" rx="9" class="box b"/><text x="354" y="168" class="small" text-anchor="middle">prefill</text><path d="M414 160 H447" class="arrow"/><rect x="447" y="133" width="64" height="54" rx="9" class="box a"/><text x="479" y="168" class="math" text-anchor="middle">t₁</text><path d="M511 160 H529" class="arrow"/><rect x="529" y="133" width="64" height="54" rx="9" class="box a"/><text x="561" y="168" class="math" text-anchor="middle">t₂</text><path d="M593 160 H611" class="arrow"/><rect x="611" y="133" width="64" height="54" rx="9" class="box a"/><text x="643" y="168" class="math" text-anchor="middle">t₃</text><path d="M675 160 H693" class="arrow"/><rect x="693" y="133" width="64" height="54" rx="9" class="box a"/><text x="725" y="168" class="math" text-anchor="middle">…</text><path d="M757 160 H775" class="arrow"/><rect x="775" y="133" width="64" height="54" rx="9" class="box a"/><text x="807" y="168" class="math" text-anchor="middle">tL</text><text x="650" y="222" class="small" text-anchor="middle">字段、概率、标点依次生成</text><text x="35" y="334" class="head" text-anchor="start">Jev</text><rect x="164" y="299" width="108" height="54" rx="9" class="box c"/><text x="218" y="334" class="small" text-anchor="middle">网络等</text><path d="M272 326 H294" class="arrow"/><rect x="294" y="299" width="120" height="54" rx="9" class="box b"/><text x="354" y="334" class="small" text-anchor="middle">共享输入</text><path d="M414 326 H441 V280 H466" class="arrow"/><path d="M441 326 H466" class="arrow"/><path d="M441 326 V372 H466" class="arrow"/><rect x="466" y="258" width="190" height="40" rx="9" class="box a"/><text x="561" y="286" class="small" text-anchor="middle">独立判断</text><path d="M656 278 H716" class="arrow"/><text x="749" y="287" class="math" text-anchor="middle">p₁</text><rect x="466" y="304" width="190" height="40" rx="9" class="box a"/><text x="561" y="332" class="small" text-anchor="middle">独立判断</text><path d="M656 324 H716" class="arrow"/><text x="749" y="333" class="math" text-anchor="middle">p₂</text><rect x="466" y="350" width="190" height="40" rx="9" class="box a"/><text x="561" y="378" class="small" text-anchor="middle">独立判断</text><path d="M656 370 H716" class="arrow"/><text x="749" y="379" class="math" text-anchor="middle">p₃</text><text x="649" y="432" class="small" text-anchor="middle">不逐 token 写出整段概率 JSON</text><text x="450" y="481" class="tiny" text-anchor="middle">只表示计算依赖；长度不代表实测耗时，也不指定 forward 次数</text></svg>
