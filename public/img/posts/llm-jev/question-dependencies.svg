<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">能并行的前提，是问题已经独立</title><desc id="desc">左侧三个问题可基于同一工单独立回答。右侧后续查询依赖第一轮选出的订单，必须经过代码再发起第二轮。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="540" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">能并行的前提，是问题已经独立</text><rect x="25" y="96" width="410" height="380" rx="9" class="panel"/><rect x="465" y="96" width="410" height="380" rx="9" class="panel"/><text x="230" y="135" class="head" text-anchor="middle">独立问题 · 一批回答</text><text x="670" y="135" class="head" text-anchor="middle">依赖结果 · 分轮调用</text><rect x="126" y="168" width="208" height="52" rx="9" class="box c"/><text x="230" y="202" class="" text-anchor="middle">工单 state</text><path d="M230 220 V247 H95 V272" class="arrow"/><path d="M230 247 V272" class="arrow"/><path d="M230 247 H365 V272" class="arrow"/><rect x="42" y="272" width="106" height="88" rx="9" class="box b"/><text x="95" y="309" class="" text-anchor="middle">退款</text><text x="95" y="338" class="" text-anchor="middle">意图</text><path d="M95 360 V397" class="arrow"/><rect x="177" y="272" width="106" height="88" rx="9" class="box b"/><text x="230" y="309" class="" text-anchor="middle">重复</text><text x="230" y="338" class="" text-anchor="middle">扣款</text><path d="M230 360 V397" class="arrow"/><rect x="312" y="272" width="106" height="88" rx="9" class="box b"/><text x="365" y="309" class="" text-anchor="middle">紧急</text><text x="365" y="338" class="" text-anchor="middle">程度</text><path d="M365 360 V397" class="arrow"/><rect x="62" y="397" width="336" height="47" rx="9" class="box a"/><text x="230" y="428" class="small" text-anchor="middle">共享状态，答案互不依赖</text><rect x="500" y="173" width="340" height="57" rx="9" class="box b"/><text x="670" y="210" class="" text-anchor="middle">第一轮 · 选出目标订单</text><path d="M670 230 V265" class="arrow"/><rect x="536" y="265" width="268" height="57" rx="9" class="box c"/><text x="670" y="302" class="small" text-anchor="middle">代码查询该订单的账务</text><path d="M670 322 V357" class="arrow"/><rect x="500" y="357" width="340" height="57" rx="9" class="box b"/><text x="670" y="394" class="" text-anchor="middle">第二轮 · 判断如何处理</text><text x="670" y="448" class="small" text-anchor="middle">后一步的输入尚未准备好</text><text x="450" y="514" class="tiny" text-anchor="middle">并行性由数据依赖决定；这不是底层 attention mask</text></svg>
