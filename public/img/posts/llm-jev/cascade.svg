<text x="434" y="384" class="chip" text-anchor="middle">✓</text>
<rect x="472" y="360" width="36" height="36" rx="5" class="bx f-green"/>
<text x="490" y="384" class="chip" text-anchor="middle">✓</text>
<rect x="80" y="412" width="36" height="36" rx="5" class="bx f-green"/>
<text x="98" y="436" class="chip" text-anchor="middle">✓</text>
<rect x="136" y="412" width="36" height="36" rx="5" class="bx f-green"/>
<text x="154" y="436" class="chip" text-anchor="middle">✓</text>
<rect x="192" y="412" width="36" height="36" rx="5" class="bx f-orange"/>
<text x="210" y="436" class="chip" text-anchor="middle">×</text>
<rect x="248" y="412" width="36" height="36" rx="5" class="bx f-orange"/>
<text x="266" y="436" class="chip" text-anchor="middle">×</text>
<rect x="304" y="412" width="36" height="36" rx="5" class="bx f-orange"/>
<text x="322" y="436" class="chip" text-anchor="middle">×</text>
<rect x="360" y="412" width="36" height="36" rx="5" class="bx f-orange"/>
<text x="378" y="436" class="chip" text-anchor="middle">×</text>
<rect x="416" y="412" width="36" height="36" rx="5" class="bx f-green"/>
<text x="434" y="436" class="chip" text-anchor="middle">✓</text>
<rect x="472" y="412" width="36" height="36" rx="5" class="bx f-green"/>
<text x="490" y="436" class="chip" text-anchor="middle">✓</text>
<text x="66" y="384" class="chip" text-anchor="end">Jev</text>
<text x="66" y="436" class="chip" text-anchor="end">后备</text>
<text x="520" y="384" class="ts" text-anchor="start">重叠错误：换一个模型，还是同样的答案</text>
<text x="520" y="424" class="ts" text-anchor="start">最自信却答错的子集上，</text>
<text x="520" y="448" class="ts" text-anchor="start">96% 判定重复同一错误</text>
</svg>
