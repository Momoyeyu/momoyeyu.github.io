<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">校准误差：准确率之外的第二把尺</title>
<desc id="desc">可靠性图与两组预测的对照：准确率同为 50%，0.9 组的 Brier 与 ECE 明显更差。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--muted:#667386;--accent:#508369;--error:#aa5653;--blue:#d7e4f2;--purple:#e3ddf0;--teal:#d5e8e6;--orange:#f3e2cd;--yellow:#f0e6c8;--green:#dcead9;--pink:#f2dbe4;--gray:#e8eaee}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--muted:#b2bdcb;--accent:#86b49b;--error:#d99087;--blue:#26374c;--purple:#352f47;--teal:#27403d;--orange:#453723;--yellow:#453e24;--green:#2c3d2f;--pink:#432c39;--gray:#33383f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}
.title{font-size:25px;font-weight:600}.lead{font-size:15px;fill:var(--muted)}.cl{font-size:15px;font-weight:600;fill:var(--muted)}.tt{font-size:16px;font-weight:600}.ts{font-size:14px;fill:var(--muted)}.chip{font-size:13px}.math{font-family:Times,'Times New Roman',serif;font-style:italic;font-size:22px}
.bx{stroke:var(--line);stroke-width:1.4}.ct{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.55}
.f-blue{fill:var(--blue)}.f-purple{fill:var(--purple)}.f-teal{fill:var(--teal)}.f-orange{fill:var(--orange)}.f-yellow{fill:var(--yellow)}.f-green{fill:var(--green)}.f-pink{fill:var(--pink)}.f-gray{fill:var(--gray)}
.ar{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#ah)}.al{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round}.ard{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;marker-end:url(#ah)}
.err{fill:var(--error)}.ok{fill:var(--accent)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<rect width="900" height="520" rx="14" fill="var(--bg)"/>
<text x="450" y="42" class="title" text-anchor="middle">校准误差：准确率之外的第二把尺</text>
<text x="450" y="72" class="lead" text-anchor="middle">准确率相同的两组预测，校准可以完全不同</text>
<path d="M100 460 H456" class="al"/>
<path d="M100 460 V140" class="al"/>
<path d="M100 460 V454" class="al"/>
<text x="100" y="484" class="chip" text-anchor="middle">0</text>
<path d="M94 460 H100" class="al"/>
<text x="86" y="464" class="chip" text-anchor="end">0</text>
<path d="M270.0 460 V454" class="al"/>
<text x="270" y="484" class="chip" text-anchor="middle">0.5</text>
<path d="M94 300.0 H100" class="al"/>
<text x="86" y="304" class="chip" text-anchor="end">0.5</text>
<path d="M440.0 460 V454" class="al"/>
<text x="440" y="484" class="chip" text-anchor="middle">1</text>
<path d="M94 140.0 H100" class="al"/>
<text x="86" y="144" class="chip" text-anchor="end">1</text>
<path d="M100 460 L440 140" class="ard"/>
<text x="270" y="516" class="ts" text-anchor="middle">预测概率</text>
<text x="40" y="300" class="ts" text-anchor="middle" transform="rotate(-90 40 300.0)">实际频率</text>
<circle cx="406.0" cy="300.0" r="8" fill="var(--error)"/>
<text x="400" y="282" class="ts" text-anchor="end">0.9 组</text>
<circle cx="304.0" cy="300.0" r="8" fill="var(--accent)"/>
<text x="296" y="330" class="ts" text-anchor="end">0.6 组</text>
<text x="270" y="130" class="cl" text-anchor="middle">可靠性图：点越贴近对角线越好</text>
<rect x="500" y="120" width="360" height="300" rx="12" class="ct"/>
<text x="520" y="150" class="cl" text-anchor="start">同一组标签 [1, 1, 0, 0]</text>
<text x="540" y="196" class="tt" text-anchor="start">指标</text>
<text x="700" y="196" class="tt" text-anchor="middle">0.9 组</text>
<text x="810" y="196" class="tt" text-anchor="middle">0.6 组</text>
<text x="540" y="250" class="ts" text-anchor="start">准确率</text>
<text x="700" y="250" class="ts" text-anchor="middle">50%</text>
<text x="810" y="250" class="ts" text-anchor="middle">50%</text>
<text x="540" y="304" class="ts" text-anchor="start">Brier score</text>
<text x="700" y="304" class="ts" text-anchor="middle">0.41</text>
<text x="810" y="304" class="ts" text-anchor="middle">0.26</text>
<text x="540" y="358" class="ts" text-anchor="start">ECE</text>
<text x="700" y="358" class="ts" text-anchor="middle">0.40</text>
<text x="810" y="358" class="ts" text-anchor="middle">0.10</text>
<text x="650" y="466" class="ts" text-anchor="middle">0.9 组置信高，Brier 与 ECE 反而更差</text>
<text x="650" y="492" class="tt" text-anchor="middle">confidence 高 ≠ 校准好</text>
</svg>
