<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="title desc"><title id="title">从一张工单到几项判断</title><desc id="desc">共享工单供三个独立问题使用。模型返回类型化结果，应用代码结合数据库与规则决定动作。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="665" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">从一张工单到几项判断</text><rect x="28" y="178" width="190" height="198" rx="9" class="box c"/><text x="123" y="218" class="head" text-anchor="middle">共享 state</text><text x="123" y="260" class="" text-anchor="middle">同一订单</text><text x="123" y="292" class="" text-anchor="middle">被扣款两次</text><text x="123" y="324" class="" text-anchor="middle">请退回多扣的钱</text><rect x="270" y="100" width="310" height="365" rx="9" class="panel"/><text x="425" y="139" class="head" text-anchor="middle">Jev</text><text x="425" y="172" class="small" text-anchor="middle">共享输入 · 独立评价</text><rect x="295" y="198" width="260" height="60" rx="9" class="box b"/><text x="425" y="236" class="" text-anchor="middle">Choice · 退款意图</text><path d="M555 228 H635" class="arrow"/><rect x="635" y="198" width="235" height="60" rx="9" class="box a"/><text x="752.5" y="236" class="" text-anchor="middle">退款 0.80</text><rect x="295" y="283" width="260" height="60" rx="9" class="box b"/><text x="425" y="321" class="" text-anchor="middle">Noul · 重复扣款</text><path d="M555 313 H635" class="arrow"/><rect x="635" y="283" width="235" height="60" rx="9" class="box a"/><text x="752.5" y="321" class="" text-anchor="middle">yes 0.90</text><rect x="295" y="368" width="260" height="60" rx="9" class="box b"/><text x="425" y="406" class="" text-anchor="middle">Score · 紧急程度</text><path d="M555 398 H635" class="arrow"/><rect x="635" y="368" width="235" height="60" rx="9" class="box a"/><text x="752.5" y="406" class="" text-anchor="middle">评分 1.50</text><path d="M218 277 H270" class="arrow"/><text x="752" y="151" class="head" text-anchor="middle">类型化结果</text><path d="M870 228 H887 V493 H625 V520" class="arrow"/><path d="M870 313 H887" class="line"/><path d="M870 398 H887" class="line"/><rect x="28" y="520" width="220" height="80" rx="9" class="box c"/><text x="138" y="551" class="small" text-anchor="middle">数据库与规则</text><text x="138" y="580" class="small" text-anchor="middle">账务 · 限额 · 退款记录</text><path d="M248 560 H315" class="arrow"/><rect x="315" y="520" width="555" height="80" rx="9" class="box a"/><text x="592" y="552" class="head" text-anchor="middle">应用代码</text><text x="592" y="582" class="small" text-anchor="middle">组合判断与确定事实 → 决定业务动作</text><text x="450" y="640" class="tiny" text-anchor="middle">公开接口示意；模型内部网络未披露，概率为教学样例</text></svg>
