<svg xmlns="http://www.w3.org/2000/svg" width="900" height="508" viewBox="0 0 900 508" role="img" aria-labelledby="title desc">
<title id="title">输出开销：串行解码与一次分布</title>
<desc id="desc">生成 JSON 需要逐 token 解码，判断模型一次前向返回整份分布，没有求和项。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--muted:#667386;--accent:#508369;--error:#aa5653;--blue:#d7e4f2;--purple:#e3ddf0;--teal:#d5e8e6;--orange:#f3e2cd;--yellow:#f0e6c8;--green:#dcead9;--pink:#f2dbe4;--gray:#e8eaee}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--muted:#b2bdcb;--accent:#86b49b;--error:#d99087;--blue:#26374c;--purple:#352f47;--teal:#27403d;--orange:#453723;--yellow:#453e24;--green:#2c3d2f;--pink:#432c39;--gray:#33383f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}
.title{font-size:25px;font-weight:600}.lead{font-size:15px;fill:var(--muted)}.cl{font-size:15px;font-weight:600;fill:var(--muted)}.tt{font-size:16px;font-weight:600}.ts{font-size:14px;fill:var(--muted)}.chip{font-size:13px}.math{font-family:Times,'Times New Roman',serif;font-style:italic;font-size:22px}
.bx{stroke:var(--line);stroke-width:1.4}.ct{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.55}
.f-blue{fill:var(--blue)}.f-purple{fill:var(--purple)}.f-teal{fill:var(--teal)}.f-orange{fill:var(--orange)}.f-yellow{fill:var(--yellow)}.f-green{fill:var(--green)}.f-pink{fill:var(--pink)}.f-gray{fill:var(--gray)}
.ar{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#ah)}.al{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round}.ard{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;marker-end:url(#ah)}
.err{fill:var(--error)}.ok{fill:var(--accent)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<rect width="900" height="508" rx="14" fill="var(--bg)"/>
<text x="450" y="42" class="title" text-anchor="middle">输出开销：串行解码与一次分布</text>
<text x="450" y="72" class="math" text-anchor="middle">T_LLM ≈ T_io + T_in + Σ T_dec,t，判断路线没有求和项</text>
<rect x="30" y="110" width="500" height="320" rx="12" class="ct"/>
<text x="50" y="136" class="cl" text-anchor="start">生成 JSON：每个字段都要串行解码</text>
<rect x="50" y="168" width="34" height="32" rx="5" class="bx f-gray"/>
<text x="67" y="189" class="chip" text-anchor="middle">{</text>
<rect x="92" y="168" width="88" height="32" rx="5" class="bx f-gray"/>
<text x="136" y="189" class="chip" text-anchor="middle">&quot;choice&quot;</text>
<rect x="188" y="168" width="34" height="32" rx="5" class="bx f-gray"/>
<text x="205" y="189" class="chip" text-anchor="middle">:</text>
<rect x="230" y="168" width="88" height="32" rx="5" class="bx f-gray"/>
<text x="274" y="189" class="chip" text-anchor="middle">&quot;refund&quot;</text>
<rect x="326" y="168" width="34" height="32" rx="5" class="bx f-gray"/>
<text x="343" y="189" class="chip" text-anchor="middle">,</text>
<rect x="368" y="168" width="43" height="32" rx="5" class="bx f-gray"/>
<text x="389.5" y="189" class="chip" text-anchor="middle">&quot;p&quot;</text>
<rect x="419" y="168" width="34" height="32" rx="5" class="bx f-gray"/>
<text x="436" y="189" class="chip" text-anchor="middle">:</text>
<rect x="50" y="214" width="43" height="32" rx="5" class="bx f-gray"/>
<text x="71.5" y="235" class="chip" text-anchor="middle">0.8</text>
<rect x="101" y="214" width="34" height="32" rx="5" class="bx f-gray"/>
<text x="118" y="235" class="chip" text-anchor="middle">,</text>
<rect x="143" y="214" width="34" height="32" rx="5" class="bx f-gray"/>
<text x="160" y="235" class="chip" text-anchor="middle">…</text>
<rect x="185" y="214" width="34" height="32" rx="5" class="bx f-gray"/>
<text x="202" y="235" class="chip" text-anchor="middle">}</text>
<text x="280" y="330" class="ts" text-anchor="middle">字段名、标签、概率、标点</text>
<text x="280" y="354" class="ts" text-anchor="middle">题目越多，L_out 越长</text>
<rect x="570" y="110" width="300" height="320" rx="12" class="ct"/>
<text x="590" y="136" class="cl" text-anchor="start">判断模型</text>
<rect x="600" y="168" width="240" height="64" rx="8" class="bx f-green"/><text x="720" y="191" class="tt" text-anchor="middle">一次前向</text><text x="720" y="211" class="ts" text-anchor="middle">整份概率分布</text>
<text x="720" y="300" class="ts" text-anchor="middle">没有逐 token 解码段</text>
<text x="450" y="478" class="lead" text-anchor="middle">只返回一个标签时，两侧的差距会缩小；倍数必须绑定输出形态</text>
</svg>
