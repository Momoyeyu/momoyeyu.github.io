<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">置信度：分布集中程度的重标定</title>
<desc id="desc">confidence 是 p_max 的线性重标定：均匀分布为 0，one-hot 为 1，三选项最高 0.8 对应 0.70。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--muted:#667386;--accent:#508369;--error:#aa5653;--blue:#d7e4f2;--purple:#e3ddf0;--teal:#d5e8e6;--orange:#f3e2cd;--yellow:#f0e6c8;--green:#dcead9;--pink:#f2dbe4;--gray:#e8eaee}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--muted:#b2bdcb;--accent:#86b49b;--error:#d99087;--blue:#26374c;--purple:#352f47;--teal:#27403d;--orange:#453723;--yellow:#453e24;--green:#2c3d2f;--pink:#432c39;--gray:#33383f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}
.title{font-size:25px;font-weight:600}.lead{font-size:15px;fill:var(--muted)}.cl{font-size:15px;font-weight:600;fill:var(--muted)}.tt{font-size:16px;font-weight:600}.ts{font-size:14px;fill:var(--muted)}.chip{font-size:13px}.math{font-family:Times,'Times New Roman',serif;font-style:italic;font-size:22px}
.bx{stroke:var(--line);stroke-width:1.4}.ct{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.55}
.f-blue{fill:var(--blue)}.f-purple{fill:var(--purple)}.f-teal{fill:var(--teal)}.f-orange{fill:var(--orange)}.f-yellow{fill:var(--yellow)}.f-green{fill:var(--green)}.f-pink{fill:var(--pink)}.f-gray{fill:var(--gray)}
.ar{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#ah)}.al{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round}.ard{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;marker-end:url(#ah)}
.err{fill:var(--error)}.ok{fill:var(--accent)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<rect width="900" height="460" rx="14" fill="var(--bg)"/>
<text x="450" y="42" class="title" text-anchor="middle">置信度：分布集中程度的重标定</text>
<text x="450" y="88" class="math" text-anchor="middle">c = (p_max − 1/n) / (1 − 1/n)，n = 3</text>
<text x="450" y="126" class="lead" text-anchor="middle">只是把最大概率线性重标定到 [0, 1]</text>
<text x="120" y="190" class="tt" text-anchor="start">p_max</text>
<path d="M120,230 H800" class="al"/>
<path d="M120,224 V236" class="al"/>
<text x="120" y="258" class="chip" text-anchor="middle">1/3</text>
<path d="M340,224 V236" class="al"/>
<text x="340" y="258" class="chip" text-anchor="middle">0.5</text>
<path d="M560,224 V236" class="al"/>
<text x="560" y="258" class="chip" text-anchor="middle">0.7</text>
<path d="M670,224 V236" class="al"/>
<text x="670" y="258" class="chip" text-anchor="middle">0.8</text>
<path d="M800,224 V236" class="al"/>
<text x="800" y="258" class="chip" text-anchor="middle">1.0</text>
<text x="120" y="360" class="tt" text-anchor="start">c</text>
<path d="M120,400 H800" class="al"/>
<path d="M120,394 V406" class="al"/>
<text x="120" y="428" class="chip" text-anchor="middle">0</text>
<path d="M340,394 V406" class="al"/>
<text x="340" y="428" class="chip" text-anchor="middle">0.25</text>
<path d="M560,394 V406" class="al"/>
<text x="560" y="428" class="chip" text-anchor="middle">0.55</text>
<path d="M670,394 V406" class="al"/>
<text x="670" y="428" class="chip" text-anchor="middle">0.70</text>
<path d="M800,394 V406" class="al"/>
<text x="800" y="428" class="chip" text-anchor="middle">1</text>
<path d="M120,270 V386" class="ard"/>
<path d="M670,270 V386" class="ard"/>
<path d="M800,270 V386" class="ard"/>
<text x="120" y="306" class="ts" text-anchor="middle">均匀分布</text>
<text x="670" y="306" class="ts" text-anchor="middle">三选项最高 0.8 → 0.70</text>
<text x="800" y="306" class="ts" text-anchor="middle">one-hot</text>
</svg>
