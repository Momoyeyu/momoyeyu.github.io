<svg xmlns="http://www.w3.org/2000/svg" width="900" height="515" viewBox="0 0 900 515" role="img" aria-labelledby="title desc"><title id="title">同一份输入，三种输出形状</title><desc id="desc">Choice 是候选分布，Score 是有序等级的概率期望，Noul 是 yes 的概率。图中概率仅用于教学。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="515" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">同一份输入，三种输出形状</text><rect x="25" y="94" width="264" height="355" rx="9" class="panel"/><text x="157" y="133" class="head" text-anchor="middle">Choice</text><text x="157" y="167" class="small" text-anchor="middle">主要意图</text><rect x="318" y="94" width="264" height="355" rx="9" class="panel"/><text x="450" y="133" class="head" text-anchor="middle">Score</text><text x="450" y="167" class="small" text-anchor="middle">紧急程度</text><rect x="611" y="94" width="264" height="355" rx="9" class="panel"/><text x="743" y="133" class="head" text-anchor="middle">Noul</text><text x="743" y="167" class="small" text-anchor="middle">是否重复扣款</text><text x="45" y="216" class="small" text-anchor="start">退款</text><rect x="102" y="193" width="150" height="25" rx="3" class="box"/><rect x="102" y="193" width="120.0" height="25" rx="3" fill="var(--accent)"/><text x="252" y="242" class="small" text-anchor="end">0.80</text><text x="45" y="281" class="small" text-anchor="start">咨询</text><rect x="102" y="258" width="150" height="25" rx="3" class="box"/><rect x="102" y="258" width="22.5" height="25" rx="3" fill="var(--accent)"/><text x="252" y="307" class="small" text-anchor="end">0.15</text><text x="45" y="346" class="small" text-anchor="start">投诉</text><rect x="102" y="323" width="150" height="25" rx="3" class="box"/><rect x="102" y="323" width="7.5" height="25" rx="3" fill="var(--accent)"/><text x="252" y="372" class="small" text-anchor="end">0.05</text><text x="157" y="423" class="small" text-anchor="middle">选择最高概率项</text><rect x="359" y="321.0" width="43" height="15.0" rx="3" class="box b"/><text x="380" y="310.0" class="small" text-anchor="middle">0.1</text><text x="380" y="364" class="small" text-anchor="middle">0</text><rect x="429" y="291.0" width="43" height="45.0" rx="3" class="box b"/><text x="450" y="280.0" class="small" text-anchor="middle">0.3</text><text x="450" y="364" class="small" text-anchor="middle">1</text><rect x="499" y="246.0" width="43" height="90.0" rx="3" class="box b"/><text x="520" y="235.0" class="small" text-anchor="middle">0.6</text><text x="520" y="364" class="small" text-anchor="middle">2</text><path d="M346 337 H565" class="line"/><text x="450" y="401" class="math" text-anchor="middle">v = 1.50</text><text x="450" y="428" class="tiny" text-anchor="middle">概率加权的等级位置</text><text x="743" y="242" class="math" text-anchor="middle">P(yes) = 0.90</text><rect x="637" y="281" width="212" height="32" rx="4" class="box"/><rect x="637" y="281" width="190.8" height="32" rx="4" fill="var(--accent)"/><text x="637" y="343" class="small" text-anchor="start">0</text><text x="849" y="343" class="small" text-anchor="end">1</text><text x="743" y="401" class="small" text-anchor="middle">一个二元事件的概率</text><text x="450" y="487" class="tiny" text-anchor="middle">教学概率；Score 等级从 0 编号，Noul 不另返回 confidence</text></svg>
