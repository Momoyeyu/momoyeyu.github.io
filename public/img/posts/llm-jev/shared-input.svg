<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">账单里重复了几份 state</title><desc id="desc">三次单题请求各自包含共享状态，合并请求只保留一份状态和三个问题。相同状态块在两种布局中保持同样宽度。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="560" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">账单里重复了几份 state</text><text x="55" y="112" class="head" text-anchor="start">拆成 N 次请求</text><rect x="90" y="138" width="440" height="42" rx="5" class="box b"/><text x="310" y="167" class="small" text-anchor="middle">共享状态 S</text><rect x="530" y="138" width="80" height="42" rx="5" class="box c"/><text x="570" y="167" class="math" text-anchor="middle">Q1</text><text x="652" y="167" class="math" text-anchor="start">S + Q1</text><rect x="90" y="204" width="440" height="42" rx="5" class="box b"/><text x="310" y="233" class="small" text-anchor="middle">共享状态 S</text><rect x="530" y="204" width="80" height="42" rx="5" class="box c"/><text x="570" y="233" class="math" text-anchor="middle">Q2</text><text x="652" y="233" class="math" text-anchor="start">S + Q2</text><rect x="90" y="270" width="440" height="42" rx="5" class="box b"/><text x="310" y="299" class="small" text-anchor="middle">共享状态 S</text><rect x="530" y="270" width="80" height="42" rx="5" class="box c"/><text x="570" y="299" class="math" text-anchor="middle">Q3</text><text x="652" y="299" class="math" text-anchor="start">S + Q3</text><text x="55" y="369" class="head" text-anchor="start">合并为一次请求</text><rect x="90" y="396" width="440" height="42" rx="5" class="box b"/><text x="310" y="425" class="small" text-anchor="middle">共享状态 S</text><rect x="530" y="396" width="80" height="42" rx="5" class="box c"/><text x="570" y="425" class="math" text-anchor="middle">Q1</text><rect x="610" y="396" width="80" height="42" rx="5" class="box c"/><text x="650" y="425" class="math" text-anchor="middle">Q2</text><rect x="690" y="396" width="80" height="42" rx="5" class="box c"/><text x="730" y="425" class="math" text-anchor="middle">Q3</text><text x="450" y="490" class="math" text-anchor="middle">N S + Σ Qᵢ   →   S + Σ Qᵢ</text><text x="450" y="532" class="tiny" text-anchor="middle">以 3 题示意；省掉重复的 state，每个问题的输入仍然计费</text></svg>
