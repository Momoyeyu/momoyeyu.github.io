<svg xmlns="http://www.w3.org/2000/svg" width="900" height="605" viewBox="0 0 900 605" role="img" aria-labelledby="title desc"><title id="title">路由能省调用，纠错还需要互补</title><desc id="desc">上方按置信度阈值分流，下方用两组假设样本显示互补错误与重叠错误。重复前级错误的后备模型无法提供同样的纠错收益。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="605" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">路由能省调用，纠错还需要互补</text><rect x="30" y="111" width="145" height="64" rx="9" class="box b"/><text x="102" y="151" class="" text-anchor="middle">Jev 判断</text><path d="M175 143 H230" class="arrow"/><rect x="230" y="111" width="198" height="64" rx="9" class="box c"/><text x="329" y="151" class="small" text-anchor="middle">confidence ≥ τ</text><path d="M428 143 H503 V116 H556" class="arrow"/><text x="469" y="109" class="small" text-anchor="start">是</text><rect x="556" y="89" width="306" height="54" rx="9" class="box a"/><text x="709" y="124" class="" text-anchor="middle">采用当前判断</text><path d="M428 143 H503 V208 H556" class="arrow"/><text x="469" y="212" class="small" text-anchor="start">否</text><rect x="556" y="181" width="306" height="54" rx="9" class="box b"/><text x="709" y="216" class="" text-anchor="middle">交给后备模型</text><text x="450" y="278" class="small" text-anchor="middle">再看两个模型分别错在哪些样本</text><rect x="25" y="304" width="410" height="233" rx="9" class="panel"/><text x="230" y="343" class="head" text-anchor="middle">互补错误</text><text x="45" y="407" class="small" text-anchor="start">Jev</text><rect x="119" y="383" width="24" height="31" rx="3" class="box bad"/><path d="M125 392 l12 13 m0 -13 l-12 13" class="line"/><rect x="148" y="383" width="24" height="31" rx="3" class="box bad"/><path d="M154 392 l12 13 m0 -13 l-12 13" class="line"/><rect x="177" y="383" width="24" height="31" rx="3" class="box bad"/><path d="M183 392 l12 13 m0 -13 l-12 13" class="line"/><rect x="206" y="383" width="24" height="31" rx="3" class="box a"/><rect x="235" y="383" width="24" height="31" rx="3" class="box a"/><rect x="264" y="383" width="24" height="31" rx="3" class="box a"/><rect x="293" y="383" width="24" height="31" rx="3" class="box a"/><rect x="322" y="383" width="24" height="31" rx="3" class="box a"/><rect x="351" y="383" width="24" height="31" rx="3" class="box a"/><rect x="380" y="383" width="24" height="31" rx="3" class="box a"/><text x="45" y="459" class="small" text-anchor="start">后备</text><rect x="119" y="435" width="24" height="31" rx="3" class="box a"/><rect x="148" y="435" width="24" height="31" rx="3" class="box a"/><rect x="177" y="435" width="24" height="31" rx="3" class="box a"/><rect x="206" y="435" width="24" height="31" rx="3" class="box bad"/><path d="M212 444 l12 13 m0 -13 l-12 13" class="line"/><rect x="235" y="435" width="24" height="31" rx="3" class="box bad"/><path d="M241 444 l12 13 m0 -13 l-12 13" class="line"/><rect x="264" y="435" width="24" height="31" rx="3" class="box bad"/><path d="M270 444 l12 13 m0 -13 l-12 13" class="line"/><rect x="293" y="435" width="24" height="31" rx="3" class="box a"/><rect x="322" y="435" width="24" height="31" rx="3" class="box a"/><rect x="351" y="435" width="24" height="31" rx="3" class="box a"/><rect x="380" y="435" width="24" height="31" rx="3" class="box a"/><text x="230" y="511" class="small" text-anchor="middle">换人可能纠正前级的错误</text><rect x="465" y="304" width="410" height="233" rx="9" class="panel"/><text x="670" y="343" class="head" text-anchor="middle">重叠错误</text><text x="485" y="407" class="small" text-anchor="start">Jev</text><rect x="559" y="383" width="24" height="31" rx="3" class="box bad"/><path d="M565 392 l12 13 m0 -13 l-12 13" class="line"/><rect x="588" y="383" width="24" height="31" rx="3" class="box bad"/><path d="M594 392 l12 13 m0 -13 l-12 13" class="line"/><rect x="617" y="383" width="24" height="31" rx="3" class="box bad"/><path d="M623 392 l12 13 m0 -13 l-12 13" class="line"/><rect x="646" y="383" width="24" height="31" rx="3" class="box a"/><rect x="675" y="383" width="24" height="31" rx="3" class="box a"/><rect x="704" y="383" width="24" height="31" rx="3" class="box a"/><rect x="733" y="383" width="24" height="31" rx="3" class="box a"/><rect x="762" y="383" width="24" height="31" rx="3" class="box a"/><rect x="791" y="383" width="24" height="31" rx="3" class="box a"/><rect x="820" y="383" width="24" height="31" rx="3" class="box a"/><text x="485" y="459" class="small" text-anchor="start">后备</text><rect x="559" y="435" width="24" height="31" rx="3" class="box bad"/><path d="M565 444 l12 13 m0 -13 l-12 13" class="line"/><rect x="588" y="435" width="24" height="31" rx="3" class="box bad"/><path d="M594 444 l12 13 m0 -13 l-12 13" class="line"/><rect x="617" y="435" width="24" height="31" rx="3" class="box bad"/><path d="M623 444 l12 13 m0 -13 l-12 13" class="line"/><rect x="646" y="435" width="24" height="31" rx="3" class="box a"/><rect x="675" y="435" width="24" height="31" rx="3" class="box a"/><rect x="704" y="435" width="24" height="31" rx="3" class="box a"/><rect x="733" y="435" width="24" height="31" rx="3" class="box a"/><rect x="762" y="435" width="24" height="31" rx="3" class="box a"/><rect x="791" y="435" width="24" height="31" rx="3" class="box a"/><rect x="820" y="435" width="24" height="31" rx="3" class="box a"/><text x="670" y="511" class="small" text-anchor="middle">换人仍可能得到相同错误</text><text x="450" y="578" class="tiny" text-anchor="middle">每列是同一假设样本；叉号表示错误。网格不代表论文实测比例</text></svg>
