<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" role="img" aria-labelledby="title desc"><title id="title">合法选项，也可能选错含义</title><desc id="desc">两列对照名称与定义的映射。在应当人工处理的假设案例中，交换后若仍返回 yes，它会指向不需人工，表现出类型合法但语义错误。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="545" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">合法选项，也可能选错含义</text><text x="450" y="99" class="small" text-anchor="middle">假设这张工单确实需要人工处理</text><rect x="25" y="130" width="410" height="340" rx="9" class="panel"/><rect x="465" y="130" width="410" height="340" rx="9" class="panel"/><text x="230" y="170" class="head" text-anchor="middle">名称与定义一致</text><text x="670" y="170" class="head" text-anchor="middle">交换名称与定义</text><rect x="50" y="210" width="94" height="54" rx="9" class="box a"/><text x="97" y="245" class="math" text-anchor="middle">yes</text><rect x="50" y="300" width="94" height="54" rx="9" class="box"/><text x="97" y="335" class="math" text-anchor="middle">no</text><rect x="245" y="210" width="164" height="54" rx="9" class="box c"/><text x="327" y="245" class="" text-anchor="middle">需要人工</text><rect x="245" y="300" width="164" height="54" rx="9" class="box c"/><text x="327" y="335" class="" text-anchor="middle">不需人工</text><rect x="490" y="210" width="94" height="54" rx="9" class="box a"/><text x="537" y="245" class="math" text-anchor="middle">yes</text><rect x="490" y="300" width="94" height="54" rx="9" class="box"/><text x="537" y="335" class="math" text-anchor="middle">no</text><rect x="685" y="210" width="164" height="54" rx="9" class="box c"/><text x="767" y="245" class="" text-anchor="middle">需要人工</text><rect x="685" y="300" width="164" height="54" rx="9" class="box c"/><text x="767" y="335" class="" text-anchor="middle">不需人工</text><path d="M144 237 H245" class="arrow good-arrow"/><path d="M144 327 H245" class="arrow"/><path d="M584 237 L685 327" class="arrow bad-arrow"/><path d="M584 327 L685 237" class="arrow"/><text x="230" y="406" class="small" text-anchor="middle">返回 yes → 需要人工</text><text x="230" y="440" class="small" text-anchor="middle">类型与语义都正确</text><text x="670" y="406" class="small red" text-anchor="middle">仍返回 yes → 不需人工</text><text x="670" y="440" class="small red" text-anchor="middle">类型合法，语义却错了</text><text x="450" y="515" class="tiny" text-anchor="middle">名称交换实验的机制示意；不是某次 Jev 请求的实测返回</text></svg>
