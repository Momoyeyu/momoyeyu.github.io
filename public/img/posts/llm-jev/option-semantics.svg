<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">类型与语义：合法不等于正确</title>
<desc id="desc">交换选项名称与定义后，返回的标签仍然合法，但业务含义可能相反。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--muted:#667386;--accent:#508369;--error:#aa5653;--blue:#d7e4f2;--purple:#e3ddf0;--teal:#d5e8e6;--orange:#f3e2cd;--yellow:#f0e6c8;--green:#dcead9;--pink:#f2dbe4;--gray:#e8eaee}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--muted:#b2bdcb;--accent:#86b49b;--error:#d99087;--blue:#26374c;--purple:#352f47;--teal:#27403d;--orange:#453723;--yellow:#453e24;--green:#2c3d2f;--pink:#432c39;--gray:#33383f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}
.title{font-size:25px;font-weight:600}.lead{font-size:15px;fill:var(--muted)}.cl{font-size:15px;font-weight:600;fill:var(--muted)}.tt{font-size:16px;font-weight:600}.ts{font-size:14px;fill:var(--muted)}.chip{font-size:13px}.math{font-family:Times,'Times New Roman',serif;font-style:italic;font-size:22px}
.bx{stroke:var(--line);stroke-width:1.4}.ct{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.55}
.f-blue{fill:var(--blue)}.f-purple{fill:var(--purple)}.f-teal{fill:var(--teal)}.f-orange{fill:var(--orange)}.f-yellow{fill:var(--yellow)}.f-green{fill:var(--green)}.f-pink{fill:var(--pink)}.f-gray{fill:var(--gray)}
.ar{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#ah)}.al{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round}.ard{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;marker-end:url(#ah)}
.err{fill:var(--error)}.ok{fill:var(--accent)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<rect width="900" height="440" rx="14" fill="var(--bg)"/>
<text x="450" y="42" class="title" text-anchor="middle">类型与语义：合法不等于正确</text>
<text x="450" y="72" class="lead" text-anchor="middle">标签始终合法，含义却可能整个反过来</text>
<rect x="30" y="110" width="400" height="170" rx="12" class="ct"/>
<text x="50" y="136" class="cl" text-anchor="start">原始定义</text>
<rect x="60" y="168" width="150" height="56" rx="8" class="bx f-green"/><text x="135" y="191" class="tt" text-anchor="middle">yes</text><text x="135" y="211" class="ts" text-anchor="middle">需要人工处理</text>
<rect x="240" y="168" width="150" height="56" rx="8" class="bx f-gray"/><text x="315" y="191" class="tt" text-anchor="middle">no</text><text x="315" y="211" class="ts" text-anchor="middle">不需要</text>
<rect x="470" y="110" width="400" height="170" rx="12" class="ct"/>
<text x="490" y="136" class="cl" text-anchor="start">名称与定义交换后</text>
<rect x="500" y="168" width="150" height="56" rx="8" class="bx f-orange"/><text x="575" y="191" class="tt" text-anchor="middle">yes</text><text x="575" y="211" class="ts" text-anchor="middle">不需要人工处理</text>
<rect x="680" y="168" width="150" height="56" rx="8" class="bx f-gray"/><text x="755" y="191" class="tt" text-anchor="middle">no</text><text x="755" y="211" class="ts" text-anchor="middle">需要人工处理</text>
<rect x="330" y="300" width="240" height="60" rx="8" class="bx f-blue"/><text x="450" y="323" class="tt" text-anchor="middle">模型仍返回 yes</text><text x="450" y="343" class="ts" text-anchor="middle">schema 校验通过</text>
<text x="450" y="408" class="lead" text-anchor="middle">名称与定义必须一致；类型约束不负责消歧</text>
</svg>
