<svg xmlns="http://www.w3.org/2000/svg" width="900" height="576" viewBox="0 0 900 576" role="img" aria-labelledby="title desc">
<title id="title">共享状态与问题隔离</title>
<desc id="desc">共享状态只编码一次，三个问题并行得到分布；有依赖的问题需要分轮。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--muted:#667386;--accent:#508369;--error:#aa5653;--blue:#d7e4f2;--purple:#e3ddf0;--teal:#d5e8e6;--orange:#f3e2cd;--yellow:#f0e6c8;--green:#dcead9;--pink:#f2dbe4;--gray:#e8eaee}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--muted:#b2bdcb;--accent:#86b49b;--error:#d99087;--blue:#26374c;--purple:#352f47;--teal:#27403d;--orange:#453723;--yellow:#453e24;--green:#2c3d2f;--pink:#432c39;--gray:#33383f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:16px}
.title{font-size:25px;font-weight:600}.lead{font-size:15px;fill:var(--muted)}.cl{font-size:15px;font-weight:600;fill:var(--muted)}.tt{font-size:16px;font-weight:600}.ts{font-size:14px;fill:var(--muted)}.chip{font-size:13px}.math{font-family:Times,'Times New Roman',serif;font-style:italic;font-size:22px}
.bx{stroke:var(--line);stroke-width:1.4}.ct{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.55}
.f-blue{fill:var(--blue)}.f-purple{fill:var(--purple)}.f-teal{fill:var(--teal)}.f-orange{fill:var(--orange)}.f-yellow{fill:var(--yellow)}.f-green{fill:var(--green)}.f-pink{fill:var(--pink)}.f-gray{fill:var(--gray)}
.ar{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#ah)}.al{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round}.ard{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;marker-end:url(#ah)}
.err{fill:var(--error)}.ok{fill:var(--accent)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker></defs>
<rect width="900" height="576" rx="14" fill="var(--bg)"/>
<text x="450" y="42" class="title" text-anchor="middle">共享状态与问题隔离</text>
<text x="450" y="72" class="lead" text-anchor="middle">同一状态只编码一次，问题之间不读取彼此的答案</text>
<rect x="40" y="168" width="200" height="90" rx="8" class="bx f-blue"/><text x="140" y="191" class="tt" text-anchor="middle">state</text><text x="140" y="211" class="ts" text-anchor="middle">工单正文只放一份</text>
<path d="M240,213 H290" class="al"/>
<path d="M290,146 H330" class="ar"/>
<rect x="334" y="118" width="220" height="56" rx="8" class="bx f-teal"/><text x="444" y="151" class="tt" text-anchor="middle">q1 退款意图</text>
<path d="M554,146 H596" class="ar"/>
<rect x="600" y="118" width="240" height="56" rx="8" class="bx f-green"/><text x="720" y="151" class="tt" text-anchor="middle">p_i 分布</text>
<path d="M290,241 H330" class="ar"/>
<rect x="334" y="213" width="220" height="56" rx="8" class="bx f-teal"/><text x="444" y="246" class="tt" text-anchor="middle">q2 重复扣款</text>
<path d="M554,241 H596" class="ar"/>
<rect x="600" y="213" width="240" height="56" rx="8" class="bx f-green"/><text x="720" y="246" class="tt" text-anchor="middle">p_i 分布</text>
<path d="M290,336 H330" class="ar"/>
<rect x="334" y="308" width="220" height="56" rx="8" class="bx f-teal"/><text x="444" y="341" class="tt" text-anchor="middle">q3 紧急程度</text>
<path d="M554,336 H596" class="ar"/>
<rect x="600" y="308" width="240" height="56" rx="8" class="bx f-green"/><text x="720" y="341" class="tt" text-anchor="middle">p_i 分布</text>
<path d="M290,146 V336" class="al"/>
<text x="450" y="416" class="math" text-anchor="middle">p(q1, q2 | s) ≈ p(q1 | s) · p(q2 | s)，一批返回不等于语义融合</text>
<rect x="40" y="456" width="200" height="56" rx="8" class="bx f-blue"/><text x="140" y="489" class="tt" text-anchor="middle">q1 输出</text>
<path d="M240,484 H300" class="ar"/>
<rect x="304" y="456" width="220" height="56" rx="8" class="bx f-yellow"/><text x="414" y="489" class="tt" text-anchor="middle">程序组装新请求</text>
<path d="M524,484 H584" class="ar"/>
<rect x="588" y="456" width="252" height="56" rx="8" class="bx f-orange"/><text x="714" y="489" class="tt" text-anchor="middle">q2′ 查支付</text>
<text x="450" y="548" class="ts" text-anchor="middle">有真实依赖时，必须由程序接过结果，发起下一轮</text>
</svg>
