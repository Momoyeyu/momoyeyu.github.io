<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">校准要看一组预测的结果</title><desc id="desc">左侧预测为 0.2、0.5、0.8 的三组各十个事件分别有二、五、八个发生。右侧同样报 0.9，实际九个或六个发生，说明自信不等于校准。</desc><style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--panel:#ffffff;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386;--error:#a9554b;--error-bg:#f4e1dd}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--panel:#272e39;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb;--error:#e29c90;--error-bg:#4b302f}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:24px}
.title{font-size:30px;font-weight:600}.head{font-size:25px;font-weight:600}.small{font-size:20px;fill:var(--muted)}.tiny{font-size:18px;fill:var(--muted)}.math{font-family:'Times New Roman',serif;font-size:28px;font-style:italic}.strong{font-weight:600}.green{fill:var(--accent)}.red{fill:var(--error)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}.bad{fill:var(--error-bg);stroke:var(--error)}.panel{fill:var(--panel);stroke:var(--line);stroke-opacity:.4;stroke-width:1.2}
.line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.hint{stroke-dasharray:5 5}.good-arrow{stroke:var(--accent);marker-end:url(#good)}.bad-arrow{stroke:var(--error);marker-end:url(#bad)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker><marker id="good" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--accent)"/></marker><marker id="bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--error)"/></marker></defs><rect width="900" height="550" rx="14" fill="var(--bg)"/><text x="450" y="48" class="title" text-anchor="middle">校准要看一组预测的结果</text><rect x="25" y="100" width="410" height="364" rx="9" class="panel"/><rect x="465" y="100" width="410" height="364" rx="9" class="panel"/><text x="230" y="141" class="head" text-anchor="middle">预测与频率对得上</text><text x="670" y="141" class="head" text-anchor="middle">同样自信，实际结果不同</text><text x="230" y="177" class="small" text-anchor="middle">每行代表 10 个同概率事件</text><text x="670" y="177" class="small" text-anchor="middle">两组事件都预测 0.9</text><text x="51" y="233" class="math" text-anchor="start">0.2</text><circle cx="115" cy="225" r="8" fill="var(--accent)"/><circle cx="138" cy="225" r="8" fill="var(--accent)"/><circle cx="161" cy="225" r="8" fill="var(--b)"/><circle cx="184" cy="225" r="8" fill="var(--b)"/><circle cx="207" cy="225" r="8" fill="var(--b)"/><circle cx="230" cy="225" r="8" fill="var(--b)"/><circle cx="253" cy="225" r="8" fill="var(--b)"/><circle cx="276" cy="225" r="8" fill="var(--b)"/><circle cx="299" cy="225" r="8" fill="var(--b)"/><circle cx="322" cy="225" r="8" fill="var(--b)"/><text x="402" y="233" class="small" text-anchor="end">2/10</text><text x="51" y="310" class="math" text-anchor="start">0.5</text><circle cx="115" cy="302" r="8" fill="var(--accent)"/><circle cx="138" cy="302" r="8" fill="var(--accent)"/><circle cx="161" cy="302" r="8" fill="var(--accent)"/><circle cx="184" cy="302" r="8" fill="var(--accent)"/><circle cx="207" c