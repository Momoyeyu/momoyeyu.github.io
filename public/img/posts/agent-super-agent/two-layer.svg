<svg xmlns="http://www.w3.org/2000/svg" width="960" height="606" viewBox="0 0 960 606" role="img" aria-labelledby="title desc">
<title id="title">统一的入口，独立的任务上下文</title><desc id="desc">人通过 Router 统一交互。Router 将完整任务派给 Worker，Worker 在独立上下文里执行并汇报状态与结果。实线表示请求和派发，虚线表示回复和汇报。</desc>
<style>
:root{color-scheme:light dark;--paper:#fcfcfa;--ink:#29333d;--muted:#677580;--line:#84918f;--grid:#dde3df;--soft:#f0f3f0;--green:#e1eee5;--green-ink:#417558;--purple:#ece8f5;--purple-ink:#776395;--amber:#f6ecd9;--amber-ink:#956e32}
@media(prefers-color-scheme:dark){:root{--paper:#20262d;--ink:#e7ecec;--muted:#acb9bf;--line:#8b9e9c;--grid:#3e4b52;--soft:#29333a;--green:#2c443a;--green-ink:#9bc8ab;--purple:#3c354e;--purple-ink:#c1b0df;--amber:#463e2e;--amber-ink:#d9bc85}}
text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:var(--ink);font-size:21px}
.title{font-size:29px;font-weight:600;letter-spacing:.3px}.eyebrow{font-size:16px;font-weight:600;fill:var(--muted);letter-spacing:1.6px}.head{font-size:23px;font-weight:600}.small{font-size:18px;fill:var(--muted)}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}.label{font-size:19px}.green-text{fill:var(--green-ink)}.purple-text{fill:var(--purple-ink)}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.4}.soft{fill:var(--soft)}.green{fill:var(--green)}.purple{fill:var(--purple)}.amber{fill:var(--amber)}.panel{fill:var(--soft);stroke:var(--grid);stroke-width:1.2}.dash{stroke-dasharray:6 5}.wire{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.return{stroke-dasharray:5 5;stroke:var(--purple-ink);marker-end:url(#back)}.fast{stroke:var(--green-ink);stroke-width:2.5;marker-end:url(#fast)}.grid{stroke:var(--grid);stroke-width:1}.dot{fill:var(--green-ink)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--line)"/></marker>
<marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--purple-ink)"/></marker>
<marker id="fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--green-ink)"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="var(--line)" stroke-opacity=".15"/></pattern>
</defs>
<rect width="960" height="606" rx="12" fill="var(--paper)"/>
<text x="32" y="29" class="eyebrow" text-anchor="start">01 / 任务分工</text>
<text x="32" y="71" class="title" text-anchor="start">统一的入口，独立的任务上下文</text>
<rect x="235" y="109" width="490" height="58" rx="9" class="box amber"/>
<text x="480" y="145" class="" text-anchor="middle">用户入口 · 群聊 / GitHub / 邮件</text>
<path d="M450 167 V218" class="arrow" />
<text x="434" y="199" class="small" text-anchor="end">请求</text>
<path d="M510 218 V167" class="arrow return" />
<text x="526" y="199" class="small" text-anchor="start">回复</text>
<rect x="235" y="218" width="490" height="91" rx="9" class="box purple"/>
<text x="480" y="254" class="head" text-anchor="middle">Router</text>
<text x="480" y="285" class="small" text-anchor="middle">接收请求 · 分派任务 · 汇总进展</text>
<path d="M300 309 L140 402" class="arrow" />
<path d="M172 402 L332 309" class="arrow return" />
<rect x="32" y="402" width="248" height="142" rx="9" class="box green"/>
<text x="156" y="435" class="head" text-anchor="middle">Worker A</text>
<text x="156" y="466" class="" text-anchor="middle">排查登录故障</text>
<rect x="48" y="486" width="216" height="40" rx="9" class="box"/>
<text x="156" y="512" class="small" text-anchor="middle">独立上下文 + 工具</text>
<path d="M466 309 L464 402" class="arrow" />
<path d="M496 402 L494 309" class="arrow return" />
<rect x="356" y="402" width="248" height="142" rx="9" class="box green"/>
<text x="480" y="435" class="head" text-anchor="middle">Worker B</text>
<text x="480" y="466" class="" text-anchor="middle">更新部署文档</text>
<rect x="372" y="486" width="216" height="40" rx="9" class="box"/>
<text x="480" y="512" class="small" text-anchor="middle">独立上下文 + 工具</text>
<path d="M628 309 L788 402" class="arrow" />
<path d="M820 402 L660 309" class="arrow return" />
<rect x="680" y="402" width="248" height="142" rx="9" class="box green"/>
<text x="804" y="435" class="head" text-anchor="middle">Worker C</text>
<text x="804" y="466" class="" text-anchor="middle">整理技术资料</text>
<rect x="696" y="486" width="216" height="40" rx="9" class="box"/>
<text x="804" y="512" class="small" text-anchor="middle">独立上下文 + 工具</text>
<path d="M64 579 H110" class="arrow" />
<text x="122" y="585" class="small" text-anchor="start">任务派发</text>
<path d="M280 579 H326" class="arrow return" />
<text x="338" y="585" class="small" text-anchor="start">状态与结果</text>
<text x="928" y="585" class="small" text-anchor="end">执行过程留在各自会话中</text>
</svg>
