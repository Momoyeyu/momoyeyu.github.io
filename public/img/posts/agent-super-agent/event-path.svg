<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">事件的准入与分流</title>
<desc id="desc">外部事件先经过代码写的准入规则，不通过的直接丢弃，模型不被调用。通过准入的事件再看有没有订阅者：已经订阅该话题的 Worker 直接收到，没有订阅者的才交给 Router 判断是否派活。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}
.title{font-size:25px;font-weight:600}.head{font-size:21px;font-weight:600}.small{font-size:17px;fill:var(--muted)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}
.arrow{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}
.drop{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:4 4;opacity:.55;stroke-linejoin:round;marker-end:url(#arrow)}
.cross{stroke:var(--line);stroke-width:1.6;opacity:.5}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker>
</defs>

<text x="450" y="34" class="title" text-anchor="middle">一条事件怎样找到负责的 Worker</text>
<text x="450" y="62" class="small" text-anchor="middle">先按代码准入，再按订阅关系分流</text>

<rect x="30" y="215" width="136" height="70" rx="6" class="box"/>
<text x="98" y="246" text-anchor="middle">外部事件</text>
<text x="98" y="270" class="small" text-anchor="middle">PR · CI · 群聊</text>

<rect x="200" y="208" width="162" height="84" rx="6" class="box c"/>
<text x="281" y="243" class="head" text-anchor="middle">代码准入</text>
<text x="281" y="271" class="small" text-anchor="middle">来源 · 群组 · 白名单</text>

<rect x="402" y="208" width="162" height="84" rx="6" class="box b"/>
<text x="483" y="243" class="head" text-anchor="middle">已有订阅者</text>
<text x="483" y="271" class="small" text-anchor="middle">查订阅表</text>

<rect x="650" y="96" width="200" height="86" rx="6" class="box a"/>
<text x="750" y="132" class="head" text-anchor="middle">Worker</text>
<text x="750" y="160" class="small" text-anchor="middle">直接收到后续事件</text>

<rect x="650" y="312" width="200" height="86" rx="6" class="box c"/>
<text x="750" y="348" class="head" text-anchor="middle">Router</text>
<text x="750" y="376" class="small" text-anchor="middle">判断是否派活</text>

<path d="M168 250 H194" class="arrow"/>
<path d="M362 250 H396" class="arrow"/>

<path d="M281 292 V352" class="drop"/>
<text x="281" y="378" class="small" text-anchor="middle">丢弃，模型不参与</text>

<path d="M483 208 V152 H644" class="arrow"/>
<text x="560" y="136" class="small" text-anchor="middle">有订阅 · 代码直通</text>

<path d="M483 292 V340 H644" class="arrow"/>
<text x="560" y="326" class="small" text-anchor="middle">无订阅 · 交模型判断</text>

<path d="M750 312 V186" class="arrow"/>
<text x="762" y="256" class="small">派发</text>

<text x="450" y="462" class="small" text-anchor="middle">Router 始终看得见全部事件，但只对还没有订阅者的事件做判断</text>
<text x="450" y="490" class="small" text-anchor="middle">直通改变的是消息怎么走，没有放宽谁能让它干活</text>
</svg>
