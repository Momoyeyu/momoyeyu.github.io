<svg xmlns="http://www.w3.org/2000/svg" width="960" height="642" viewBox="0 0 960 642" role="img" aria-labelledby="title desc">
<title id="title">新话题交给 Router，后续消息直接送达</title><desc id="desc">事件先由代码检查准入。已订阅的 Thread 通过代码直达已有 Worker；没有订阅者的 Thread 交 Router 判断，按需创建 Worker 并建立订阅。</desc>
<style>
:root{color-scheme:light dark;--paper:#fcfcfa;--ink:#29333d;--muted:#677580;--line:#84918f;--grid:#dde3df;--soft:#f0f3f0;--green:#e1eee5;--green-ink:#417558;--purple:#ece8f5;--purple-ink:#776395;--amber:#f6ecd9;--amber-ink:#956e32}
@media(prefers-color-scheme:dark){:root{--paper:#20262d;--ink:#e7ecec;--muted:#acb9bf;--line:#8b9e9c;--grid:#3e4b52;--soft:#29333a;--green:#2c443a;--green-ink:#9bc8ab;--purple:#3c354e;--purple-ink:#c1b0df;--amber:#463e2e;--amber-ink:#d9bc85}}
text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:var(--ink);font-size:21px}
.title{font-size:29px;font-weight:600;letter-spacing:.3px}.eyebrow{font-size:16px;font-weight:600;fill:var(--muted);letter-spacing:1.6px}.head{font-size:23px;font-weight:600}.small{font-size:18px;fill:var(--muted)}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}.label{font-size:19px}.green-text{fill:var(--green-ink)}.purple-text{fill:var(--purple-ink)}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.4}.soft{fill:var(--soft)}.green{fill:var(--green)}.purple{fill:var(--purple)}.amber{fill:var(--amber)}.panel{fill:var(--soft);stroke:var(--grid);stroke-width:1.2}.dash{stroke-dasharray:6 5}.wire{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.return{stroke-dasharray:5 5;stroke:var(--purple-ink);marker-end:url(#back)}.fast{stroke:var(--green-ink);stroke-width:2.5;marker-end:url(#fast)}.grid{stroke:var(--grid);stroke-width:1}.dot{fill:var(--green-ink)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--line)"/></marker>
<marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--purple-ink)"/></marker>
<marker id="fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--green-ink)"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="var(--line)" stroke-opacity=".15"/></pattern>
</defs>
<rect width="960" height="642" rx="12" fill="var(--paper)"/>
<text x="32" y="29" class="eyebrow" text-anchor="start">02 / 事件流转</text>
<text x="32" y="71" class="title" text-anchor="start">新话题交给 Router，后续消息直接送达</text>
<rect x="32" y="231" width="176" height="86" rx="9" class="box amber"/>
<text x="120" y="266" class="head" text-anchor="middle">外部事件</text>
<text x="120" y="295" class="small" text-anchor="middle">群聊 · PR · CI</text>
<path d="M208 274 H258" class="arrow" />
<rect x="258" y="231" width="186" height="86" rx="9" class="box"/>
<text x="351" y="266" class="head" text-anchor="middle">准入规则</text>
<text x="351" y="295" class="small" text-anchor="middle">来源 / 群组 / 发送者</text>
<path d="M444 274 H492" class="arrow" />
<rect x="492" y="231" width="172" height="86" rx="9" class="box"/>
<text x="578" y="266" class="head" text-anchor="middle">查询订阅</text>
<text x="578" y="295" class="small" text-anchor="middle">按 Thread ID</text>
<path d="M578 231 V159 H738" class="arrow fast" />
<text x="595" y="139" class="small green-text" text-anchor="start">已有订阅</text>
<rect x="738" y="116" width="190" height="86" rx="9" class="box green"/>
<text x="833" y="151" class="head" text-anchor="middle">已有 Worker</text>
<text x="833" y="180" class="small" text-anchor="middle">直接接收新线索</text>
<path d="M578 317 V397 H738" class="arrow" />
<text x="595" y="378" class="small" text-anchor="start">没有订阅</text>
<rect x="738" y="354" width="190" height="86" rx="9" class="box purple"/>
<text x="833" y="389" class="head" text-anchor="middle">Router</text>
<text x="833" y="418" class="small" text-anchor="middle">判断是否行动</text>
<path d="M833 440 V514" class="arrow" />
<text x="816" y="477" class="small" text-anchor="end">需要行动</text>
<rect x="738" y="514" width="190" height="86" rx="9" class="box green"/>
<text x="833" y="549" class="head" text-anchor="middle">新 Worker</text>
<text x="833" y="578" class="small" text-anchor="middle">建立 Thread 订阅</text>
<path d="M351 317 V514" class="arrow dash" />
<text x="333" y="401" class="small" text-anchor="end">不符合规则</text>
<rect x="268" y="514" width="166" height="60" rx="9" class="box soft"/>
<text x="351" y="552" class="" text-anchor="middle">忽略事件</text>
<text x="32" y="615" class="small" text-anchor="start">直通省去重复路由；事件送达后，操作仍需遵守权限规则。</text>
</svg>
