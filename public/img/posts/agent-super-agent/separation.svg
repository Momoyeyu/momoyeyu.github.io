<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">循环在云端，工作环境按需连接</title><desc id="desc">云端 Agent 循环与持久化会话状态分开，通过守护进程使用不同执行环境。独立 Watchdog 定期检查故障与任务进展。本地设备离线后，依赖该设备的操作需要等待。</desc>
<style>
:root{color-scheme:light dark;--paper:#fcfcfa;--ink:#29333d;--muted:#677580;--line:#84918f;--grid:#dde3df;--soft:#f0f3f0;--green:#e1eee5;--green-ink:#417558;--purple:#ece8f5;--purple-ink:#776395;--amber:#f6ecd9;--amber-ink:#956e32}
@media(prefers-color-scheme:dark){:root{--paper:#20262d;--ink:#e7ecec;--muted:#acb9bf;--line:#8b9e9c;--grid:#3e4b52;--soft:#29333a;--green:#2c443a;--green-ink:#9bc8ab;--purple:#3c354e;--purple-ink:#c1b0df;--amber:#463e2e;--amber-ink:#d9bc85}}
text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:var(--ink);font-size:21px}
.title{font-size:29px;font-weight:600;letter-spacing:.3px}.eyebrow{font-size:16px;font-weight:600;fill:var(--muted);letter-spacing:1.6px}.head{font-size:23px;font-weight:600}.small{font-size:18px;fill:var(--muted)}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px}.label{font-size:19px}.green-text{fill:var(--green-ink)}.purple-text{fill:var(--purple-ink)}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.4}.soft{fill:var(--soft)}.green{fill:var(--green)}.purple{fill:var(--purple)}.amber{fill:var(--amber)}.panel{fill:var(--soft);stroke:var(--grid);stroke-width:1.2}.dash{stroke-dasharray:6 5}.wire{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.return{stroke-dasharray:5 5;stroke:var(--purple-ink);marker-end:url(#back)}.fast{stroke:var(--green-ink);stroke-width:2.5;marker-end:url(#fast)}.grid{stroke:var(--grid);stroke-width:1}.dot{fill:var(--green-ink)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--line)"/></marker>
<marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--purple-ink)"/></marker>
<marker id="fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="var(--green-ink)"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="var(--line)" stroke-opacity=".15"/></pattern>
</defs>
<rect width="960" height="660" rx="12" fill="var(--paper)"/>
<text x="32" y="29" class="eyebrow" text-anchor="start">06 / 持续运行</text>
<text x="32" y="71" class="title" text-anchor="start">循环在云端，工作环境按需连接</text>
<rect x="32" y="111" width="602" height="270" rx="9" class="panel"/>
<text x="54" y="145" class="small" text-anchor="start">云端</text>
<rect x="58" y="180" width="242" height="128" rx="9" class="box purple"/>
<text x="179" y="217" class="head" text-anchor="middle">Agent 循环</text>
<text x="179" y="250" class="" text-anchor="middle">Router / Worker</text>
<text x="179" y="280" class="small" text-anchor="middle">容器可替换</text>
<rect x="390" y="180" width="218" height="128" rx="9" class="box"/>
<ellipse cx="499" cy="195" rx="109" ry="15" class="box"/>
<text x="499" y="247" class="head" text-anchor="middle">持久化状态</text>
<text x="499" y="280" class="small" text-anchor="middle">会话 / 事件 / 关联</text>
<path d="M300 235 H388" class="arrow" />
<text x="344" y="219" class="small" text-anchor="middle">保存</text>
<path d="M390 275 H302" class="arrow" />
<text x="344" y="301" class="small" text-anchor="middle">恢复</text>
<rect x="682" y="111" width="246" height="145" rx="9" class="box amber"/>
<text x="805" y="151" class="head" text-anchor="middle">Watchdog</text>
<text x="805" y="185" class="small" text-anchor="middle">基础设施是否正常</text>
<text x="805" y="216" class="small" text-anchor="middle">任务是否取得进展</text>
<text x="805" y="243" class="small" text-anchor="middle">独立运行 · 定期巡检</text>
<path d="M682 183 H652 V163 H179 V180" class="arrow dash" />
<text x="344" y="154" class="small" text-anchor="middle">巡检与恢复</text>
<path d="M179 308 V410 H795" class="wire" />
<path d="M175 410 V468" class="arrow" />
<path d="M485 410 V468" class="arrow" />
<path d="M795 410 V468" class="arrow" />
<text x="480" y="448" class="small" text-anchor="middle">通过守护进程执行命令，返回工具结果</text>
<rect x="42" y="468" width="266" height="126" rx="9" class="box soft dash"/>
<text x="175" y="502" class="head" text-anchor="middle">本地 Mac</text>
<rect x="60" y="516" width="230" height="31" rx="9" class="box"/>
<text x="175" y="538" class="small" text-anchor="middle">轻量守护进程</text>
<text x="175" y="577" class="small" text-anchor="middle">离线 · 等待本地代码</text>
<rect x="352" y="468" width="266" height="126" rx="9" class="box green"/>
<text x="485" y="502" class="head" text-anchor="middle">远程开发机</text>
<rect x="370" y="516" width="230" height="31" rx="9" class="box"/>
<text x="485" y="538" class="small" text-anchor="middle">轻量守护进程</text>
<text x="485" y="577" class="small" text-anchor="middle">在线 · 执行任务</text>
<rect x="662" y="468" width="266" height="126" rx="9" class="box green"/>
<text x="795" y="502" class="head" text-anchor="middle">云端沙箱</text>
<rect x="680" y="516" width="230" height="31" rx="9" class="box"/>
<text x="795" y="538" class="small" text-anchor="middle">轻量守护进程</text>
<text x="795" y="577" class="small" text-anchor="middle">在线 · 执行任务</text>
<text x="480" y="632" class="small" text-anchor="middle">设备离线时，云端仍可接收消息并推进其他任务。</text>
</svg>
