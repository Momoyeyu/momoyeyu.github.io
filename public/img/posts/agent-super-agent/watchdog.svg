<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
<title id="title">看门狗巡检</title>
<desc id="desc">三个 Worker 的进程都在线，但其中一个在原地打转。独立的 Watchdog 会话由定时消息唤醒，逐一检查进展，而不只是看进程是否存活。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}
.title{font-size:25px;font-weight:600}.head{font-size:21px;font-weight:600}.small{font-size:17px;fill:var(--muted)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.b{fill:var(--b)}.c{fill:var(--c)}
.probe{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 4;opacity:.6;stroke-linejoin:round;marker-end:url(#arrow)}
.arrow{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round;marker-end:url(#arrow)}
.dot{fill:var(--accent)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker>
</defs>

<text x="450" y="34" class="title" text-anchor="middle">看门狗独立在主系统之外巡检</text>
<text x="450" y="62" class="small" text-anchor="middle">进程都在线，不等于任务在推进</text>

<rect x="330" y="88" width="240" height="64" rx="6" class="box b"/>
<text x="450" y="118" class="head" text-anchor="middle">Watchdog</text>
<text x="450" y="141" class="small" text-anchor="middle">由定时消息唤醒</text>

<path d="M420 152 V194 H160 V226" class="probe"/>
<path d="M450 152 V226" class="probe"/>
<path d="M480 152 V194 H740 V226" class="probe"/>

<rect x="60" y="230" width="200" height="80" rx="6" class="box a"/>
<text x="160" y="264" class="head" text-anchor="middle">Worker A</text>
<text x="160" y="292" class="small" text-anchor="middle">有进展</text>
<circle cx="232" cy="248" r="5" class="dot"/>

<rect x="350" y="230" width="200" height="80" rx="6" class="box"/>
<text x="450" y="264" class="head" text-anchor="middle">Worker B</text>
<text x="450" y="292" class="small" text-anchor="middle">原地打转</text>
<circle cx="532" cy="248" r="5" class="dot"/>

<rect x="640" y="230" width="200" height="80" rx="6" class="box a"/>
<text x="740" y="264" class="head" text-anchor="middle">Worker C</text>
<text x="740" y="292" class="small" text-anchor="middle">有进展</text>
<circle cx="812" cy="248" r="5" class="dot"/>

<text x="450" y="350" class="small" text-anchor="middle">它有自己的工具集，可以追问原因，也可以在运行时调整提示词与触发规则</text>
</svg>
