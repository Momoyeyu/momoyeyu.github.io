<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">四种设计的完成时间分布</title>
<desc id="desc">同一组合成负载下四种设计的完成时间。Super-agent 的中位数 12.4 分钟、p95 15.7 分钟；关闭直通后为 12.6 与 15.5；单会话配中性提示词为 20.4 与 29.5；单会话配优先委派提示词为 13.8 与 29.0。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:19px}
.title{font-size:25px;font-weight:600}.small{font-size:17px;fill:var(--muted)}
.range{stroke:var(--line);stroke-width:3;stroke-linecap:round;opacity:.45}
.p50{fill:var(--accent)}
.p95{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.tick{stroke:var(--line);stroke-width:1;opacity:.4}
.val{font-size:17px}
</style>

<text x="450" y="34" class="title" text-anchor="middle">完成时间的分布，线段越长长尾越重</text>
<text x="450" y="62" class="small" text-anchor="middle">同一组合成负载，每种设计跑 5 次</text>

<text x="285" y="115" text-anchor="end">Super-agent</text>
<path d="M367 110 H460" class="range"/>
<circle cx="367" cy="110" r="5.5" class="p50"/>
<circle cx="460" cy="110" r="5.5" class="p95"/>
<text x="367" y="96" class="val" text-anchor="middle">12.4</text>
<text x="460" y="96" class="val" text-anchor="middle">15.7</text>

<text x="285" y="170" text-anchor="end">关闭直通</text>
<path d="M373 165 H454" class="range"/>
<circle cx="373" cy="165" r="5.5" class="p50"/>
<circle cx="454" cy="165" r="5.5" class="p95"/>
<text x="373" y="151" class="val" text-anchor="middle">12.6</text>
<text x="454" y="151" class="val" text-anchor="middle">15.5</text>

<text x="285" y="225" text-anchor="end">单会话 · 中性提示词</text>
<path d="M591 220 H846" class="range"/>
<circle cx="591" cy="220" r="5.5" class="p50"/>
<circle cx="846" cy="220" r="5.5" class="p95"/>
<text x="591" y="206" class="val" text-anchor="middle">20.4</text>
<text x="846" y="206" class="val" text-anchor="middle">29.5</text>

<text x="285" y="280" text-anchor="end">单会话 · 优先委派</text>
<path d="M406 275 H832" class="range"/>
<circle cx="406" cy="275" r="5.5" class="p50"/>
<circle cx="832" cy="275" r="5.5" class="p95"/>
<text x="406" y="261" class="val" text-anchor="middle">13.8</text>
<text x="832" y="261" class="val" text-anchor="middle">29.0</text>

<path d="M300 320 H860" class="tick"/>
<path d="M300 314 V326" class="tick"/>
<path d="M440 314 V326" class="tick"/>
<path d="M580 314 V326" class="tick"/>
<path d="M720 314 V326" class="tick"/>
<path d="M860 314 V326" class="tick"/>
<text x="300" y="344" class="small" text-anchor="middle">10</text>
<text x="440" y="344" class="small" text-anchor="middle">15</text>
<text x="580" y="344" class="small" text-anchor="middle">20</text>
<text x="720" y="344" class="small" text-anchor="middle">25</text>
<text x="860" y="344" class="small" text-anchor="middle">30</text>
<text x="580" y="374" class="small" text-anchor="middle">完成时间 / 分钟</text>

<text x="450" y="404" class="small" text-anchor="middle">实心点 p50，空心点 p95</text>
</svg>
