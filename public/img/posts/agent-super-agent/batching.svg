<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Router 的批处理</title>
<desc id="desc">事件稀疏时，每个事件单独占用一轮推理。事件突发时，一轮推理期间到达的事件排在下一轮一起进入同一次调用，预填充阶段并行计算，因此单次请求耗时增长有限，每次决策分摊的推理时间反而下降。</desc>
<style>
:root{--fg:#29303b;--line:#657285;--bg:#f8fafc;--a:#e0eee6;--b:#e7e4f3;--c:#f7ead6;--accent:#508369;--muted:#667386}
@media(prefers-color-scheme:dark){:root{--fg:#e0e5ec;--line:#a4afbd;--bg:#222731;--a:#283e35;--b:#353148;--c:#483b2b;--accent:#86b49b;--muted:#b2bdcb}}
text{font-family:Helvetica,Arial,'PingFang SC',sans-serif;fill:var(--fg);font-size:20px}
.title{font-size:25px;font-weight:600}.head{font-size:21px;font-weight:600}.small{font-size:17px;fill:var(--muted)}
.stat{font-size:23px;font-weight:600;fill:var(--accent)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.4}.a{fill:var(--a)}.c{fill:var(--c)}
.arrow{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round;marker-end:url(#arrow)}
.axis{stroke:var(--line);stroke-width:1.3;opacity:.6}
.dot{fill:var(--line)}
.divider{stroke:var(--line);stroke-width:1;stroke-dasharray:4 5;opacity:.4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="var(--line)"/></marker>
</defs>

<text x="450" y="34" class="title" text-anchor="middle">事件排队合并，越忙反而越省</text>
<text x="450" y="62" class="small" text-anchor="middle">一轮推理期间到达的事件排到下一轮，一起进入预填充</text>

<text x="230" y="122" class="head" text-anchor="middle">事件稀疏</text>
<text x="670" y="122" class="head" text-anchor="middle">事件突发</text>
<path d="M450 96 V300" class="divider"/>

<path d="M60 250 H400" class="axis"/>
<rect x="85" y="180" width="50" height="40" rx="5" class="box a"/>
<text x="110" y="206" class="small" text-anchor="middle">1</text>
<rect x="190" y="180" width="50" height="40" rx="5" class="box a"/>
<text x="215" y="206" class="small" text-anchor="middle">1</text>
<rect x="295" y="180" width="50" height="40" rx="5" class="box a"/>
<text x="320" y="206" class="small" text-anchor="middle">1</text>
<path d="M110 240 V226" class="arrow"/>
<path d="M215 240 V226" class="arrow"/>
<path d="M320 240 V226" class="arrow"/>
<circle cx="110" cy="250" r="3.6" class="dot"/>
<circle cx="215" cy="250" r="3.6" class="dot"/>
<circle cx="320" cy="250" r="3.6" class="dot"/>
<text x="230" y="290" class="small" text-anchor="middle">每个事件单独占一轮</text>

<path d="M500 250 H840" class="axis"/>
<rect x="518" y="180" width="94" height="40" rx="5" class="box c"/>
<text x="565" y="206" class="small" text-anchor="middle">3</text>
<rect x="748" y="180" width="52" height="40" rx="5" class="box c"/>
<text x="774" y="206" class="small" text-anchor="middle">2</text>
<path d="M530 240 V226" class="arrow"/>
<path d="M556 240 V226" class="arrow"/>
<path d="M582 240 V226" class="arrow"/>
<path d="M760 240 V226" class="arrow"/>
<path d="M786 240 V226" class="arrow"/>
<circle cx="530" cy="250" r="3.6" class="dot"/>
<circle cx="556" cy="250" r="3.6" class="dot"/>
<circle cx="582" cy="250" r="3.6" class="dot"/>
<circle cx="760" cy="250" r="3.6" class="dot"/>
<circle cx="786" cy="250" r="3.6" class="dot"/>
<text x="670" y="290" class="small" text-anchor="middle">积压的事件合并成一批</text>

<text x="150" y="352" class="stat" text-anchor="middle">1.0 → 2.8</text>
<text x="150" y="378" class="small" text-anchor="middle">平均批次</text>

<text x="450" y="352" class="stat" text-anchor="middle">2.5 → 3.9 秒</text>
<text x="450" y="378" class="small" text-anchor="middle">单次请求耗时</text>

<text x="750" y="352" class="stat" text-anchor="middle">6.4 → 1.6 秒</text>
<text x="750" y="378" class="small" text-anchor="middle">每次决策摊销</text>

<text x="450" y="424" class="small" text-anchor="middle">事件速率从每分钟 1 个加到 40 个时的实测值</text>
</svg>
